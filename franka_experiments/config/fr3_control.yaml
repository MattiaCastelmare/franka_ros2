topics:
  joint_states_topic: /NS_1/joint_states

  # SAFETY PATH ONLY — cbf_safety_filter and qddot_to_torque read THIS one.
  #
  # /NS_1/joint_states is NOT the robot's state feed: franka.launch.py remaps
  # the controller_manager's own output to franka/joint_states and puts a
  # `joint_state_publisher` (a PYTHON node, joint_state_rate = 30 Hz) in
  # between, which REPUBLISHES ITS CACHED VALUES at a fixed rate with a FRESH
  # header stamp on every message. Two consequences, both measured on hardware:
  #
  #   1. the 100 Hz QP and the velocity box ran on a 30 Hz state — ~33 ms of
  #      pure feedback latency in the loop that is supposed to keep |qdot|
  #      under the limit;
  #   2. when that Python node stalls, the messages KEEP ARRIVING with fresh
  #      timestamps and identical content, so every staleness check downstream
  #      (joint_state_timeout included) stays happy while the filter is flying
  #      blind. Signature in the logs: vrat identical on every line, hdot equal
  #      to its own raw value to 3 decimals (an alpha=0.7 EMA cannot match the
  #      raw signal unless qdot has been constant), qdd_real decaying to zero.
  #      Both joint_velocity_violation aborts look exactly like that for the
  #      ~400 ms preceding the reflex.
  #
  # franka/joint_states is the joint_state_broadcaster's own output: 1 kHz, no
  # Python in the path, and it stops publishing outright if the RT loop dies —
  # which is what makes joint_state_timeout meaningful again.
  joint_states_fast: /NS_1/franka/joint_states
  qddot_nom:          /NS_1/qddot_nom
  velocity_topic:     /NS_1/qdot_cmd
  qdot_nom:           /NS_1/tracking_qdot
  qddot_safe:         /NS_1/qddot_safe
  torque_cmd:         /NS_1/torque_cmd
  cbf_status:         /NS_1/cbf_status
  multi_distance:     /human_robot/multi_distance
  per_link_distances: /cbf/per_link_distances

params:
  # Safety distances — used by cbf_safety_filter and cbf_velocity_filter
  d_safe: 0.10          # minimum safe distance from obstacles [m]
                        # VALUE UNCHANGED, MEANING TIGHTENED: the barrier is now
                        # h = LinkDistance.distance - d_safe, i.e. measured from
                        # the capsule SURFACE. It used to be rebuilt as
                        # ||closest_point_robot - closest_point_human|| - d_safe,
                        # which is the distance from the segment AXIS and so
                        # silently added back the capsule radius (0.05 m) plus
                        # the dilation margin (0.014 m at Z=0.5 m, ~0.11 m at
                        # Z=2 m). The effective standoff therefore GREW by
                        # 6-16 cm at the same numeric value. Re-tune against
                        # hardware before assuming 0.20 still behaves as before;
                        # it is now honest, not equivalent.
  # TODO[LEGACY]: read by no active node | confidence: high | superseded-by: d_safe | flagged: 2026-09-01
  d_safe_default: 0.1  # alias kept for backward compatibility

  # ── QP solver: one slack per constraint FAMILY ─────────────────────────────
  # A single shared slack couples families that are not even in the same units.
  # Measured: a joint-limit row (radians) drove the shared slack to 3.37, and
  # that same 3.37 relaxed every self-collision row (metres) until the firmware
  # fired self_collision_avoidance_violation itself. Separate slacks let one
  # family yield without disarming the others.
  #
  # Prices reflect what a violation actually costs:
  #   obstacle  - the human. Expensive.
  #   self-col  - the only violation the robot cannot undo, and only the
  #               firmware reflex sits behind it. Dearest, so these rows yield
  #               LAST even though their horizon is the narrowest.
  #   joint-lim - the hard box underneath is the real guarantee; the row only
  #               shapes the approach, so letting it yield costs little.
  rho_slack: 1000.0                  # obstacle rows
  rho_slack_self_collision: 20000.0  # self-collision rows
  rho_slack_joint_limit: 200.0       # joint-limit rows
  rho_slack_singularity: 2000.0      # singularity row (sigma_min of J)
  # Retreat-cap rows. CHEAPEST family on purpose: the cap and the obstacle
  # barrier bound the SAME quantity from opposite sides, and when a human closes
  # faster than the cap allows no command satisfies both. The cap must yield —
  # keep this well below rho_slack or a comfort bound outranks the barrier.
  rho_slack_retreat: 100.0
  # Task-space speed rows. Between the retreat cap and the barrier: dearer than
  # a comfort bound (this is what stops a link from jumping its own clearance
  # between two perception frames) but still cheaper than the barrier, so a
  # genuine emergency retreat can buy its way past.
  rho_slack_link_speed: 500.0
  qp_solver: osqp
  # TODO[LEGACY]: read by no active node | confidence: high | superseded-by: qp_rate_hz | flagged: 2026-09-01
  control_rate_hz: 100.0
  distance_timeout: 0.5   # [s] stale distance data → passthrough

  # ── cbf_safety_filter decoupled rates ───────────────────────────────────
  qp_rate_hz: 100.0           # QP loop: solve + publish only (no Pinocchio); aligned to pentagon rate_hz (100 Hz) — upstream is camera-limited ~30 Hz, so >100 Hz adds no real safety info and only worsens GIL contention with the 50 Hz constraint rebuild
  cbf_update_rate_hz: 50.0    # constraint geometry rebuild (A, h̄) from 30 Hz input
  nom_timeout: 0.5            # [s] stale qddot_nom → braking -k_brake*qdot
  joint_state_timeout: 0.1    # [s] stale joint state → braking on last known qdot

  # ── Content freshness, behind joint_state_timeout ──────────────────────────
  # The timeout above only knows WHEN a message arrived. A republisher that
  # re-stamps its cached values keeps it happy forever while the filter
  # integrates a state that stopped moving -- the shape of two logged
  # joint_velocity_violation aborts. So also watch the CONTENT: a bit-identical
  # (q, qdot) for longer than this, while the arm is measurably moving, is a
  # dead feed and not a still robot.
  joint_state_freeze_timeout: 0.1     # [s] identical (q, qdot) for longer -> fault
  # [rad/s] below this a genuinely constant state is plausible (arm parked,
  # every qdot rounded to the same zero), so the check must not fire.
  joint_state_freeze_min_speed: 0.05
  min_confidence: 0.2         # per-link distance confidence threshold.
                              # INERT on the per-CP path: build_cp_messages sets
                              # LinkDistance.confidence = 1.0 unconditionally, so
                              # `ob.conf < min_confidence` never drops a row.
                              # Only the legacy MultiDistance topic carries a
                              # real find_pt_confidence() score. Left in place —
                              # it is the intended hook if per-CP confidence is
                              # ever populated — but do not tune it expecting an
                              # effect today.

  # DEPRECATED: ema_alpha was used to smooth the QP output in cbf_velocity_filter.
  # Post-QP smoothing invalidates CBF safety guarantees — do not re-introduce.
  # TODO[LEGACY]: read by no active node; post-QP smoothing was removed | confidence: high | superseded-by: none | flagged: 2026-09-01
  ema_alpha: 0.4

  # ── HOCBF acceleration-space safety filter (cbf_safety_filter) ─────────────
  # Barrier:    h = d - d_safe, where d = LinkDistance.distance, the SURFACE gap
  #             (capsule radius and mask-dilation margin already removed
  #             upstream) — NOT ||closest_point_robot - closest_point_human||,
  #             which is the segment-AXIS distance.
  # HOCBF:      n^T J qddot >= -c_i - k1*hdot - k0*h
  # One row per CONTROL POINT (11 max), all solved simultaneously.
  # TODO[LEGACY]: read by no active node; velocity-era ZCBF gain | confidence: high | superseded-by: k0_cbf + k1_cbf | flagged: 2026-09-01
  gamma: 1.0               # kept for backward compat (unused by HOCBF path)
  k0_cbf: 25.0             # HOCBF position gain  (class-K alpha_0)
  k1_cbf: 10.5             # HOCBF velocity gain  (class-K alpha_1)
                           # NOTE: with k0_cbf=25.0, k1=10.0 gives EXACTLY critical
                           # damping (Δ=k1²-4k0=0) — a knife-edge fragile to
                           # discretization/latency-induced underdamping. Kept at
                           # 10.5 → Δ=10.25>0, ζ≈1.05 (mildly overdamped) for margin;
                           # checked safe vs cbf_activation_margin (penetration ≤~1 cm
                           # at 1 m/s, less than at k1=10.0). See CBF review notes.
                           # Do NOT "round down" to 10.0 without re-checking Δ.

  # ── Zone ladder: gap-scheduled aggressiveness (cbf_safety_filter) ──────────
  # WHAT PROBLEM THIS SOLVES. The filter changed its mind about an obstacle at
  # five independent distances that did not know about each other
  # (outrun_evasion_engage_gap 0.30, livelock_engage_gap 0.25, d_safe 0.15,
  # retreat_cap_engage_gap 0.15, governor_d_full 0.05) and the barrier itself
  # engaged at a SIXTH that is not a parameter at all. Solving h_qp = 0 gives
  #
  #     d_bind = d_safe + h_unc + (k1/k0)*|hdot|
  #
  # so with k0=25, k1=10.5 the row starts biting at 0.23 m when the arm walks
  # in at 0.12 m/s and at 0.29 m when it walks in at 0.25 m/s. Measured on
  # hardware: the obstacle slack first went non-zero at d=0.227 against 0.235
  # predicted. The engagement distance was a function of how fast you happened
  # to arrive, and nothing in this file said so.
  #
  # The ladder makes it explicit. FOUR RUNGS on the measured surface gap,
  # every boundary a MULTIPLE OF d_safe (shipped ratios; metres at d_safe=0.20):
  #
  #   notice   >= 1.0·d_safe       (0.20)  low bandwidth: engages EARLY (larger
  #                      k1/k0 pushes d_bind out) and pushes GENTLY. The speed
  #                      dependence is kept deliberately — a fast obstacle is
  #                      noticed further out, which is "prepare sooner when it
  #                      is coming fast" for free, with no extra parameter.
  #   active   1.0-0.5·d_safe (0.20-0.10)  k0_cbf / k1_cbf themselves.
  #   priority 0.5-0.25·d_safe(0.10-0.05)  high bandwidth AND a slack
  #                      multiplier below 1, so the QP can no longer buy its
  #                      way out of the row by paying tracking error.
  #   hold     < 0.25·d_safe       (0.05)  priority gains, plus the TASK is
  #                      switched off.
  #
  # WHY HOLD IS NOT A FREEZE. The nominal is faded into -k_brake*qdot, so the
  # arm sheds its speed and stops pursuing the path, while every barrier row
  # keeps full authority to push it away. It is not a latch, for three reasons
  # measured on the same hardware log the ladder was designed from:
  #   * the calibration residual read 4.2 cm with 4.2 cm of spread, so the 5 cm
  #     boundary sits INSIDE the error of the sensor that defines it;
  #   * a control point went 0.242 -> 0.077 -> 0.253 m in three consecutive
  #     depth frames and the approach-jump limiter still passed 67 mm through;
  #   * h_unc, the filter's own admitted ignorance, ranges 0.032-0.092 m.
  # A latch would fire on that noise, repeatedly, and each firing is a hard
  # stop of a moving arm. Worse, freezing is the WRONG answer to the case that
  # matters: a limb still closing at 0.3 m/s reaches a frozen arm in 130 ms.
  #
  # OFF here so a flags-off build produces bit-identical QP rows (asserted by
  # test_cbf_zone_ladder). launch_defaults.yaml turns it ON, same as the
  # outrun and livelock flags.
  enable_zone_ladder: false

  # [-] Rung boundaries on the MEASURED surface gap, as MULTIPLES OF d_safe:
  # boundary [m] = zone_r_* x d_safe. The measured gap and not the tightened
  # h_bar: these are a statement about where the obstacle IS, the number you
  # read off the log and off a tape measure. Scheduling off h_bar would make
  # the rungs move whenever the uncertainty margin or the braking term moved,
  # which is the one thing an explicit ladder exists to stop.
  #
  # WHY RELATIVE. With absolute boundaries (0.30/0.20/0.10/0.05 m) lowering
  # d_safe moved the barrier and nothing else: at d_safe=0.03 the task was
  # still halved from ~0.12 m and suspended at 0.05 m — the hold rung sat
  # OUTSIDE the barrier, so the robot could not get closer whatever d_safe
  # said (measured 2026-09-10, runs at d_safe 0.15/0.10/0.05/0.03). Now the
  # ladder follows d_safe. d_safe sits at 2/3 of the outermost boundary
  # (1/1.5), and at d_safe=0.20 these ratios give back exactly the
  # 0.30/0.20/0.10/0.05 m ladder designed on hardware.
  #
  # CAVEAT at small d_safe: the sensor, not the ladder, becomes the limit.
  # The calibration residual read 4.2 cm with 4.2 cm of spread and h_unc never
  # drops below ~0.032 m, so below d_safe ~0.05 the inner rungs are millimetres
  # wide and sit inside the measurement noise.
  #
  # Must descend strictly (hold < priority < active < notice) or the builder
  # raises at construction rather than silently inverting a rung. The resolved
  # metres are logged at startup ("zone ladder (x d_safe=...)").
  zone_r_notice: 1.5     # d_safe = 2/3 of this. Above it the notice gains
                         # apply unchanged, which is harmless: the row is
                         # nowhere near binding there.
  zone_r_active: 1.0     # the barrier itself. Outside it the notice gains:
                         # the row binds at d_safe + h_unc + 0.583*|hdot|,
                         # inside the notice rung by construction, so the arm
                         # is already leaning away before it gets here rather
                         # than reversing its approach in one tick, which is
                         # what produced the measured jump.
  zone_r_priority: 0.5   # half-way inside d_safe. Reaching it means the
                         # barrier has already been violated, so the response
                         # stops being a compromise with the trajectory.
  zone_r_hold: 0.25      # 3/4 of d_safe violated. Deepest excursion ever
                         # measured was 8 mm inside d_safe against an obstacle
                         # closing at 0.76 m/s — this rung should essentially
                         # never be reached, and if it is, the task is the
                         # thing that gives.

  # [-] Width of the smoothstep band centred on each boundary, as a multiple of
  # d_safe (0.04 m at d_safe=0.20). A hard switch would put a step of
  # dk0*h_bar + dk1*hdot straight into the row's bound, and the measured
  # correlation between the commanded radial acceleration and -h_qp is 0.9999:
  # whatever moves that bound comes out of the joints. At the active->priority
  # boundary an unblended switch is a step of 25*h_bar, which is exactly the
  # jerk this whole exercise exists to remove.
  #
  # 0.2 leaves each rung FLAT across its middle. Clamped at construction to the
  # narrowest gap between boundaries (0.25·d_safe with the ratios above): wider
  # bands would overlap, the weights would stop summing to 1, and the blended
  # gain would leave the convex hull of the rung values — a gain nobody
  # configured.
  zone_blend_r: 0.2

  # Notice-rung gains. Chosen to hold the SAME damping as the shipped pair and
  # move only the bandwidth: zeta = k1/(2*sqrt(k0)) = 7/(2*sqrt(12)) = 1.01
  # against the shipped 10.5/(2*sqrt(25)) = 1.05. Nothing here is being made
  # springier; it is being made slower.
  #
  # Why slower matters. k1 multiplies a DERIVATIVE of a measured signal, and
  # against the arm's own velocity (an integrator) the loop crosses unity gain
  # at omega = k1. At 10.5 that is 1.67 Hz, and the hardware log rings at 1.9 Hz
  # with the commanded acceleration flipping sign every ~0.26 s and a swing of
  # 2.2 rad/s^2 dominated by the arm's own retreat speed. At 7 the crossover
  # drops to 1.11 Hz, below anything the torque loop and the 50 Hz rebuild add
  # phase to. The same change cuts the noise gain: one frame of fabricated
  # obstacle velocity (0.085 m/s was measured on a STATIC obstacle) lands as
  # 0.60 rad/s^2 instead of 0.89.
  #
  # Raising k1_notice without raising k0_notice underdamps the barrier; the two
  # move together or not at all.
  zone_k0_notice: 12.0
  zone_k1_notice: 7.0

  # Priority-rung gains, shared with the hold rung. Same rule: zeta =
  # 14/(2*sqrt(50)) = 0.99, i.e. the damping is held and only the bandwidth
  # rises, 3.5 -> 5.0 -> 7.1 rad/s across the three rungs.
  #
  # The noise gain rises with it (0.085 m/s of artefact becomes 1.19 rad/s^2
  # here) and that is accepted deliberately: at 10 cm the arm is already 5 cm
  # inside d_safe, and reacting hard to a possible approach is the correct
  # trade there in a way it is not at 25 cm.
  zone_k0_priority: 50.0
  zone_k1_priority: 14.0

  # Slack-column multipliers for the two inner rungs. The row reads
  # a^T qddot + m*s_g >= b, so m is how much relief one unit of paid slack
  # buys: m < 1 means the QP must pay MORE slack to violate the row by the same
  # amount, and the cost is 0.5*rho*s^2, so it grows with the SQUARE. m = 0.5
  # makes a violation 4x more expensive, m = 0.25 makes it 16x.
  #
  # Done here rather than by raising rho_slack because rho lives in the OSQP
  # cost matrix, and touching that forces a refactorization on a 100 Hz thread
  # that already starves its own IO callback group (see pad_rows_to_block).
  # The multiplier is already in G and costs nothing to change per rebuild.
  #
  # Floors, not zeros: m -> 0 makes the row effectively hard, and a hard row
  # the arm physically cannot satisfy is how a QP becomes infeasible. 0.25 is
  # a strong priority that still leaves the problem solvable at every pose,
  # which is the B4 "never deadlock" requirement.
  #
  # Composes with enable_weighted_slack rather than replacing it: that one asks
  # "of the rows engaged now, which can afford to yield", this one asks "how
  # close is this one to the skin". Both factors are <= 1 so the product can
  # only make a row harder to relax, never easier.
  zone_slack_m_priority: 0.5
  zone_slack_m_hold: 0.25

  # Fraction of the commander's qddot_nom REMOVED at full priority weight, i.e.
  # in the 0.10-0.05 band. 1.0 would make the priority rung indistinguishable
  # from hold and there would be no ladder, only a cliff at 0.10.
  zone_task_priority_cut: 0.5

  # [s] Time for the task to fade back in once the gap clears. Only the CLIMB
  # is rate limited; the fall is instant. The asymmetry is the same one the
  # barrier recovery (cbf_h_recovery_alpha) and the v_obs clamp already use:
  # tightening is a decision about this frame's measurement, relaxing is a
  # claim that the danger has passed, and a 5 cm boundary read by a sensor
  # with 4 cm of calibration spread will cross itself repeatedly on noise.
  # Rate limiting only the climb turns that chatter into one decision.
  #
  # 0.5 s is long enough that the resume is invisible in the joint command and
  # short enough not to be read as a hang. 0.0 restores an instant resume,
  # which will step the nominal by whatever the commander wants at that moment.
  zone_resume_s: 0.5

  # NOTE: cbf_activation_margin / cbf_hysteresis below are RETIRED for
  # cbf_safety_filter — that node replaced its old step activation gate
  # (d < d_safe + margin) with continuous HOCBF activation + the purely
  # computational cbf_obstacle_horizon. They are KEPT here only because
  # cbf_velocity_filter.py still reads them as live params (and a test refs
  # them); do NOT delete them while that node depends on them.
  # TODO[LEGACY]: read only by cbf_velocity_filter, itself flagged legacy | confidence: high | superseded-by: continuous HOCBF activation + cbf_obstacle_horizon | flagged: 2026-09-01
  cbf_activation_margin: 0.10  # [m] (cbf_velocity_filter only) activation gate
  # TODO[LEGACY]: read only by cbf_velocity_filter, itself flagged legacy | confidence: high | superseded-by: continuous HOCBF activation | flagged: 2026-09-01
  cbf_hysteresis: 0.05     # [m] (cbf_velocity_filter only) deactivation hysteresis
  cbf_obstacle_horizon: 1.2  # [m] COMPUTATIONAL cutoff for cbf_safety_filter, NOT
                           # a safety gate: the linear HOCBF self-deactivates at
                           # large d, so far obstacles add slack (non-binding)
                           # rows. This mainly avoids OSQP setup() churn from
                           # obstacles flickering near a tight boundary.
                           # n_c is bounded by the CONTROL POINT count, not the
                           # link count: perception emits one LinkDistance per
                           # CP, so the ceiling is 11 (fr3_complete.yaml
                           # segments: 2+2+2+2+3), not the ~8-9 this comment
                           # claimed while entries were pooled per link.
                           # Feasibility is unaffected — one shared slack
                           # relaxes every row at once, so widening the row set
                           # cannot empty the feasible set (see
                           # test/test_cbf_multi_cp_qp.py). Solve time and
                           # setup() churn are what to watch; lower this to trim
                           # n_c if either bites. Initial estimate.
  cbf_min_leverage: 0.05   # [m/rad] min CBF leverage ‖a‖=‖n̂ᵀJp‖ to keep a
                           # constraint. REPLACES the old cond(Jp)>1e5 test:
                           # cond(Jp) measured conditioning of the whole 3×7
                           # position map, not the leverage of the specific
                           # constraint row aᵢ=n̂ᵀJp the QP uses (high cond only
                           # weakens ‖a‖ when n̂ ≈ the ill-conditioned singular
                           # direction). 0.05 is an INITIAL estimate (~10× below
                           # the healthy O(0.3-0.8) scale) — validate empirically
                           # on FR3 (fr3_cond_probe.py) before trusting it.

  # Tangential steering: amplifies whatever sideways component qddot_nom (or,
  # failing that, the current qdot) already has orthogonal to a close
  # obstacle/self-collision row's normal, so the QP has an actual incentive to
  # go AROUND rather than just clip the blocked normal component to zero. Pure
  # bias on the QP's cost target — every hard barrier constraint (G/h) is
  # untouched, so this cannot weaken the safety guarantee, only change which
  # feasible q̈ the solver prefers. See cbf_qp_assembly.tangential_bias.
  #
  # v1 (gain=1.0, no temporal filter, no clamp) measured as visibly
  # oscillatory on hardware: a hard branch switch between "amplify qddot_nom's
  # own sideways part" and "fall back to qdot's" flipped direction on 100 Hz
  # noise straddling the switch point, and an unfiltered per-tick bias rotates
  # with âᵢ as the arm moves. v2 fixes both: tangential_bias() blends the two
  # sources continuously instead of switching (see its docstring), and the
  # gain is halved and low-pass filtered ACROSS ticks below, plus norm-capped.
  cbf_tangential_gain: 0.5          # [-] 0 disables. Halved from the v1
                                    # default alongside the smoothing changes
                                    # below — still UNTUNED, re-validate.
  cbf_tangential_engage_margin: 0.30  # [m] surface gap below which a row
                                    # contributes; 2x d_safe so steering starts
                                    # before the barrier itself gets tight.
  cbf_tangential_filter_alpha: 0.90  # [-] EMA on the bias vector ACROSS QP
                                    # ticks (100 Hz), same shape as
                                    # cbf_hdot_filter_alpha. 0 = unfiltered (the
                                    # oscillatory v1 behaviour); time constant
                                    # dt/(1-a) ~= 67 ms at 0.85 — smooths
                                    # tick-to-tick chatter while still tracking
                                    # genuine sideways motion within a step or
                                    # two of an obstacle.
  cbf_tangential_max_bias: 2.0     # [rad/s^2] cap on ||bias||, independent of
                                    # how large qddot_nom gets during a
                                    # tracking-error spike (the exact scenario
                                    # that preceded the hardware oscillation).

  # QP cost: ||qddot - qddot_nom||²  (smoothing now via slew-rate QP constraint)
  # TODO[LEGACY]: read by no active node | confidence: high | superseded-by: none | flagged: 2026-09-01
  qp_smooth_weight: 0.2    # kept for compat; unused in CBF-active mode

  # ── Slew-rate box on qddot (cbf_safety_filter) ─────────────────────────────
  # RE-ARMED. This key and utils.cbf_hard_limits.apply_slew_limit both existed
  # and were both dead (the box was a WIP feature reverted in 4d4d450).
  #
  # Nothing else in the QP bounds how fast the COMMAND may change. When the
  # obstacle becomes hard to avoid, the 50 Hz geometry snapshot can move the
  # rows enough to jump the solution in a single tick: measured on hardware,
  # dnorm went 5.278 -> 12.742 and the projected command flipped -0.569 ->
  # +3.818 rad/s^2 inside one 60 ms window. trk_err then sat at ~9.5 and never
  # recovered — the arm cannot follow a step that size, rt_torque_controller's
  # e_max clamp saturates, and the resulting bang-bang torque is what the
  # firmware sees as joint_velocity_violation.
  #
  # Encoded as a BOX intersected with the state box, not a post-QP clip: the
  # solver knows about it, so it optimises within the reachable set rather than
  # having its answer truncated afterwards. Where the slew and state boxes are
  # disjoint the result is pinned to the slew edge nearest the safety box, so a
  # temporarily unreachable safety bound is approached at the maximum admissible
  # rate — the barrier keeps its authority, it just cannot be met in one step.
  slew_box_enabled: true

  # [rad/s^2 per tick] At qp_rate_hz=100 this is 500 rad/s^3. Braking is not
  # impeded: joint4 goes 0 -> -4 (its full authority) in one tick. The wrist
  # joints, whose bound is 17, need 4 ticks (40 ms) to saturate. LOWER it if
  # trk_err stays high; RAISE it if the CBF reacts visibly late to a fast
  # approach. Watch the `slew=` field in CBFDIAG to see which joints it binds.
  max_qddot_delta: 5.0

  # Torque-rate: encoded as QP linear constraint — NOT post-dynamics clip [N·m/tick]
  # TODO[LEGACY]: read by NO code — the comment above claims it is a QP constraint; the QP has no torque row | confidence: high | superseded-by: none | flagged: 2026-09-01
  max_tau_delta: 15.0

  # Braking gain for QP-fail fallback: qddot = -k_brake * qdot
  k_brake: 3.0

  # ── Extra HOCBF rows: joint limits + self-collision ────────────────────────
  # Both used to live OUTSIDE the QP and both failed the same way: as a hard
  # box / a post-solve veto they act at the last moment, on one joint, with no
  # way for the QP to compromise. Measured on hardware: joint4 on its braking
  # curve had its box collapse to lb=0 while the commander asked for -4 rad/s²,
  # giving dnorm=10.989 with dq_ort=10.941 (the entire correction dumped
  # orthogonally to the CBF), a command the arm could not track (trk_err=8.428),
  # ending in a joint_velocity_violation reflex.
  #
  # As rows they engage early and the QP spreads the correction across joints.
  # The state-limit BOX below stays as the hard floor: a row can be relaxed by
  # the slack, a box cannot.

  joint_limit_rows_enabled: true

  # [rad] where the row's barrier sits, measured INWARD from the official limit.
  #
  # MUST STAY 0 UNLESS YOU KNOW THE TRAJECTORY DOES NOT NEED THAT BAND.
  # This was 0.10 and it broke the robot: joint6 works at ~4.51 rad, which is
  # 0.11 rad from its official 4.6216 limit and perfectly legal, but with a
  # 0.10 barrier the row saw h=+0.011 — the joint parked ON the artificial
  # barrier — and demanded qddot6 <= -0.357 on EVERY tick. Result: dnorm~10
  # sustained, slack permanently on, tracking lost (trk_err up to 16.7),
  # pentagon_qddot_commander HARD reset at 0.587 m of EE error, then a
  # joint_velocity_violation abort.
  #
  # 0.0 puts the barrier at the official limit, so the row shapes the APPROACH
  # and never removes usable range. position_margin_rad (0.05) in the box below
  # remains the hard stop.
  joint_limit_row_margin: 0.0

  # [rad] emit a row only within this distance of the barrier. Narrower than the
  # old 0.60: with the FR3's tight ranges (joint4 spans only 2.96 rad) a wide
  # horizon keeps several rows permanently in the QP — n_c hit 18 on hardware,
  # against 7 DOF plus one shared slack, and the active set chattered tick to
  # tick. Widen only if a joint reaches its limit faster than the row reacts.
  joint_limit_row_horizon: 0.30

  # Velocity-aware row horizon. The fixed horizon above has a MEASURED failure
  # mode: the position braking curve in hard_accel_box starts clipping a joint
  # from h < qdot^2/(2*a_auth), which for joint2 at 1.02 rad/s is 0.337 rad --
  # BEYOND the 0.30 rad horizon. So the hard, non-negotiable box bit while the
  # soft, negotiable row did not yet exist: the QP could not trade that joint
  # against the others and dumped the correction orthogonally instead
  # (logged: dq_ort = 19.5 rad/s^2, vbite stuck on j2, s[qlim] = 0.000 -- the
  # row was never even asked). Same shape as the joint4 incident that motivated
  # these rows in the first place.
  #
  # With this on, the horizon becomes max(horizon, lead * qdot^2/(2*a_auth)) in
  # the DIRECTION OF TRAVEL only, so a joint moving away from a limit gets no
  # inflation and n_c does not grow for nothing. The row still self-deactivates
  # through -k0*h; this only decides when it exists at all.
  #
  # OFF by default: it changes n_c, hence OSQP setup() churn, so it wants a
  # deliberate A/B rather than arriving silently.
  joint_limit_row_velocity_horizon: false

  # How far ahead of the box the row must exist. 1.0 = exactly when the braking
  # curve starts; 1.5 gives the QP half a stopping distance of warning.
  joint_limit_row_horizon_lead: 1.5

  # ── Singularity row (cbf_safety_filter) ────────────────────────────────────
  # Barrier h = sigma_min(J~) - singularity_sigma_floor, with sigma_min the
  # SMALLEST singular value of the 6x7 EE Jacobian (rotational rows scaled by
  # singularity_rot_scale so all six rows are in metres).
  #
  # WHY sigma_min and not Yoshikawa's w = sqrt(det(J J^T)): w is the PRODUCT of
  # the singular values and stays healthy while one direction is already
  # degenerate. sigma_min is the amplification bound itself — for the worst task
  # direction ||qdot|| = ||xdot|| / sigma_min — so a floor on it is literally a
  # ceiling on how much the avoidance can amplify joint speed. That is the
  # observed failure: n_act=0, d_min=0.30 m, j4/j5 both at 0.54 of their
  # velocity limit and the QP still asking for more, ending in a
  # joint_velocity_violation reflex.
  singularity_rows_enabled: true

  # [m/rad] barrier zero. NOT YET MEASURED ON THIS ROBOT — tune it from the
  # `sigma=` field CBFDIAG now prints: run a normal task, read the typical
  # sigma, then set the floor well below it and the horizon so the row is armed
  # only on the approach. Too LOW is the safe failure (the row simply never
  # activates and nothing changes); too HIGH makes it fight legitimate poses —
  # watch s[sing] in CBFDIAG, a persistently nonzero singularity slack means
  # the QP is paying every tick to hold a pose the row forbids.
  singularity_sigma_floor: 0.05

  # [m/rad] emit the row only while h < horizon. Same n_c-stability argument as
  # the joint-limit horizon: a wide horizon keeps the row permanently in the QP
  # and churns OSQP setup().
  singularity_row_horizon: 0.08

  # [m/rad] weight on the three ROTATIONAL Jacobian rows before the SVD, so the
  # singular values are not mixing metres with radians. A characteristic arm
  # length: at 0.3 a 1 rad/s spin counts like a 0.3 m/s translation.
  singularity_rot_scale: 0.3

  # [rad] forward finite-difference step for grad(sigma). Small enough that the
  # truncation error is far below the horizon, large enough to stay clear of
  # the SVD's own numerical noise.
  singularity_grad_eps: 0.0001

  # Drop the row when ||grad(sigma)|| falls below this. sigma_min is non-smooth
  # where the two smallest singular values cross, and there the finite
  # difference is meaningless — better no row than a noisy one.
  singularity_min_leverage: 0.001

  # Frame whose Jacobian defines the barrier. fr3_link8 is the flange in the
  # hand-less model the filter carries (build_urdf_no_hand).
  singularity_frame: fr3_link8

  # ── Retreat cap (cbf_safety_filter) ────────────────────────────────────────
  # The HOCBF row is one-sided: it puts a FLOOR under the separation rate and
  # nothing above it, so once the barrier is violated the floor grows with
  # k0*|h| and the QP accelerates the arm away for as long as that lasts. Fast
  # retreat next to a person is its own hazard, and nothing in the filter ever
  # said how fast is fast ENOUGH.
  #
  # These rows say it, per obstacle control point, on the same normal:
  #
  #   ramp   = clip(v_obs / depth_speed_ref, 0, 1)
  #   relief = max_speed * clip(h / engage_gap, 0, 1)
  #   n^T J qdot  <=  v_cap
  #   v_cap = min(max_speed, base_speed + obstacle_gain*v_obs
  #                                     + depth_gain*max(-h, 0)*ramp
  #                                     + relief)
  #
  # The governing idea is PROPORTIONALITY: how fast the arm may back away is set
  # by how fast the obstacle is coming in, not by how alarming the geometry
  # looks. A person stepping slowly toward the arm gets the arm stepping slowly
  # away. depth_gain*max(-h,0)*ramp is exactly 0 while the obstacle is OUTSIDE
  # d_safe, and v_obs is clamped to the approaching half only, so the moment the
  # obstacle leaves d_safe and stops closing the cap collapses back to
  # base_speed. The escalation is temporary by construction.
  retreat_cap_enabled: true

  # [m/s] the CREEP, not a retreat speed. This is what remains when the obstacle
  # is stationary, and its only job is to let the arm walk out of a violation
  # that nothing is making worse. Keep it small — it is the one term that is NOT
  # proportional to anything, so it sets the floor on "too fast for a slow
  # obstacle". Was 0.15 before the engage gap below existed; at that value it
  # also throttled ordinary task motion.
  retreat_cap_base_speed: 0.05

  # [-] THE proportional term, and the one that should dominate. 1.0 = the arm
  # may back off exactly as fast as the obstacle comes in, which holds the gap
  # without ever outrunning it — the constraint is then simply
  # h_dot = n^T J qdot - v_obs <= base_speed. Above 1.0 it gains ground.
  retreat_cap_obstacle_gain: 1.0

  # [1/s] escalation per metre of barrier violation, active ONLY inside d_safe
  # and ONLY scaled by the ramp below. At 2.0, being 5 cm inside d_safe buys
  # 0.10 m/s of extra retreat at full ramp.
  retreat_cap_depth_gain: 2.0

  # [m/s] closing speed at which the depth escalation reaches full strength.
  # This is the hole the ramp plugs: without it, a SLOW obstacle that ends up
  # deep inside d_safe authorises a FAST retreat purely because the geometry
  # looks bad — depth is not proportional to anything the obstacle is doing.
  # With it, depth can only amplify an approach that is actually happening.
  # 0 disables the ramp and restores the older speed-independent behaviour.
  retreat_cap_depth_speed_ref: 0.30

  # [m] distance over which the cap ramps from free (at h = gap, where relief
  # saturates it at max_speed) to fully proportional (at h = 0). The cap shapes
  # AVOIDANCE, not ordinary task motion: applied at full strength over the whole
  # 1.2 m cbf_obstacle_horizon it throttled the arm any time a person stood
  # anywhere nearby — logged as retreat=+0.161/0.150 with d_min=0.389 m and no
  # avoidance happening at all. With d_safe = 0.15 the default engages the
  # shaping from a 0.30 m surface gap inward.
  #
  # A RAMP and not an on/off gate on purpose: a gate would have to sit either
  # above the distance where a fast approach first engages the barrier (and
  # then it does nothing) or below it (and then the cap steps in at the worst
  # possible moment). Raise it to start shaping earlier, lower it to leave the
  # task alone for longer; 0 disables the relief entirely, so the cap applies at
  # full strength at every distance (the pre-ramp behaviour).
  retreat_cap_engage_gap: 0.15

  # [m/s] absolute ceiling regardless of the terms above. The number to lower
  # first if the arm still feels violent; the number to raise if a fast
  # approach ends in contact with s[cap] pinned at 0.
  #
  # RAISED 0.6 -> 1.1 (Sep 2026). The proportional term is base + 1.0*v_obs,
  # so at 0.6 the cap saturated from v_obs = 0.55 m/s upward and the retreat
  # was flat, not proportional, over the upper half of the 0.1-1.0 m/s range a
  # walking person covers. 1.1 keeps the cap linear up to v_obs = 1.05 m/s.
  # The closed-loop test (test_cbf_phase1_reactivity) pins that the commanded
  # retreat is monotone and near-linear in v_obs over 0.2 / 0.5 / 1.0 m/s.
  # It is still the number to lower first if the arm feels violent — and it
  # must stay BELOW link_speed_max, which is the outer whip guard.
  retreat_cap_max_speed: 1.1

  # [s] enforcement horizon: n^T J (qdot + qddot*T) <= v_cap. SYMMETRIC, unlike
  # the joint velocity box's asymmetric relax/dt pair: there, "past the cap"
  # needs one-step braking authority because it is a safety guarantee. Here
  # "past the cap" only means retreating too eagerly, and answering that with a
  # one-step deceleration demand replaces one abrupt motion with another.
  # Smoothness is the feature. Lower it for a firmer cap, raise it for a softer.
  retreat_cap_horizon_s: 0.15

  # ── Task-space speed rows (cbf_safety_filter) ──────────────────────────────
  # "Velocita feasible": a bound on how fast any CONTROL POINT travels, which
  # nothing in the filter had. The joint velocity box bounds qdot per joint, and
  # a folded or near-singular arm decouples that from task speed in BOTH
  # directions — the logged failure had every joint under 0.31 of its limit
  # while link5 and the hand closed to a 2.9 cm gap.
  #
  #   ||p_dot_i|| <= v_allow_i,   v_allow_i = min(link_speed_max,
  #                        link_speed_v_at_d_safe * obstacle_gap_i / d_safe,
  #                        self_collision_gap / link_speed_reaction_s)
  #
  # The second term is the GEOMETRIC one and the reason the row exists. The
  # barrier is rebuilt at 50 Hz from ~30 Hz perception, so a point travels
  # v*dt BLIND between evaluations; let it move faster than its own remaining
  # gap over that blind time and it crosses the barrier BETWEEN samples —
  # violating no constraint the QP ever looked at, and interpenetrating anyway.
  # That is plain discretisation tunnelling: no k0/k1 tuning fixes it, only
  # forbidding the speed that makes the gap jumpable.
  #
  # The obstacle term scales with d_safe (link_speed_v_at_d_safe below); the
  # self-collision term uses the closest self-collision gap with the fixed
  # reaction_s: a near self-collision is a whole-arm geometric event, so it
  # slows every control point, not just the pair that reported it.
  link_speed_rows_enabled: true

  # [m/s] flat ceiling on any control point's speed. Deliberately ABOVE
  # retreat_cap_max_speed (0.6): this row is the outer bound that catches a
  # whip, not the shaper of the retreat — that is the retreat cap's job, and
  # the two must not fight over the same motion.
  #
  # RAISED 0.8 -> 1.3 together with retreat_cap_max_speed (0.6 -> 1.1): the
  # ordering "outer guard above the retreat shaper" is the invariant, not the
  # numbers. At 0.8 this row would have been the thing capping a proportional
  # retreat from a 1 m/s approach, one family down from where that decision is
  # meant to be made. The GEOMETRIC term below is untouched and still binds
  # first near an obstacle (0.15 m of clearance over 0.20 s is 0.75 m/s).
  link_speed_max: 1.3

  # [s] worst-case BLIND time between barrier evaluations: perception period +
  # QP period + actuation lag, NOT the QP period alone. Raise it to make the
  # geometric term bite earlier — a point 10 cm from something may move at
  # 0.5 m/s at 0.20 s, 0.33 m/s at 0.30 s.
  # Now used only for the SELF-COLLISION term and as the uncertainty margin's
  # t_latency; the obstacle term uses link_speed_v_at_d_safe.
  link_speed_reaction_s: 0.20

  # [m/s] speed a control point may have at obstacle gap = d_safe, falling
  # linearly to 0 at contact: v <= v_at_d_safe * gap / d_safe. RELATIVE to
  # d_safe so that lowering d_safe also lets the arm approach closer and
  # faster (with a fixed 0.20 s, 5 cm of gap meant 0.25 m/s whatever d_safe
  # said). 1.0 gives back exactly gap/0.20 s at d_safe = 0.20.
  # PRICE: the implied blind time is d_safe/v_at_d_safe. Below the measured
  # worst case (~0.085 s, see latency_t_blind), i.e. d_safe < ~0.085 m at 1.0,
  # the anti-tunnelling guarantee above no longer holds.
  link_speed_v_at_d_safe: 1.0

  # [s] enforcement horizon: v_hat^T Jp (qdot + qddot*T) <= v_allow. Symmetric,
  # same reasoning as retreat_cap_horizon_s.
  link_speed_horizon_s: 0.10

  # Emit a row only when the point already exceeds this fraction of its own cap.
  # Below it the row is non-binding and would put one row per control point in
  # the QP at all times: same n_c-stability tradeoff as every other horizon gate
  # here. Watch `vlink=` in CBFDIAG — 0/0 means nothing was fast enough to earn
  # a row.
  link_speed_activate_frac: 0.5

  self_collision_rows_enabled: true

  # DELIBERATELY PERMISSIVE. These rows must not be what stops the robot; they
  # are the last geometric guard before the firmware's own
  # self_collision_avoidance_violation reflex. Restrictive settings here, plus
  # the obstacle rows, plus the joint-limit rows over-constrain a 7-DOF QP and
  # it starts fighting itself (measured: n_act swinging 2..9 tick to tick).
  #
  # ONE inflation, not two. xacro adds safety_distance to EVERY radius, so at
  # its 0.03 default a PAIR already carries 0.06 m before anything below
  # applies. Building the capsules at 0.0 and declaring the clearance once, in
  # self_collision_row_margin, keeps the number meaningful.
  self_collision_safety_distance: 0.0

  # [m] required clearance between two capsule surfaces. This IS the whole
  # margin now.
  self_collision_row_margin: 0.02

  # [m] gap below which a pair produces a row at all. 0.08 means the rows are
  # silent in every normal pose and appear only on a genuine approach — the old
  # 0.15 on top of 0.06 of capsule inflation demanded 0.21 m of real clearance
  # and was essentially always on.
  self_collision_row_horizon: 0.08

  # Cap on simultaneous self-collision rows (closest pairs win), so n_c stays
  # bounded and OSQP does not re-setup() every tick.
  #
  # RAISED 3 -> 8. At 3 out of 24 pairs the top-N set SWAPS as the arm moves:
  # a pair drops out the instant a fourth becomes marginally closer, and its
  # constraint disappears in one tick. Solve time is 0.05 ms at n_c ~ 37, so
  # the cap was costing continuity to save headroom that was never scarce.
  self_collision_max_rows: 8

  # [s] anticipation: the engagement horizon is widened by lead_s * (closing
  # speed of the pair), so a fast approach gets its row EARLY — while h is
  # still large and the HOCBF row is still slack — and the constraint then
  # tightens continuously instead of stepping.
  #
  # THIS IS THE FIX for "the arm stops with joint_velocity_violation in poses
  # where it would self-collide". At the fixed 0.08 m horizon a pair closing
  # at 0.5 m/s got 160 ms of warning, and the row it produced demanded a large
  # deceleration in a single tick: a step in q̈_safe, a torque spike through
  # M·q̈, measured velocity overshooting, firmware reflex. At 0.35 s the same
  # approach engages at 0.26 m and is spread over ~350 ms.
  #
  # Costs nothing in a normal pose: the speed is clamped to the approaching
  # half, so a pair that is not closing keeps exactly the 0.08 m horizon.
  self_collision_row_lead_s: 0.35

  # [-] hysteresis. An engaged pair keeps its row until the gap opens past
  # release * horizon_eff. Without it a pair sitting on the boundary adds and
  # removes its row on alternate rebuilds — a discontinuity in the constraint
  # set every 20 ms, each one an OSQP setup() with the warm start discarded.
  self_collision_row_release: 1.6

  # [-] EMA on the per-pair closing speed (finite difference of the gap at the
  # 50 Hz rebuild). Same role as obstacle_velocity_alpha one family over: the
  # anticipation must not chatter on the differentiation noise.
  self_collision_gap_vel_alpha: 0.6

  # Pairs to drop, "bodyA-bodyB", order-insensitive, matched on the trailing
  # part of the link names. THIS IS NOT A GUESS: it is every pair marked
  # reason="Never" in Franka's own SRDF
  # (franka_description/robots/common/franka_arm.srdf.xacro and
  # end_effectors/franka_hand/franka_hand.srdf.xacro) — combinations the
  # manufacturer states cannot collide at any configuration. MoveIt uses the
  # same list. build_capsule_pairs() only drops CHAIN-ADJACENT bodies on its
  # own, which is far weaker: without this, 47 pairs are checked, 23 of them
  # impossible, and link1/link3 interpenetrates by 4.2 cm at the home pose
  # purely from the capsule inflation.
  self_collision_exclude_pairs:
    - "link0-link2"     # SRDF: Never
    - "link0-link3"     # SRDF: Never
    - "link0-link4"     # SRDF: Never
    - "link1-link3"     # SRDF: Never
    - "link1-link4"     # SRDF: Never
    - "link2-link4"     # SRDF: Never
    - "link2-link6"     # SRDF: Never
    - "link3-link5"     # SRDF: Never
    - "link3-link6"     # SRDF: Never
    - "link3-link7"     # SRDF: Never
    - "link4-link6"     # SRDF: Never
    - "link4-link7"     # SRDF: Never
    - "link5-link7"     # SRDF: Never
    - "hand-link3"      # SRDF: Never
    - "hand-link4"      # SRDF: Never
    - "hand-link6"      # SRDF: Never

  # ── State-limit box (cbf_safety_filter) ────────────────────────────────────
  # cbf_safety_filter reads its q / qdot / qddot limits from
  #   franka_description/robots/fr3/joint_limits.yaml
  # NOT from the joint_limits: block at the bottom of this file. That block is
  # still read by cbf_OSCBF_filter, cbf_velocity_filter, pentagon_qddot_commander
  # and rl_policy_commander, so it stays — but it is no longer this node's
  # source of truth, and the two can now drift without the filter caring.
  #
  # The box enforces, per joint, in one shot (utils.cbf_hard_limits.
  # position_velocity_accel_box -> hard_accel_box):
  #   qddot :  +-deceleration_limit                            (static)
  #   qdot  :  |qdot + qddot*dt| <= velocity_box_margin*qdot_max
  #   q     :  velocity toward a limit capped by the braking curve
  #            sqrt(2 * brake_eta * qddot_max * distance_to_limit)
  # with a feasibility guard collapsing the box onto lb (hardest legal braking)
  # if the demands conflict.

  velocity_box_margin: 0.9   # fraction of the official qdot_max actually allowed

  # [s] Approach horizon for the velocity and position caps in the box.
  #
  # The one-step form (relax = dt = 0.01) only engages in the last q̈_max·dt
  # before a cap — 0.17 rad/s on joint5. Measured: joint5 ramped from 39% to
  # 70% of its velocity limit with `vbite` empty on every single log line, and
  # the firmware aborted on joint_velocity_violation before the box ever bit.
  # A one-step guarantee is exact for an ideal discrete system and useless
  # against 1 kHz firmware checks plus IPC latency.
  #
  # 0.10 s makes the bound act ~10x earlier and proportionally. Braking past a
  # cap still uses the one-step dt, so authority away from a limit is untouched.
  # Lower it toward dt for a looser (later, harder) box.
  state_box_relax_s: 0.10

  # ── Anticipation-term filter (cbf_safety_filter) ───────────────────────────
  # EMA weight on the qdot used by the k1*(a^T qdot) term of h_qp, and by
  # NOTHING else. hdot is a derivative of a measured signal and k1 = 10.5
  # multiplies it straight into the constraint's right-hand side. Measured on
  # hardware: that single term accounted for 159% of h_qp's whole swing (hdot
  # ranged 0.035..0.323, so +-3.0 of h_qp against a total range of 1.9), the
  # commanded acceleration flipped sign 9 times in 28 intervals, and the arm
  # visibly oscillated on approach.
  #
  # The barrier value h and the direction a are NOT filtered, nor is the qdot
  # used by the acceleration box, the braking fallback or any diagnostic. This
  # smooths a noisy derivative estimate, not the safety state.
  #
  # Cost: the anticipation lags by about one time constant (~15 ms at 0.6,
  # 100 Hz) — roughly 1.5 cm of extra closure at 1 m/s, against d_safe = 0.20.
  # 0.0 restores the raw, unfiltered legacy behaviour.
  cbf_hdot_filter_alpha: 0.6

  # ── Barrier smoothing (obstacle rows only) ─────────────────────────────────
  # EMA weight on the obstacle barrier h, applied to its RECOVERY only. Closing
  # is ALWAYS instant, so the value the QP sees is never more optimistic than
  # the measurement.
  #
  # Why: obstacle h comes from the camera at ~30 Hz while the QP runs at 100 Hz,
  # so it sits frozen for a tick or two and then jumps. Measured on hardware,
  # d_min repeated its exact value on 7 of 26 consecutive diagnostic lines and
  # then moved 24 mm, which k0 = 25 turns into a 0.60 rad/s^2 step in the
  # constraint - 31% of h_qp's entire range in one tick.
  #
  # This smooths the moving-away half only. The approach half is REAL motion
  # (12 mm per 33 ms frame is 0.36 m/s of genuine closing) and reacting to it
  # immediately is the point of the filter - see k0_cbf for the lever on how
  # violently a perception step shakes the constraint.
  #
  # Self-collision and joint-limit rows are NOT smoothed: their h comes from
  # joint states, which arrive far faster than the QP and never staircase.
  #
  # 0.8 at the 50 Hz rebuild rate is a ~80 ms time constant: a 9 mm recovery
  # moves 1.8 mm on the first tick instead of all at once. 0.0 restores the raw
  # staircase. Watch `hhold=` in CBFDIAG for how much recovery is being held.
  cbf_h_recovery_alpha: 0.8

  # ── Obstacle velocity in hdot (cbf_safety_filter) ──────────────────────────
  # The gap closes at  ddot = n^T(p_robot_dot - p_obs_dot) = a^T qdot - v_obs.
  # Only the first half was modelled, so with the ROBOT STILL and a human
  # closing at 0.3 m/s the filter saw hdot = 0 and its k1 anticipation - half
  # the barrier's machinery - did nothing in exactly the case it exists for.
  # At d = 0.25 the demand went from -1.25 (constraint inactive) to +1.90
  # rad/s^2 once the term is included.
  #
  # v_obs is estimated as the RESIDUAL  a^T qdot - ddot_measured, not by
  # differentiating closest_point_human: that point is an argmin over depth
  # pixels and is memoryless (see distance_engine's own docstring), so it jumps
  # between surface patches and its derivative is mostly artefact. `d` is the
  # signal the engine already conditions with an asymmetric LPF and spike
  # rejection. Splitting it this way also keeps a^T qdot fresh at the QP rate
  # while filtering only the noisy 30 Hz half.
  #
  # ONLY THE APPROACHING HALF IS USED (v_obs is clamped at >= 0). A positive
  # v_obs makes hdot more negative, so the constraint demands more retreat: this
  # term can only ever TIGHTEN the QP, never loosen it. Trusting the receding
  # half would mean relaxing a safety barrier on a 30 Hz vision estimate.
  obstacle_velocity_enabled: true

  # EMA on the estimate. It is a derivative of a 30 Hz signal, and k1 = 10.5
  # multiplies it straight into the constraint - the same amplification that
  # made the arm oscillate before cbf_hdot_filter_alpha was added. 0.7 at the
  # 30 Hz update is a ~75 ms constant. 0.0 = raw.
  obstacle_velocity_alpha: 0.7

  # [m/s] Cap on the estimate, same scale as distance_engine's own
  # lpf_v_max_approach. One bad depth frame can otherwise fabricate metres per
  # second of apparent approach. Applies to BOTH sources below.
  obstacle_velocity_max: 2.0

  # ── Where v_obs comes from ────────────────────────────────────────────────
  # 'residual' | 'tracker'
  #
  # 'residual' (default) is the estimator described above: the scalar
  # a^T qdot - ddot, EMA'd and clamped. Every property it has follows from
  # having no object identity -- it is scalar (only the component along the
  # CURRENT n_hat is ever recovered, so it restarts from scratch every time
  # n_hat turns, which it does continuously as the arm moves), it is per
  # CONTROL POINT (11 control points looking at one person produce 11
  # independent estimates of that person's motion, pooling no evidence), and it
  # differences an argmin that hops between surface patches AND between objects
  # -- a hop from one object to another is a discontinuity, not a velocity, and
  # nothing in the residual can tell them apart. The 0.7 EMA exists precisely
  # because the raw signal cannot be trusted, and 75 ms of lag at 1 m/s is
  # 7.5 cm of barrier against a d_safe of 0.15.
  #
  # 'tracker' takes v_obs = n_hat^T v_track from LinkDistance.obstacle_velocity,
  # the 3D velocity of the CLUSTER this control point's nearest obstacle point
  # belongs to, estimated by a constant-acceleration Kalman filter
  # (utils/obstacle_tracker.py). In this mode the finite difference and the
  # alpha=0.7 EMA are skipped ENTIRELY: the filter already smooths and
  # differentiates in one step, and re-filtering a filtered signal pays the lag
  # twice for none of the benefit. obstacle_velocity_max still applies.
  #
  # Requires the tracking pipeline to be publishing (enable_obstacle_tracking in
  # fr3_complete.yaml). With it off the fields arrive as zeros, which is the
  # documented "no track" state: v_obs is then 0 and the barrier falls back to
  # a static-obstacle assumption. That is SAFE but not conservative in the way
  # 'residual' is -- do not run 'tracker' without the publisher.
  #
  # Measured offline (scripts/compare_vobs.py, rosbag/arm_complex with an
  # injected 0.15 m obstacle shuttling at 0.5 m/s, scored against truth):
  #   lag   residual -32 ms   tracker -8.6 ms   (3.7x less)
  #   bias  residual +0.068   tracker +0.025    (2.7x less)
  #   RMS   residual  0.181   tracker  0.226    (25% WORSE -- the fixture
  #         reverses instantaneously, i.e. infinite jerk, and a
  #         constant-acceleration filter overshoots a reversal while the
  #         residual simply lags through it. Lower track_q_jerk trades some of
  #         the lag win back if this shows up on hardware.)
  #   noise on a static scene   residual 0.013   tracker 0.000
  obstacle_velocity_source: residual

  # Perception frames a TRACK must have been UPDATED on before its velocity is
  # trusted in 'tracker' mode. Updates only -- a track coasting through an
  # occlusion does not accumulate evidence it does not have.
  #
  # 3 matches the tracker's own M-of-N birth rule, so a confirmed track is
  # trusted immediately and nothing is trusted before confirmation. Below the
  # gate v_obs is 0, i.e. the static-obstacle assumption, not a guess.
  obstacle_velocity_min_frames: 3

  # ── Residual floor under the tracked velocity ──────────────────────────────
  # In 'tracker' mode, ALSO run the residual estimator and hand the QP
  # max(n_hat^T v_track, v_residual). Meaningless in 'residual' mode.
  #
  # WHY (measured, Sep 2026 — the reactivity regression after the tracker
  # landed). Two things, both structural:
  #   1. A track is the velocity of a CLUSTER CENTROID and a person is one
  #      cluster. Replaying the two hand bags with the person tracked, a
  #      reaching hand read 0.22-0.27 m/s on the residual and 0.003 m/s on the
  #      projected track (93-100% of approaching samples under half the
  #      residual): the torso's centroid does not move when the hand does.
  #   2. Where there is NO usable track — the scene guard dropped the cluster
  #      (see cluster_max_radius_m in fr3_complete.yaml), the track is under
  #      obstacle_velocity_min_frames, the nearest point fell outside every
  #      cluster — the tracker's answer is exactly 0, the static-obstacle
  #      assumption. On today's live logs v_obs reached the QP on 22% of the
  #      approaching ticks in tracker mode against 72% in residual mode. With
  #      v_obs = 0 the retreat cap collapses to retreat_cap_base_speed and the
  #      arm creeps away from a person walking into it.
  # Both estimates are clamped to the approaching half, so the max can only
  # TIGHTEN, and a track that is right is never overruled downward. The
  # tracker keeps everything it is actually better at: the 3D direction for
  # lateral evasion, the covariance for the uncertainty margin, and the
  # lower-lag estimate on an isolated moving object.
  #
  # false restores the tracker-only behaviour bit for bit.
  obstacle_velocity_residual_floor: true

  # ── Conditioning of the TRACKED velocity before the QP sees it ─────────────
  # Measured by replaying the real cluster-centroid sequences of
  # rosbag/arm_complex and rosbag/handratacker_object -- scenes whose
  # obstacles do not move -- through the shipped Kalman filter: the tracked
  # speed has a median of 0.06 m/s, a p90 of 0.19-0.25 m/s and excursions past
  # 1.6 m/s. Through k1 = 10.5 that put a p99 step of 2.95 rad/s^2 into the
  # row's right-hand side EVERY TICK, which is the jitter the arm showed on a
  # static obstacle.
  #
  # It is not a tuning problem: q_jerk and sigma_meas were swept over three
  # decades each, sigma_v0 and the frame gate too, and an innovation-gated
  # robust update was tried; the numbers barely move, because the centroid of
  # a depth blob genuinely wanders as its visible surface changes and the
  # filter is differentiating it correctly. So it is conditioned here, at the
  # consumer, where what it costs can be measured against what it buys.
  #
  # [samples] median over the last N PERCEPTION frames, on the FINAL estimate
  # (whichever of the two produced it -- on hardware both are noisy and the QP
  # only ever sees the max).
  #
  # Chosen by measuring on the v_obs series of a hardware log with a STATIC
  # obstacle and the arm moving, against what each option costs on a real
  # approach:
  #     filter              step into h_qp (p95)   level p90   lag
  #     none                       2.26 rad/s^2      0.177     -
  #     median 3                   1.06              0.144     1 frame
  #     MEDIAN 5                   0.60              0.078     2 frames
  #     EMA 0.6                    0.71              0.121     4 frames
  #     rate limit 4 m/s^2         2.26              0.177     0-3 frames
  #
  # A rate limit on the estimate was implemented and REMOVED: the artefact
  # steps are only marginally faster than a limb could physically move, so a
  # physically honest bound never binds, and its lag is worst for the FASTEST
  # approaches, which is backwards. A median's lag is (N-1)/2 frames whatever
  # the speed, and it rejects the isolated excursions this noise is made of
  # rather than averaging them in. 5 frames at 30 Hz is a 165 ms window and
  # 66 ms of lag. 1 disables it.
  obstacle_velocity_median: 5

  # [rad] Reject a residual frame when n_hat rotated further than this since
  # the frame it is differenced against. 0.0 disables the guard.
  #
  # THE ARTEFACT. The residual differences a^T qdot against ddot and assumes
  # n_hat is the SAME direction in both frames. It is not: closest_point_human
  # is an argmin over depth pixels, so when it hops to a neighbouring surface
  # patch the normal rotates, the two halves stop referring to the same axis,
  # and their difference is the projection error of a rotation rather than an
  # obstacle velocity. That error is then clamped to the approaching half and
  # combined with max(), and symmetric noise clamped at zero and maximised has
  # a POSITIVE mean — so on a stationary obstacle the estimator manufactures
  # approach speed instead of averaging to nothing.
  #
  # Measured on hardware with a genuinely static obstacle, v_obs ran as a
  # square wave 0.000 -> 0.085 -> 0.000 -> 0.035 m/s, and through k1 = 10.5
  # each edge is a ~0.9 rad/s^2 step in a row that was binding on every tick.
  # The two largest single-tick jumps in that whole log are those two edges;
  # the distance closing accounted for less than a fifth of either.
  #
  # SIZING. With the arm at 0.12 m/s and a 0.2 m gap, honest tangential motion
  # turns n_hat by 4 mm / 200 mm = 0.02 rad per 33 ms frame; a hop to a patch
  # 5 cm away turns it by 0.25 rad. 0.15 sits an order of magnitude above the
  # first and well below the second, so it cannot fire on the arm's own motion.
  #
  # On rejection the PREVIOUS estimate is held, not decayed: the estimator has
  # learned nothing, and every quantity on this path is held to "may only
  # tighten, never loosen". The baseline is re-anchored so the next clean frame
  # differences against the new geometry.
  #
  # This is a HYPOTHESIS about where the fabricated velocity comes from, not a
  # measured fact — n_hat is in no existing log. OFF here so a flags-off build
  # is bit-identical; launch_defaults.yaml turns it on, and CBFDIAG's `nrot=`
  # counts the rejections so the next hardware run decides. A counter that
  # climbs while a static obstacle is in view is the guard working; one that
  # never moves falsifies the hypothesis and this parameter should go back to
  # 0.0 rather than be tuned.
  obstacle_velocity_normal_rot_max: 0.0

  # [m] MINIMUM jump in closest_point_human that means "this control point is
  # now looking at a DIFFERENT obstacle", which discards its closing-speed
  # state instead of differencing the distance across two bodies. The test
  # actually applied is
  #
  #     ||delta p_h||  >  max(this, obstacle_velocity_max * dt)
  #
  # i.e. this value is a FLOOR on a physical bound: the nearest obstacle point
  # cannot have travelled further than the fastest obstacle the filter admits
  # (2.0 m/s * 33 ms = 6.7 cm), so the floor is what binds at frame rate and
  # the bound relaxes honestly when a depth frame is dropped. A track_id that
  # changes from one nonzero value to another is treated as a change too, and
  # needs no threshold; the jump test is what covers the UNTRACKED case, which
  # is the one that appeared on hardware.
  #
  # 0.10 m sits above the argmin's own patch hopping (a hop to a neighbouring
  # surface patch moves the point ~5 cm — see the residual's rotation-guard
  # docstring) and below the separation of two distinct obstacles. Too small
  # and a static obstacle's own patch noise silences the residual floor; too
  # large and a second obstacle entering at 0.2 m is missed.
  #
  # 0.0 disables the WHOLE identity guard, both signals, and is bit-identical
  # to the pre-fix behaviour — which is why it is off here and turned on by
  # launch_defaults.yaml. Watch nid= in CBFDIAG: climbing while two obstacles
  # are in view is the guard working, pinned at 0 through a two-obstacle run
  # falsifies the threshold.
  obstacle_velocity_identity_jump: 0.0

  # [m/s] soft threshold on the tracked speed: |v| below it becomes exactly 0,
  # above it is reduced by it (subtracted, not gated -- a gate would step by
  # the deadband every time the estimate crossed it, which is the jitter this
  # exists to remove). At 0.15 the p90 of a STATIC scene is exactly zero, so a
  # static obstacle contributes nothing at all: no k1 term, no moving retreat
  # cap, no evasion trigger.
  #
  # It costs the deadband itself on a real approach (1.0 m/s reports 0.84),
  # and that is precisely why obstacle_velocity_residual_floor above is NOT
  # deadbanded: on the same static scenes the residual's p99 is 0.017-0.029
  # m/s -- it is quiet where this is loud -- and close in it sees the limb the
  # body's centroid cannot. max() of the two is quiet AND reactive.
  # Together with the median: 2.95 -> 1.41 rad/s^2 of step. 0 disables it.
  obstacle_velocity_track_deadband: 0.15



  # [m] apply the floor only while the barrier is below this. Far from the
  # obstacle the tracker's opinion is the only one that should reach the QP;
  # the floor exists for the close-in case where a limb's motion is invisible
  # to a body-centroid track. At 0.35 m a 0.3 m/s approach still gets ~1 s of
  # anticipation before d_safe. 0 applies the floor everywhere (the previous
  # behaviour).
  obstacle_velocity_residual_floor_gap: 0.35

  # ── Obstacle-velocity feedforward (cbf_safety_filter, Phase 1) ─────────────
  # A SECOND, separately tunable use of the v_obs estimate the k1 term already
  # consumes:
  #   (a) h_eff = h - min(v_app^2 / (2*obstacle_decel_assumed), brake_max)
  #       the barrier is measured not to where the obstacle IS but to where it
  #       could still be after decelerating. NOTE this is the OBSTACLE's
  #       stopping distance under an ASSUMED decel, not the robot's braking
  #       authority (that is the joint acceleration box).
  #   (b) h_qp += -velocity_feedforward_gain * v_app
  #       a direct feedforward on the row RHS, with its own gain so the
  #       "how hard do I react to a closing obstacle" lever is no longer welded
  #       to k1_cbf — which also sets the barrier damping and cannot be raised
  #       for reactivity without the row oscillating (measured at k1 = 10.5,
  #       that one term was 159% of h_qp's whole swing).
  # Sign note: this file's QP is assembled as G x <= h_qp, so a LARGER h_qp is a
  # LOOSER row; the feedforward is therefore negative. In the a^T qdd + s >= b
  # convention of the source implementation the same term reads b += k_ff*v_app.
  #
  # OFF by default. With the flag off no term is evaluated and the QP rows are
  # bit-identical to the pre-Phase-1 build (regression-tested).
  enable_velocity_feedforward: false

  # [m/s^2] deceleration ASSUMED for the obstacle. Lower = more conservative
  # (a slower assumed stop means a longer stopping distance means a tighter
  # barrier). 4.0 is roughly a human arm decelerating briskly.
  obstacle_decel_assumed: 4.0

  # [-] gain k_ff on the RHS feedforward.
  velocity_feedforward_gain: 1.0

  # [m] clamp on the braking-distance tightening. NOT optional hygiene: v_app is
  # capped at obstacle_velocity_max = 2.0 m/s upstream, so unclamped this term
  # reaches 2^2/(2*4) = 0.5 m, over three times d_safe. One depth artefact would
  # then drive the barrier deeply negative and the QP would answer with a
  # maximal retreat -- the exact failure mode this filter has already hit twice.
  velocity_braking_margin_max: 0.25

  # Perception frames a track must be seen for before its v_app is trusted by
  # these two terms. The existing v_obs path already returns 0 until the 2nd
  # frame; this is a stricter, independent gate that applies ONLY here, so a
  # newly appeared obstacle cannot have its first noisy estimate SQUARED into
  # the barrier.
  velocity_feedforward_min_frames: 3

  # ── Tracked obstacle velocity inside hdot (cbf_safety_filter) ─────────────
  # With this on, every obstacle row whose track is confirmed (frames_seen >=
  # obstacle_velocity_min_frames) uses
  #     hdot = a^T qdot - n_hat^T v_track
  #     b    = -k1*(a^T qdot - n_hat^T v_track) - k0*h_bar - c
  # with the track's 3D velocity projected on THAT row's normal, SIGNED: a
  # receding obstacle relaxes k1*hdot, which is right because it is a term on
  # hdot, not on h. It REPLACES the scalar v_obs (residual/tracker, clamped to
  # the approaching half, median, deadband) in hdot for that row, and zeroes
  # that row's velocity_feedforward RHS term (same speed, counted twice
  # otherwise). The braking, uncertainty and latency tightenings of h, the
  # retreat cap and the evasion are unchanged. Rows without a confirmed track
  # behave exactly as today. `a` is unchanged.
  #
  # NOTE: the raw track velocity is noisier than the conditioned v_obs (see
  # obstacle_velocity_median / _track_deadband: p90 0.19-0.25 m/s on static
  # scenes), and through k1 that noise now reaches the row in both signs.
  #
  # OFF by default: flags-off rows are bit-identical (regression-tested).
  enable_vobs_in_hdot: false

  # [m/s] clamp on |n_hat^T v_track| inside hdot, so a dirty track cannot blow
  # up the RHS (k1 * 2.0 = 21 at k1 = 10.5).
  vobs_hdot_max: 2.0

  # ── Speed-proportional standoff (cbf_safety_filter) ────────────────────────
  #   d_safe_eff = d_safe + min(velocity_standoff_time_s * v_app, _max)
  #
  # Avoidance PROPORTIONAL to the estimated approach speed. Without it the
  # barrier sits at d_safe whatever the obstacle is doing: a hand closing at
  # 1 m/s and one resting in place are held at the same distance, and speed
  # only enters through k1*hdot (which acts late, at the barrier) and the
  # QUADRATIC braking term above (1 cm at 0.3 m/s, OFF in launch_defaults).
  # This moves the barrier out LINEARLY: the separation-distance term of
  # speed-and-separation monitoring (ISO/TS 15066, v_h * T). The row's -k0*h,
  # the retreat cap's relief ramp and the evasion urgency all read h, so all
  # of them engage earlier for a fast obstacle and later for a slow one.
  #
  # v_app is the conditioned approaching half (median, deadband, residual
  # floor): a static or receding obstacle adds nothing. Gated on
  # obstacle_velocity_min_frames like the other track-derived terms. The zone
  # ladder stays on the MEASURED gap, unchanged. Adds to the braking term if
  # both are on. Watch hstd= in CBFDIAG.
  #
  # OFF here so a flags-off build is bit-identical; launch_defaults.yaml turns
  # it on (velocity_standoff).
  enable_velocity_standoff: false

  # [s] metres of extra standoff per m/s of closing speed. 0.20 s ~ the p95
  # blind time (0.085 s, Phase 0) plus the ~0.1 s the arm needs to build a
  # retreat speed: +6 cm for a hand at 0.3 m/s, +20 cm at 1 m/s. INITIAL
  # estimate, not tuned on hardware.
  velocity_standoff_time_s: 0.20

  # [m] clamp. Reached at 1.0 m/s with the time above, so the term is linear
  # over the 0-1 m/s a person moves at and flat beyond.
  velocity_standoff_max: 0.20

  # [-] EMA on the standoff's DECAY only (rise is instant), per control point,
  # at the 50 Hz rebuild: 0.8 is a ~100 ms constant. Keeps a slowing or
  # receding obstacle from releasing the barrier as a k0*h_std step. 0 = raw.
  velocity_standoff_alpha: 0.8

  # ── Uncertainty-derived tightening (cbf_safety_filter, Phase 3) ────────────
  #   h_eff = h - k_sigma * sqrt(n_hat^T P_vv n_hat) * t_latency
  #
  # Every other conservative term in this file is a constant guessed offline --
  # d_safe, obstacle_decel_assumed, velocity_braking_margin_max. Being constant,
  # each is wrong in both directions at once: too tight when the estimate
  # happens to be good, too loose when it happens to be bad, and nothing in the
  # filter can tell which situation it is in.
  #
  # The Kalman tracker can. n_hat^T P_vv n_hat is the VARIANCE of the exact
  # scalar the barrier consumes, reported by the estimator itself, and it MOVES:
  # it collapses as a track accumulates measurements and inflates while a track
  # coasts through an occlusion or is fed a wandering centroid. Its square root
  # times a latency is a DISTANCE -- how far the obstacle could be from where
  # the filter thinks it is by the time the filter could react -- which is
  # directly comparable with the barrier it is subtracted from.
  #
  # The EMA'd scalar of 'residual' mode cannot support this term at all: it has
  # no covariance and there is nothing to derive one from. This is the
  # structural argument for the tracker reduced to one line, and the reason the
  # flag is meaningless with obstacle_velocity_source: residual (P_vv arrives as
  # zeros, the term is exactly 0.0).
  #
  # OFF by default. With the flag off the term is not evaluated and the QP rows
  # are bit-identical to the pre-Phase-3 build (regression-tested).
  enable_uncertainty_margin: false

  # [-] standard deviations of velocity error to reserve. 2.0 covers ~95% of a
  # Gaussian's one-sided mass. Raising it buys confidence linearly in metres, so
  # it is bounded by velocity_braking_margin_max below rather than by taste.
  uncertainty_k_sigma: 2.0

  # [-] EMA on the margin across rebuilds (50 Hz), per control point. This is
  # a standoff against what the ESTIMATOR admits it does not know, not a
  # measurement of the world, and nothing about it is urgent to a single tick.
  # Unsmoothed it was the second largest source of jitter on hardware: it sat
  # at its floor of 0.032 m and jumped to 0.106 whenever a control point
  # matched a different track, which through k0 = 25 is a 1.85 rad/s^2 step in
  # the row's right-hand side. 0.8 at 50 Hz is a 100 ms constant, so the
  # steady part of the margin is kept in full and only the jumps are spread.
  # 0 restores the raw per-tick value.
  uncertainty_margin_alpha: 0.8
  #
  # t_latency is NOT a parameter of its own: the term reuses
  # link_speed_reaction_s (0.20 s). Both answer the same physical question --
  # "how long can the world move without the filter noticing" (perception period
  # + QP period + actuation lag) -- and two independently-tuned constants for
  # one quantity is how they drift apart. The clamp is shared with the braking
  # term (velocity_braking_margin_max) for the same reason it exists there: an
  # unbounded tightening driven by a perception artefact drives the barrier
  # deeply negative and the QP answers with a maximal retreat.

  # ── Lateral evasion (cbf_safety_filter) ────────────────────────────────────
  # WHAT IT IS FOR. Every obstacle row demands the same thing: accelerate the
  # control point ALONG n_hat, away from the obstacle. That is the right answer
  # while it is achievable, and it is the only answer this filter knows.
  #
  # It stops being achievable, and the failure is arithmetic, not tuning. The
  # barrier closes at hdot = a^T qdot - v_obs, and the acceleration box bounds
  # how hard the robot can push back along n_hat:
  #     a_max = sum_j max(a_j*lb_j, a_j*ub_j)      [m/s^2]
  # so the shortest distance in which it can null a closing rate is
  # hdot^2/(2*a_max). When that exceeds the remaining gap, NO admissible
  # acceleration keeps the barrier positive. The QP does not fail loudly there
  # -- it pays slack and the arm backs off as hard as it can into a collision it
  # was never able to prevent. A hand at 1.5 m/s covers 5 cm between depth
  # frames; no k0/k1 retunes the robot's inertia.
  #
  # "Cannot stop the gap closing" is not "cannot avoid the obstacle". A person
  # about to be hit does not push back along the line of approach, they move
  # SIDEWAYS out of the swept volume -- which is usually far cheaper in
  # acceleration. Doing that requires knowing WHICH WAY the obstacle is going,
  # and the scalar residual contains no direction at all. This is what the
  # tracked 3D velocity buys beyond a better-conditioned v_obs.
  #
  # The escape direction is derived, not guessed: with d = p_robot - p_obs and
  # the obstacle travelling along v_hat, the perpendicular offset
  # d_perp = d - (d.v_hat)v_hat IS the miss distance, so d_perp normalised is
  # the direction that grows it fastest. Note it is NOT n_hat -- for a glancing
  # approach the two are nearly orthogonal and moving along n_hat barely changes
  # the miss distance. Head-on (d_perp ~ 0) every perpendicular is
  # geometrically equal, and the tie is broken on the robot's side: the
  # perpendicular direction the arm can accelerate along hardest.
  #
  # It enters as a BIAS on the QP's target, never as a row. A row would be a
  # hard demand added to a QP that is already paying slack, and the two would be
  # relaxed by the same shared slack with no way to say which mattered. A bias
  # moves the objective: every barrier stays exactly as binding, the robot's
  # limits are untouched, and the free part of qddot -- which today sits at zero
  # -- is spent getting out of the way. Worst case for a wrong escape direction
  # is a slightly worse tracking error, never a violated barrier.
  #
  # OFF by default, and inert without obstacle_velocity_source: tracker (with no
  # track there is no velocity, hence no direction, hence no bias).
  enable_lateral_evasion: false

  # [rad/s^2] bias magnitude at FULL urgency for a single control point. An
  # acceleration, not a dimensionless factor, so it reads directly against the
  # joint acceleration box (joint2's is 2.585 rad/s^2). 1.5 is a firm but
  # sub-saturating sideways push.
  lateral_evasion_gain: 1.5

  # [rad/s^2] norm cap on the TOTAL bias. Several control points on one link
  # facing one obstacle all contribute, so without a cap the swerve would scale
  # with how finely the arm happens to be discretised into control points -- a
  # modelling detail that must not change how hard the robot moves.
  lateral_evasion_max_bias: 3.0

  # [-] fraction of the acceleration box credited to braking along n_hat when
  # deciding whether braking can still succeed. < 1 for two reasons: the same
  # budget must also serve every other row and the tracking objective, and the
  # STATIC box is used here (the velocity-tightened one is rebuilt per 100 Hz
  # tick while this runs at 50 Hz), which overstates what is available. Lower =
  # evasion engages earlier.
  lateral_evasion_authority: 0.5

  # [-] where the urgency ramp starts, as a fraction of the braking distance
  # that would make the situation hopeless. 0.7 engages while there is still
  # room to work: an evasion started at 1.0 starts at the moment it stops
  # mattering. The ramp to 1.0 is a smoothstep, not a switch -- a hard threshold
  # on a 30 Hz vision quantity chatters, and what is being switched is a bias on
  # qddot_nom, so the arm would jerk sideways and back at the noise rate. That
  # is the exact failure the tangential bias was rewritten for.
  lateral_evasion_engage_ratio: 0.7

  # [m/s] below this the obstacle is not meaningfully moving and "perpendicular
  # to its velocity" is a direction fitted to noise -- no bias is produced and
  # the normal retreat the barrier already demands is the whole response.
  lateral_evasion_v_min: 0.15

  # ── Outrun test + lateral escape (cbf_safety_filter, Phase 2) ──────────────
  # The lateral evasion above asks "can this point still BRAKE out of this",
  # from the acceleration box. This asks the prior question, from the joint
  # VELOCITY box, in closed form (utils/cbf_state_rows.retreat_speed_available):
  #
  #     v_avail  = sum_i |(n_hat^T Jp)_i| * velocity_box_margin*qdot_max_i
  #     r        = (n_hat^T v_obs) / (outrun_evasion_margin * v_avail)
  #     outrunnable  <=>  r <= 1
  #
  # Measured on this arm (Phase 0): v_avail is 2-3 m/s at the flange and
  # 0.10-0.20 m/s on the link4 control points along their weak normal. An
  # obstacle closing faster than v_avail is NOT outrun by any gain; the row pays
  # slack and the arm backs into a contact it cannot prevent. So above the
  # ramp the escape direction rotates from +n_hat (the normal retreat, today's
  # behaviour) toward the unit direction PERPENDICULAR to v_obs along which
  # the arm can move fastest — the same separable maximum, taken over the
  # plane orthogonal to the obstacle's velocity — and the QP target is biased
  # that way:
  #     qddot_nom += gain * pinv(Jp) * (accel * m * w * e_escape)
  # with w the smoothstep on r over [ramp_start, 1] and m = clip(v_close/v_ref).
  # While the obstacle IS outrunnable w = 0 and NOTHING is added: the barrier's
  # own retreat is the whole response, and there is no fight with the retreat
  # cap. A BIAS on the objective, never a row: the safety rows are untouched,
  # so this cannot loosen a barrier or make the QP infeasible.
  #
  # OFF by default here; launch_defaults.yaml turns it on with the rest of the
  # prediction stack. With the flag off, or with a static / receding obstacle,
  # every QP matrix is bit-identical (regression-tested).
  enable_outrun_evasion: false

  # [-] fraction of v_avail the point is credited with. < 1 because the same
  # velocity budget also serves the task, and because v_avail is the box's
  # vertex — reaching it means every joint at its limit in the right sign.
  outrun_evasion_margin: 0.8

  # [-] where the blend starts, as a fraction of the outrun ratio. 0.6 begins
  # rotating the escape while the obstacle is still nominally outrunnable, so
  # the swerve has room to work; the ramp to 1.0 is a smoothstep, never a step
  # (a hard threshold on a 30 Hz vision quantity chatters the bias).
  outrun_evasion_ramp_start: 0.6

  # [m/s^2] Cartesian escape acceleration at full urgency and full closing
  # speed. Read against the retreat authority (typical a_avail 3.9 m/s^2,
  # Phase 0). Went 1.0 -> 3.0 after the Phase-5 scenarios, where a 3 m/s pass
  # at the flange got a correctly orthogonal push that moved it a centimetre
  # before contact -- and 3.0 -> 1.5 after that turned out to be a hardware
  # smoothness problem: at 3.0, with the ungated trigger below, a noise spike
  # bought a 6 rad/s^2 sideways kick. The gates are the real fix; this is the
  # margin on top of them. The scenario it was raised for is one 0c says is
  # unreachable from the 0.7 m publish gate anyway.
  outrun_evasion_accel: 1.5
  outrun_evasion_gain: 1.0

  # [m/s] closing speed at which the magnitude ramp m saturates. Below it the
  # bias grows linearly with v_close, and it is EXACTLY zero at v_close = 0.
  outrun_evasion_v_ref: 0.5

  # [m/s] below this |v_obs| the obstacle is not meaningfully moving and
  # "perpendicular to its velocity" would be fitted to noise — no lateral
  # direction, the normal retreat stays the whole response.
  outrun_evasion_v_min: 0.15

  # [rad/s^2] norm cap on the TOTAL bias over all control points, so the swerve
  # does not scale with how many points face the same obstacle. Tracks the
  # accel above (was 6.0 while that was 3.0); joint 2's own limit is 2.585 and
  # the box clips per joint regardless.
  outrun_evasion_max_bias: 3.0

  # [-] EMA on the bias across QP ticks. Deliberately FASTER than
  # cbf_tangential_filter_alpha (0.9 = 100 ms): the situation this answers is
  # over in a few hundred ms, and Phase 0 measured the whole blind time at
  # 48-85 ms - a 100 ms filter would spend most of the window ramping up.
  # 0.8 at 100 Hz is a 50 ms constant: still well inside the event, but no
  # longer able to put a full-amplitude step into qddot_nom in three ticks.
  outrun_evasion_filter_alpha: 0.8

  # [m] barrier value below which the outrun test may produce a bias at all.
  # THE fix for the roughness this feature caused on hardware: the test
  # compares a speed against a speed and never looked at the gap, so it fired
  # anywhere inside cbf_obstacle_horizon (1.2 m). Stepping aside from
  # something a metre away is not evasion, it is noise with a direction.
  # 0.30 m is twice d_safe, the same engage margin the tangential bias uses.
  # 0 restores the ungated behaviour.
  outrun_evasion_engage_gap: 0.30

  # [m/s] floor under v_avail in the outrun ratio. v_avail collapses with the
  # leverage of the row: measured on this arm, the link4 control points have
  # 0.10-0.20 m/s along their weak normal, so an unfloored ratio reads
  # 0.15 m/s of estimation noise as "cannot be outrun" on 2-4% of directions
  # there and 0.30 m/s on a third of them. A point that cannot retreat at
  # 0.3 m/s cannot escape sideways at 0.3 m/s either -- its problem is
  # leverage, not direction. 0 restores the unfloored ratio.
  outrun_evasion_v_avail_floor: 0.30

  # ── Livelock escape (cbf_safety_filter, Phase 3c) ──────────────────────────
  # A filter can be stuck with nothing wrong: the commander asks for a motion
  # straight into a barrier, the QP removes the normal component, and if that
  # was the whole command nothing is left — qddot_safe ~ 0, qdot ~ 0, the
  # reference parked, the barrier satisfied, slack zero, solve converged. It is
  # the local minimum of the (nominal, barrier) pair, and it is also one half
  # of the "arm stops" deadlock with the commander's phase governor.
  #
  # Detector (utils/livelock.py), two booleans per tick:
  #     blocked = ||qddot_safe - qddot_nom|| > livelock_dnorm_thr
  #     moving  = ||q(t) - q(t - livelock_progress_window_s)|| > livelock_progress_thr
  # blocked and not moving for livelock_stall_s -> escape: a bias of
  # livelock_gain * m(t) along the snapshot's livelock_dir, m ramping 0 -> 1
  # over livelock_ramp_s, held at most livelock_max_s, ended the moment the
  # task is no longer blocked (NOT on displacement: the nudge's own motion
  # would end it before it had carried the arm anywhere — measured), followed
  # by livelock_cooldown_s of rest. Every bound is explicit and every
  # start/end is logged.
  #
  # The direction is "sideways here": Phase 2's most achievable direction
  # orthogonal to v_obs (or to n_hat for a static obstacle), projected onto
  # the NULLSPACE of the closest obstacle row, so it has exactly zero first-
  # order effect on the barrier — it can neither help nor hurt the retreat,
  # only carry the arm around. A bias on the objective, never a row.
  #
  # OFF here; launch_defaults.yaml turns it on. With the flag off the snapshot
  # carries no direction and the node adds nothing (bit-identical).
  enable_livelock_escape: false

  # [s] "blocked and not moving" must persist this long. 1.0 s is well above
  # any transient the slew box and the barrier's own dynamics produce, and
  # short enough that a person does not read it as the robot giving up.
  livelock_stall_s: 1.0

  # [s] ramp of the nudge from 0 to full, so it is not a step in qddot_nom.
  livelock_ramp_s: 0.3

  # [s] longest continuous nudge. If sideways did not free the arm in 2 s the
  # geometry is not a local minimum this can fix; stop and rest.
  livelock_max_s: 2.0

  # [s] rest after an escape ends, however it ended.
  livelock_cooldown_s: 2.0

  # "Standing still" is a DISPLACEMENT over a window, not a speed. Measured in
  # the wedge scenario (scripts/cbf_scenarios.py): an arm pinned between two
  # obstacles jiggles at 0.1-0.6 rad/s while going nowhere, as the barrier,
  # the cap and the nominal trade blows tick to tick — a speed threshold never
  # sees it as stuck. Half a second of joint displacement does.
  livelock_progress_window_s: 0.5
  # [rad] joint displacement over that window below which the arm counts as
  # not progressing. 0.05 rad is ~1.5 cm at the flange.
  livelock_progress_thr: 0.05

  # [rad/s^2] above this ||qddot_safe - qddot_nom|| the QP counts as bending
  # the nominal, i.e. the task is pushing into a barrier. A genuinely stuck
  # task bends by 5-10 rad/s^2 (scripts/cbf_scenarios.py, wedge); an arm
  # SETTLED at its goal beside a barrier still bends by 0.5-0.9 from the
  # residual pull, and at 0.5 the detector kept arming on that. 1.5 keeps
  # the two apart.
  livelock_dnorm_thr: 1.5

  # [rad/s^2] magnitude of the nudge at full ramp. It has to beat the task's
  # own pull toward the blocked goal or the arm only leans sideways: with 1.5
  # against a joint PD pulling at ~5 rad/s^2 the escape moved the flange a
  # centimetre and the PD dragged it back (scripts/cbf_scenarios.py, around).
  # 3.0 is still under every joint's static authority except joint 2's, and
  # the QP box clips per joint. Bounded, ramped, timed, logged. Lowered to 2.0
  # for hardware: with the engage gap below the escape now only fires with
  # something genuinely close, so it does not need to overpower the task by as
  # much, and a smaller nudge is a smaller surprise next to a person.
  livelock_gain: 2.0

  # [m] the escape is only OFFERED while an obstacle row is closer than this.
  # A stopped arm with the nearest obstacle 0.5 m away is a finished
  # trajectory, not a livelock, and nudging it sideways is exactly the
  # unexplained motion this rework is meant to remove. 0 offers it whenever
  # any obstacle row exists.
  livelock_engage_gap: 0.25

  # [rad/s^2] the TASK's own command must be at least this large for the arm
  # to count as blocked. An arm parked on its goal next to a violated barrier
  # also shows a large ||qddot_safe - qddot_nom|| -- the barrier is pushing it
  # off the goal -- and nudging that sideways is unexplained motion, not an
  # escape. Measured: it fired in the noisy-static scenario with the arm
  # holding still on target. 0 disables this half of the test.
  livelock_nominal_min: 1.0

  # ── QP fallback ladder (cbf_safety_filter, Phase 3a) ───────────────────────
  # Every CBF row carries a slack, so only the hard box can make the problem
  # infeasible and the box is built non-empty; what remains is OSQP not
  # FINDING the solution in its budget. That is walked down a ladder instead
  # of being reported as "no solution": level 0 full problem (a SOLVED_INACCURATE
  # iterate accepted after clipping into the box when this flag is on),
  # level 1 the same objective over the box alone (rows dropped for this tick),
  # level 2 clip(-k_brake*qdot, lb, ub). Levels 1-2 still raise fault_braking
  # on cbf_status and log which rung fired. See cbf_qp_assembly.
  accept_inaccurate_qp: true

  # ── The acceleration box never exceeds the joint's authority (Phase 3b) ────
  # The box's feasibility guard collapses onto lb when velocity/position
  # demands conflict. On the closing-on-a-position-limit side lb is
  # (v_curve - qdot)/dt, and when the joint is already past its braking curve
  # that is far above the acceleration limit: the regression test measured
  # [189, 189] rad/s^2 on joint 7 against a 17 rad/s^2 limit. The QP obeys the
  # box, the controller cannot deliver it, the firmware reflexes on the torque.
  # With this on, the box is clipped into [-decel, +decel] AFTER the guard, so
  # the demand is "everything the joint has" and never more. false reproduces
  # the previous arithmetic bit for bit.
  accel_box_clip_to_limits: true

  # ── Latency compensation (cbf_safety_filter, Phase 4) ──────────────────────
  # The barrier is built from where the obstacle WAS at depth capture and
  # acted on t_blind later. Phase 0 measured that chain hop by hop
  # (scripts/latency_budget.py): 48 ms median / 85 ms p95 at 30 fps, 118 / 168
  # at 15 fps, sampling wait included. At 1 m/s that is 5-9 cm the row does
  # not know about; the k1 term reacts to the closing RATE but the barrier
  # VALUE lags. With this on, per obstacle row:
  #     h -= max(n_hat^T (v t + 0.5 a t^2), 0)              (prediction, closing
  #                                                          half only)
  #     h -= min(k_sigma sqrt(n^T P_pp(t) n), margin_max)   (propagated position
  #                                                          uncertainty)
  #     P_pp(t) = P_pp + t (P_pv + P_pv^T) + t^2 P_vv
  # both from the track's Kalman state as carried on LinkDistance
  # (obstacle_acceleration, position_covariance, position_velocity_covariance
  # were added to the message for this). Tighten only: a receding obstacle is
  # never predicted AWAY, and the two terms together are clamped at
  # latency_margin_max. Gated on obstacle_velocity_min_frames like the other
  # track-derived terms.
  #
  # OFF by default, as specified. With the flag off no term is evaluated and
  # the rows are bit-identical (regression-tested).
  enable_latency_compensation: false

  # [s] the blind time to predict over. The measured p95 at 30 fps; use 0.168
  # if the camera is left at the driver's 15 fps default. Zero disables the
  # prediction but keeps the (then P_pp-only) uncertainty term.
  latency_t_blind: 0.085

  # [-] standard deviations of propagated position error to reserve.
  latency_k_sigma: 2.0

  # [m] clamp on prediction + uncertainty together. A brand-new track's
  # covariance and a spurious acceleration would otherwise drive the barrier
  # deeply negative — the failure this filter has been bitten by before.
  latency_margin_max: 0.25

  # ── Risk-weighted slack (cbf_safety_filter, Phase 2) ───────────────────────
  # One slack per FAMILY is shared by every row in it, so when rows conflict the
  # QP buys the same relief for all of them: a row 3 cm from contact and a row
  # 40 cm away are relaxed by exactly the same amount. Weighting the slack
  # COLUMN makes the relief inversely proportional to criticality:
  #
  #   a_i^T qdd + s_g / w_i  >=  b_i          (instead of  ... + s_g >= b_i)
  #
  # so a critical row gets little relief per unit of paid slack and a distant
  # one gets a lot, and the QP's cheapest escape from a conflict is to bend the
  # distant row and hold the near one. The slack stays SHARED: this is weighted
  # sharing, not independent per-row slack (which would need one variable per
  # row, i.e. a decision vector that resizes with n_c).
  #
  # Implementation is exactly G[i, NV+g] = -1/w_i instead of -1.0. NX, P,
  # N_SLACK, build_osqp_A and setup() are untouched.
  #
  # Weight (see utils/cbf_state_rows.risk_slack_weight):
  #   sigma(h) = 1 / (1 + exp( alpha*(2h/rho - 1) ))
  #   w(h)     = 1 + (slack_weight_max - 1) * sigma(h)
  # This is the logistic Flacco, Kroger, De Luca & Khatib use for the
  # repulsive-vector magnitude in the depth-space collision-avoidance work
  # (ICRA 2012; JIRS 2015), V(d) = V_max / (1 + exp(alpha*(2d/rho - 1))),
  # reused here as a criticality score rather than a repulsion magnitude. It is
  # borrowed for its shape: continuous, so the active set does not chatter as a
  # control point drifts across a threshold, and bounded at both ends, so no
  # single measurement can drive the weight to 0 or infinity.
  #
  # NORMALISATION: the column is written -slack_weight_max/w_i, NOT -1/w_i.
  # The -1/w_i form tightens critical rows but inflates the shared slack -- and
  # its 0.5*rho*s^2 cost -- by up to w_max^2, so the obstacle family starts
  # out-pricing the tracking objective (measured on a 4-row replay with the
  # accel box saturated: s_obs 3.0 -> 15.0 for the same conflict). With
  # -w_max/w_i the ratio between rows is identical, the MOST critical row keeps
  # exactly today's column of -1.0, and the shared slack keeps today's
  # magnitude -- so rho_slack does not need retuning. The distant rows are what
  # move, yielding up to w_max times further. That is the mechanism, not a side
  # effect: relaxation is what a distant row is for.
  #
  # OBSTACLE ROWS ONLY. Joint-limit rows are radians, the singularity row is
  # m/rad, rate-cap rows carry a sentinel h; a rho in metres is meaningless for
  # them. Same units argument that produced the per-family slack split.
  #
  # OFF by default; with the flag off the slack column keeps its literal -1.0
  # and G is bit-identical.
  enable_weighted_slack: false

  # Weight at h <= 0 (fully violated). 1.0 disables the weighting even with the
  # flag on. Higher = the QP protects near rows harder, at the cost of pushing
  # more of the relaxation onto the distant ones.
  slack_weight_max: 5.0

  # [m] distance of influence: the sigmoid knee sits at h = rho/2, w ~ 1 beyond
  # rho. 0.30 puts the knee at 15 cm of surface gap, i.e. right where d_safe is.
  slack_weight_rho: 0.30

  # [rad] distance of influence for the JOINT-LIMIT family. Its own parameter
  # because that barrier is in RADIANS -- reusing the metres one would be
  # exactly the units confusion the per-family slack split exists to prevent.
  # 0.40 rad puts the knee at 0.20 rad from the (margin-shrunk) limit, which is
  # inside the distance at which the braking curve starts biting at typical
  # speeds, so a joint being clipped by the box is already weighted as critical.
  # 0 leaves the joint-limit rows unweighted (obstacle-only, as in Phase 2).
  slack_weight_rho_qlim: 0.40

  # Sigmoid shape. Larger = sharper transition around the knee. Very large
  # values approach a step and reintroduce the active-set chatter the sigmoid
  # exists to avoid.
  slack_weight_alpha: 6.0

  # ── Capture-stamp plausibility window (cbf_safety_filter) ──────────────────
  # _obstacle_speed differentiates d against MultiLinkDistance.header.stamp (the
  # depth frame's CAPTURE time) instead of the receipt time it used before:
  # receipt time carries transport and executor-scheduling jitter, and dividing
  # dd by a jittered dt put that jitter straight into v_obs -- which now drives
  # the k1 term, the retreat cap, and a Phase-1 term that SQUARES it.
  # These two bound what is accepted as a capture stamp; outside the window the
  # node falls back to receipt time (i.e. exactly the previous behaviour) and
  # warns. Staleness checks are UNCHANGED and still use receipt time.
  distance_capture_age_max: 1.0    # [s] max sensing age accepted
  distance_capture_skew_tol: 0.05  # [s] tolerance for a stamp slightly ahead

  # [rad] keep the position barrier this far inside the mechanical stop, so the
  # braking curve reaches zero velocity BEFORE the hard limit rather than at it.
  position_margin_rad: 0.05

  # Fraction of the decel authority the braking curve is allowed to assume.
  # < 1 on purpose: riding the curve at eta=1 would demand exactly qddot_max and
  # leave the QP no room for the obstacle rows, so any CBF push would need slack.
  # 0.6 keeps 40% of the authority free. Raise it to approach limits faster,
  # lower it if the box and the obstacle rows fight near a joint limit.
  position_brake_eta: 0.6

  # ── OSQP solver limits (cbf_safety_filter) ─────────────────────────────────
  # OSQP's own default max_iter (4000) can be hit on ill-scaled instances; at
  # this problem size 20k iterations still complete in < 1.5 ms.
  osqp_max_iter: 20000

  # [rows] quantisation of the QP's row count. OSQP's sparsity pattern depends
  # on n_c, so every change forces a fresh osqp.OSQP() + factorization — and
  # n_c changes almost every rebuild as control points and rows engage
  # (22 -> 29 -> 30 -> 34 -> 36 -> 37 across a few hundred ms of one hardware
  # log). Rounding up to a block of 16 makes all of 33..48 one pattern: one
  # setup(), update() thereafter, warm start preserved, and no per-tick
  # allocate-and-factorize spike to starve the executor's IO thread (which is
  # how "joint state stale -> braking" appeared right before a reflex). The
  # padding rows are inert; see cbf_qp_assembly.pad_rows_to_block. 1 disables
  # the quantisation and restores the exact previous behaviour.
  qp_row_block: 16

  # ── cbf_status contract (/NS_1/cbf_status, Float64MultiArray) ─────────────
  # data[0] n_active_constraints — HOCBF rows present in the QP this tick, i.e.
  #         every control point inside cbf_obstacle_horizon. Most are
  #         non-binding; this is NOT a count of triggered CPs.
  # data[1] slack — QP slack s. One slack is shared by ALL rows, so a single
  #         deeply-violated CP relaxes every other row by the same amount.
  #         Worth watching now that ~11 rows are active instead of ~5.
  # data[2] fault_braking — safety-chain fault (distance stale, or QP failure)
  #         forced braking with no geometric rows. Distinct from data[0]==0.
  # data[3] n_active_cps — rows whose barrier is actually VIOLATED (h < 0, i.e.
  #         the CP is inside d_safe). This is the honest "how many control
  #         points triggered". > 1 is expected on an angled approach and is the
  #         signal that multi-CP activation is working.
  # Consumers (frame_grabber, rl_policy_commander) index positionally behind a
  # len() guard, so appending further elements stays backward compatible.

  # ── Diagnostics (cbf_safety_filter) — logging only, never read by the QP ───
  diag_period_s: 0.05          # [s] min interval between CBFDIAG lines
  # Diagnostic ONLY: disable the garbage collector, to test whether _qp_tick
  # gaps coincide with GC pauses. Memory can grow unbounded — never leave on.
  diag_disable_gc: false

  diag_qddot_alpha: 0.7        # EMA on the realized-qddot estimate [0=raw, 1=frozen]
  tick_gap_warn_factor: 3.0    # warn when a QP tick gap exceeds N x the nominal period
  diag_vel_ratio_thr: 0.85     # emit VELHI when worst |qdot|/qdot_max exceeds this (>1 disables)

  # ── Path geometry (pentagon_qddot_commander) ───────────────────────────────
  # Moved out of torque_control_stack.launch.py: launch files carry wiring, not
  # tunables. The node reads these as its declare_parameter defaults.
  path_center_xyz: [0.4, 0.0, 0.45]  # [m] circle/lissajous centre, plane_frame
  path_type: circle                  # circle | lissajous | pentagon
  path_radius: 0.25                  # [m] circle radius in the selected plane

  # DEPRECATED/UNUSED: not read by any code. DistanceEngine reads its EMA weight
  # from `lpf_alpha` in fr3_complete.yaml (the `distance:` section), NOT from this
  # key or this file. Kept only for historical reference — do not tune expecting
  # an effect. Candidate for removal in a future cleanup.
  # TODO[LEGACY]: read by no code; DistanceEngine reads lpf_alpha from fr3_complete.yaml instead | confidence: high | superseded-by: fr3_complete.yaml distance.lpf_alpha | flagged: 2026-09-01
  distance_ema_alpha: 0.5

# ── Perception: obstacle rows per control point (real_time_distance) ─────────
# Read by real_time_distance from THIS file (ROS param control_config_path,
# default <share>/config/fr3_control.yaml), not from fr3_complete.yaml.
perception:
  # Obstacle entries per control point, one per connected CLUSTER, nearest
  # first. DistanceEngine used to keep only the global argmin, so two distinct
  # obstacles near the same CP produced ONE HOCBF row, and n_hat could point at
  # either. With k > 1 each CP also gets the nearest point of up to k-1 OTHER
  # clusters (never two points of one object), each its own LinkDistance
  # labelled "<link>#<cp>.<rank>" and annotated with its own cluster's track.
  # Extras past params.cbf_obstacle_horizon are dropped.
  # 1 = today's output, bit-identical (regression-tested).
  multi_obstacle_k: 1
  # [rows] cap on LinkDistance entries per frame, keeping the nearest, to bound
  # n_c churn on OSQP. Only EXTRAS compete for it: a CP's own nearest point is
  # never dropped, so the ceiling is max(this, number of CPs). Inert at k = 1.
  multi_obstacle_max_rows: 24

# NOTE: read by cbf_OSCBF_filter, cbf_velocity_filter, pentagon_qddot_commander
# and rl_policy_commander. NOT by cbf_safety_filter any more — that node reads
# franka_description/robots/fr3/joint_limits.yaml directly (see the state-limit
# box above). Columns: [q_min, q_max, qdot_max, deceleration_limit, effort].
joint_limits:
  joint1: [-2.9007,  2.9007, 2.62,  6.0,   500.0]
  joint2: [-1.8361,  1.8361, 2.62,  2.585, 500.0]
  joint3: [-2.9007,  2.9007, 2.62,  3.5,   500.0]
  joint4: [-3.0770, -0.1169, 2.62,  4.0,   500.0]
  joint5: [-2.8763,  2.8763, 5.26, 17.0,   500.0]
  joint6: [ 0.4398,  4.6216, 4.18,  5.5,   500.0]
  joint7: [-3.0508,  3.0508, 5.26, 17.0,   500.0]
