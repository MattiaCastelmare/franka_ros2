# Human hand tracking + ACTIVE/STANDBY selector configuration
# Defaults extracted from the validated runtime implementation.

human_hand_tracker:
  ros__parameters:

    # Tracker / MediaPipe
    show_selected_landmarks: true
    publish_debug_image: true
    model_complexity: 1
    static_image_mode: false
    min_tracking_confidence: 0.5
    min_detection_confidence: 0.4
    # Lost ACTIVE hand: palm rebuilt from the pose wrist/elbow for up to this
    # long (published as ESTIMATED). 0 disables.
    arm_bridge_s: 1.0
    # Hand detector (utils/hand_detectors.py): rtmw (RTMW whole-body via rtmlib,
    # GPU, Apache-2.0) | mediapipe (Holistic, CPU; also the automatic fallback
    # when RTMW cannot start). Same HandTrackingRaw and pipeline after it.
    hand_detector: rtmw
    # lightweight (RTMW-m) | balanced (RTMW-l)
    rtmw_mode: lightweight
    # RTMW models compiled by TensorRT in FP16 (needs tensorrt-cu12; first start builds the engines)
    rtmw_tensorrt: true
    # Palm normal: depth (RGB-D plane) | mediapipe (3D landmarks; with rtmw
    # the tracker uses depth, RTMW hands have no z).
    palm_normal_method: mediapipe
    # palm UP / SIDE / DOWN (human_hand_tracker.palm_up_side_down): RTMPose-m hand on the hand crop
    # (palm_hand_model, rtmw only, ~5 ms TensorRT). Back of the hand seen from chirality
    # palm_chirality_min; with an object DOWN needs palm_down_chirality (weaker: side grip).
    # SIDE = published normal |z| < 0.5 (palm tilted > 60 deg). Without the model (false, or MediaPipe):
    # vote of normal, fingers slope and thumb side (vote_up_down)
    palm_hand_model: true
    palm_chirality_min: 0.2
    palm_down_chirality: 0.35
    # Gripper camera (D405): second view of the hand, used only while its
    # images and the robot TF arrive. Extrinsics: config/d405_extrinsics.yaml.
    gripper_camera: true
    gripper_camera_namespace: /d405/d405

    # Interaction selector V3.4.1
    interaction_switch_confirm_frames: 3
    interaction_switch_margin_m: 0.08
    interaction_selector_horizon_s: 0.25
    interaction_min_closing_m_s: 0.03
    interaction_min_arm_extension_rate_s: 0.12
    interaction_strong_closing_m_s: 0.12
    interaction_closing_advantage_m_s: 0.05
    interaction_engaged_memory_s: 0.8
    interaction_engaged_onset_advantage: 0.2
    interaction_engaged_recovery_advantage: 0.45
    interaction_engaged_retract_m_s: 0.05
    # history of distance / arm extension restarts after this gap [s]
    interaction_history_gap_s: 0.35
    # static advantage of the other hand: weights of robot proximity and body reach, and the
    # differences that saturate them (distance [m], reach [body scale])
    interaction_proximity_weight: 0.65
    interaction_reach_weight: 0.35
    interaction_distance_scale_m: 0.30
    interaction_reach_scale: 0.75
    # onset advantage needed while the ENGAGED hand retracts (instead of engaged_onset_advantage)
    interaction_retract_onset_advantage: 0.10
    # recovery transfer also when the other hand is this many switch margins closer
    interaction_far_ahead_margins: 2.0
    # pose keypoints used for the body cues: shoulders / wrists, hips
    interaction_pose_min_visibility: 0.5
    interaction_hip_min_visibility: 0.4
    # object in the ACTIVE hand (Hands23 seen within object_memory_s [s]): an onset transfer to the
    # other hand needs this much more static advantage, only if the ACTIVE hand is not retracting
    # and at least as extended as the other one; 0 = object not used
    interaction_object_memory_s: 0.5
    interaction_object_onset_advantage: 0.2
    # standby posture: a hand with reach below standby_reach (close to the torso) loses up to
    # standby_weight of static advantage, in proportion; 0 = off
    interaction_standby_reach: 0.2
    interaction_standby_weight: 0.3
    # fr3_link8 -> fr3_hand_tcp of the URDF (centre between the finger pads) [m]
    interaction_tcp_offset_m: 0.1034

hand_state_estimator:
  ros__parameters:
    reacquire_frames: 3
    confidence_sigma: 0.05
    stability_speed: 0.2
    lost_timeout: 0.5
    max_position_age_s: 0.101
    enable_prediction_bridge: true
    max_prediction_age_s: 0.3
    # W75 histories restart when no fresh palm came for this long [s] (shorter than lost_timeout)
    w75_gap_reset_s: 0.2

kalman_hand:
  ros__parameters:
    direct_sigma: 0.003
    estimated_sigma: 0.03
    sigma_accel: 8.0
    lost_timeout: 0.5
    mahalanobis_threshold: 11.345
    # palm shape recovery: wrist + MCP 5/9/17 as one rigid body. A landmark the gate rejects
    # but that keeps the palm shape (<= shape_tolerance_m) and is reachable (<= max speed) is
    # re-acquired; a missing one is rebuilt from the other three. false = previous behaviour.
    shape_recovery: true
    shape_tolerance_m: 0.015
    reacquire_max_speed_m_s: 2.0
    rigid_fill_sigma: 0.01

distance_handover_estimator:
  ros__parameters:
    ttc_min_closing_speed: 0.02
    # observer (APPROACHING / HOLD / RETREATING), distance_handover_estimator docstring. 16/10: user's clips of
    # 12/10 (80, 98 replays) and of the 14/10 observer bag (39): 0.929 / 0.989 against 0.907 / 0.856 of the 12/10
    # thresholds (0.5 s 0.08 m 0.20 m/s, 0.2 s 0.06 m 0.20 m/s, 2 frames), which flickered on a waiting hand.
    # Speed only for quick moves (0.30 m/s); a slow steady one (>= 0.20 m/s) through the displacement windows
    observer_approach_window_s: 0.5
    observer_approach_displacement_m: 0.10
    observer_approach_speed: 0.30
    observer_retreat_window_s: 0.3
    observer_retreat_displacement_m: 0.06
    observer_retreat_speed: 0.30
    observer_exit_fraction: 0.7
    observer_confirm_frames: 3
    # closing speed of the hand alone, not hand - gripper (distance_handover_estimator docstring)
    observer_hand_only: true
    # 1-sigma camera-robot calibration error [m], added to the palm covariance in distance_sigma
    robot_position_sigma_m: 0.01

hand_tracking_csv_logger:
  ros__parameters:
    output_root: "/ros2_ws/src/franka_experiments/results"
