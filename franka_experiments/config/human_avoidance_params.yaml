# ========================================================================
# HUMAN-ROBOT AVOIDANCE CONTROLLER PARAMETERS
# ========================================================================
# CBF-QP velocity avoidance driven by pre-computed human-robot distance.
#
# This node subscribes to HumanRobotDistance messages (published by an
# external human-distance estimation node) and generates repulsive joint
# velocities via a Control Barrier Function (CBF) safety filter.
# ========================================================================

human_avoidance_controller:
  ros__parameters:
    # =====================
    # CONTROL RATE
    # =====================
    control_rate: 100.0  # Hz

    # =====================
    # HUMAN DISTANCE INPUT
    # =====================
    human_distance_topic: "/human_robot/closest_distance"
    min_confidence: 0.3   # discard measurements below this confidence [0-1]

    # =====================
    # AVOIDANCE OUTPUT
    # =====================
    # Topic on which repulsive joint velocities are published.
    # The RT blender (franka_rt_controllers) subscribes to this topic.
    # __auto__ → namespace-aware "avoidance_qdot" (matches blender default).
    avoidance_output_topic: "__auto__"

    # =====================
    # CBF-QP AVOIDANCE
    # =====================
    influence_distance: 0.30  # [m] activation radius
    d_safe: 0.05              # [m] safety margin (h = d - d_safe)
    k_alpha: 1.0              # CBF class-K linear gain
    k_rep: 0.5                # repulsion gain for nominal velocity
    max_joint_vel: 0.5        # [rad/s] symmetric per-joint velocity bound

    # =====================
    # CAPSULE RISK WEIGHTS
    # =====================
    capsule_weight_last2: 2.0    # last 2 capsules (EE priority)
    capsule_weight_last3: 1.5    # 3rd from end
    capsule_weight_default: 1.0  # all other capsules

    # =====================
    # CAPSULE GEOMETRY (for visualization and Pinocchio init)
    # =====================
    capsule_radii: [0.15, 0.12, 0.13]
    debug_capsule_index: -1  # -1 = all capsules

    # =====================
    # VISUALIZATION
    # =====================
    distance_inflation: 0.0  # [m] conservative offset for display
