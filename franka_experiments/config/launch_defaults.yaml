# ═══════════════════════════════════════════════════════════════════════════
# Launch defaults for franka_experiments launch files
# ═══════════════════════════════════════════════════════════════════════════
# Edit this file to change launch argument defaults WITHOUT touching Python.
# Every key maps 1-to-1 to a ros2 launch argument.
# ═══════════════════════════════════════════════════════════════════════════

# ── Robot / hardware ──────────────────────────────────────────────────────
robot_ip: "192.168.1.10"
arm_id: "fr3"
namespace: ""
use_fake_hardware: false
fake_sensor_commands: false
load_gripper: true
controllers_yaml: "__auto__"

# ── Camera & calibration ─────────────────────────────────────────────────
enable_camera: true
# RealSense depth_module.depth_profile for the scene camera (D455). PINNED
# because with no profile librealsense chose 15 fps on this rig (July bags and
# the Sep 2026 live runs both show a 66.7 ms frame period), which doubles the
# sampling wait and turns a 13 ms camera hop into 62 ms — the largest single
# item in the CBF's blind time (scripts/latency_budget.py). Set it to "" to
# leave the driver's choice alone.
#
# NOW AT 90 fps, verified against the hardware rather than the datasheet:
# `v4l2-ctl -d /dev/video0 --list-formats-ext` lists Z16 90/60/30/15/5 fps at
# 848x480 on this D455 (1280x720 caps at 30), and the link is USB 3.2 at
# 5 Gbps, so the resolution does not have to drop for it. The compute has the
# room: the Sep 2026 runs measured tf+mask+dist+track at 5-6 ms against an
# 11.1 ms budget, and depth_callback keeps a Queue(maxsize=1), so a frame the
# compute loop cannot take is DROPPED rather than queued — more fps buys a
# fresher frame, never a backlog.
#
# What it would have broken, and no longer does: every frame-counted threshold
# in the perception config (track coast, M-of-N birth, self-detection delays,
# the distance EMA) used to be tuned against 30 Hz and would have shrunk 3x in
# SECONDS. They are durations now (fr3_complete.yaml: max_coast_s,
# confirm_window_s, window_s, lpf_tau_s) and real_time_distance derives the
# counts from the rate it measures on the stream.
camera_depth_profile: "848x480x90"
# RealSense align_depth.enable. Driver default is false, so without this the
# depth stream only ever publishes on /camera/camera/depth/* (unaligned to
# the color pixel grid) — /camera/camera/aligned_depth_to_color/* simply does
# not exist. ON by default so recorded bags always carry the aligned pair.
camera_align_depth: true

# Which physical camera is which. The leading underscore is MANDATORY: without
# it the YAML/launch value is parsed as an integer and librealsense answers
# "The requested device ... is NOT found". The D455's ROS serial is NOT the
# iSerial printed by the USB descriptor (318523150655).
camera_serial: "_318122300288"        # D455, scene camera -> /camera/camera/*

# Eye-in-hand D405. Recording only: no node consumes it, it rides along in the
# bag for the thesis dataset. Topics are /<wrist_camera_name>/<same>/...
#
# 21 Sep 2026, measured: the failure mode to know is that the camera WEDGES —
# it enumerates, answers every control request (serial, firmware, profile
# list), lets the kernel run VIDIOC_STREAMON successfully, and then sends
# nothing. The driver advertises the topics anyway, so a bag records
# /d405/d405/* with message_count 0 and nothing warns you. `initial_reset` and
# a USB unbind/rebind do NOT clear it; only removing power does (unplug/replug,
# or `uhubctl -l <hub> -p <port> -a cycle` when it hangs off a switchable hub).
#
# On a 480 Mbps link, once unwedged, colour+depth at 640x480x30 stream fine.
# 848x480x30 is rejected there (the driver silently drops to x10) and three
# simultaneous streams do not fit, hence infra off and these profiles. Raise
# them back to 848x480x30 on a SuperSpeed connector.
# ON by default since 21 Sep 2026, when the camera was unwedged and proved to
# stream. NOTE this key is SHARED: velocity_cbf_control_stack.launch.py reads it
# too, so that stack now also starts the D405 — driver only, it opens no window
# (show_wrist_image is read by minimal.launch.py alone). Pass
# start_wrist_camera:=false on the command line for a run you want stripped down.
start_wrist_camera: true
wrist_camera_serial: "_126122270738"
wrist_camera_name: "d405"
wrist_color_profile: "640x480x30"     # D405 colour rides on the depth module
wrist_depth_profile: "640x480x30"
wrist_enable_depth: true              # false = colour alone, the safest on USB 2
# Open rqt_image_view on /<wrist_camera_name>/<same>/color/image_raw. Only has
# an effect with start_wrist_camera:=true, which is already an explicit opt-in.
# It is the quickest check that the D405 is actually STREAMING and not just
# advertising: on a USB 2.1 link the topics exist and the window stays black.
show_wrist_image: true

# ── Controller mode (used by minimal.launch.py) ───────────────────────────
# false → rt_velocity_executor_controller (default, safest)
# true  → rt_torque_controller
# cbf   → cbf_torque_controller (C++ RT, rarely used)
use_torque_controller: "false"

# ── RT velocity executor controller ───────────────────────────────────────
qdot_max: 1.5
command_topic: "qdot_cmd"
max_accel: 1.5  # jerk-constrained: 2×1.5/0.001=3000 rad/s³ < joint2 limit 3750
timeout_threshold_s: 0.5
timeout_ramp_s: 1.0
gazebo: false
enable_interpolation: true

# ── RT torque controller ───────────────────────────────────────────────────
# lpf_alpha: 1.0 = no filtering (raw passthrough), 0.0 = never updates.
# At 1 kHz controller rate with 100 Hz Python commander, alpha=0.3 smooths
# the inter-sample torque steps with a ~2.8 ms rise time, tracking within
# each 10 ms Python period without introducing significant lag.
lpf_alpha: 0.3
tau_max_scale: 1.0

# ── Scheduling / jitter reduction ─────────────────────────────────────
control_spawner_delay_s: 10.0
# On this rig the D455 ALWAYS logs a "Device or resource busy" / "device has
# been disconnected" cycle on the very first open, self-healing via an
# internal reset + re-enumeration (video0 -> video6) into "RealSense Node Is
# Up!" ~1.9 s later — reproduced with camera_delay_s raised to 1.5 s (same
# offset from the node's own construction, not from launch start) and with
# rs_launch.py's initial_reset:=true (same pattern). Neither changes it, so
# this delay does NOT avoid the cycle — it's cosmetic log noise, harmless
# because it's long gone before control_spawner_delay_s (10 s) starts
# anything RT-critical. Left at 0.0; raise it only to push the camera driver
# launch itself later relative to other nodes, not to chase this warning.
camera_delay_s: 0.0
start_human_pose: true
human_pose_delay_s: 0.0
start_real_time_distance: true
real_time_distance_delay_s: 8.0
# Publish the distance overlay (what the 'Robot + closest distance'
# window draws) on /real_time_distance/overlay_image, so a bag can
# record the picture itself instead of grabbing the screen. Off by
# default: it costs one bgr8 frame per vis tick (perception.vis_rate_hz
# in the robot config) even when nothing subscribes.
publish_overlay_image: false

# ── Torque control stack (torque_control_stack.launch.py) ─────────────
# Startup sequencing and wiring for the acceleration-space torque pipeline.
# NOTE the `torque_*` prefix: `real_time_distance_delay_s` above is already
# taken by minimal/thales launches with a DIFFERENT value (8.0 s), so these
# keys are namespaced to avoid silently changing those stacks.
torque_command_topic: "torque_cmd"        # rt_torque_controller tau topic (relative to the CM namespace)
controller_spawner_timeout_s: 30.0        # [s] controller_manager spawner timeout
torque_dynamics_delay_s: 2.0              # [s] cbf_safety_filter + qddot_to_torque pre-init (before the RT loop)
torque_rtd_delay_s: 2.0                   # [s] real_time_distance pre-init (trimesh loading before the RT loop)
torque_commander_extra_delay_s: 2.0       # [s] added to control_spawner_delay_s → commander start
torque_world_tf_delay_s: 1.0              # [s] world → base static TF
torque_camera_tf_delay_s: 1.0             # [s] base → camera_link static TF
torque_image_republisher_extra_delay_s: 3.0  # [s] added to camera_delay_s → image republisher
torque_finger_pub_delay_s: 2.0            # [s] MoveIt finger joint-state publisher
torque_finger_pub_rate_hz: 10.0           # [Hz] MoveIt finger joint-state publisher rate
start_move_group: true                    # MoveIt planning services used by pentagon_qddot_commander
start_experiment_logger: true             # CSV/plot run logger
experiment_logger_delay_s: 2.0            # [s] experiment_logger start

# ── Trajectory overlay ───────────────────────────────────────────────────────
# The commanded path P(s) in red against the measured end effector in blue.
# TWO nodes draw that, and the default is now the first:
#
#   trajectory_overlay_node        on the scene camera's RGB image, as two short
#                                  fading trails chasing each other, in its own
#                                  OpenCV window. Needs enable_camera and the
#                                  camera_extrinsics.yaml calibration — which it
#                                  also checks, for free: a dot that does not sit
#                                  on the gripper IS the calibration drifting.
#   trajectory_visualization_node  the same two traces as an RViz MarkerArray,
#                                  in 3-D, with no camera involved.
#
# Both are cheap; the GUIs are not, and nothing pins rviz2 or the overlay window
# away from the isolated RT cores. For a run whose timing you intend to trust,
# clear start_rviz and trajectory_overlay_window (the overlay topic keeps being
# published, so the picture is still recordable).
#
# start_rviz and its delay used to sit in the scheduling block above, read by
# nothing. They are here now because something finally reads them.
start_trajectory_viz: true                # EE trails drawn on the camera image
trajectory_overlay_window: true           # …in a window, not just on a topic
trajectory_trail_seconds: 2.0             # [s] how long a trail lives before it fades out
start_trajectory_markers: false           # the older RViz MarkerArray node
start_rviz: false                         # open rviz2 on those markers
trajectory_viz_delay_s: 3.0               # [s] all of them start after the commander

# ── Motion source (torque_control_stack) ──────────────────────────────
# Exactly one node may publish q̈_nom; motion_source picks it.
#   pentagon — analytic path + avoidance-first shaping (needs move_group)
#   rl       — ONNX Safe-RL policy from franka_sim (no move_group needed)
motion_source: pentagon
rl_onnx_model: ""              # empty = newest .onnx under franka_sim/models,
                               #   picked by MTIME and logged at WARN on startup
rl_sim_config: ""              # empty = the config.yaml frozen next to the model
rl_target_xyz: "[0.45, 0.0, 0.45]"   # [m] reach target in fr3_link0
rl_target_sequence: ""         # "x,y,z, x,y,z, …" — overrides rl_target_xyz
rl_action_scale: 1.0           # derate in (0,1]; use 0.3 for a first real run

# ── Obstacle prediction & evasion (torque_control_stack) ──────────────
# The cluster -> track -> Kalman pipeline and the three CBF terms that consume
# it. ON by default here, so a bare `ros2 launch torque_control_stack...` runs
# with obstacle-velocity prediction; set any of them false on the command line
# to fall back.
#
# The first two go TOGETHER and neither does anything alone: obstacle_tracking
# only publishes fields, obstacle_velocity_source only reads them. With
# tracking off and source:=tracker the CBF finds zeros on the wire and falls
# back to v_obs = 0 -- safe, but with no velocity anticipation at all, which is
# strictly worse than the residual estimator it replaced.
obstacle_tracking: true          # cluster + Kalman-track obstacles in real_time_distance
obstacle_velocity_source: tracker  # 'residual' = the old scalar a^T qdot - ddot

# Barrier tightened by the tracker's own admitted velocity uncertainty,
# k_sigma * sqrt(n^T P_vv n) * t_latency. Inert without a track.
uncertainty_margin: true

# Step SIDEWAYS out of the swept volume when the acceleration box says the
# closing rate cannot be nulled before the gap reaches zero. A bias on the QP's
# target, never a constraint, so it cannot loosen a barrier or make the problem
# infeasible. Inert without a track.
lateral_evasion: true

# Step aside toward the fastest direction orthogonal to v_obs when the joint
# VELOCITY box says the point cannot outrun the obstacle along the normal
# (Phase 2, utils/evasion_direction). Also a bias on the QP's target only.
outrun_evasion: true

# Livelock escape (Phase 3c): the QP has been bending the nominal while the
# arm stands still for livelock_stall_s -> a bounded, logged nudge in the
# barrier's nullspace until the arm moves again. Objective only.
livelock_escape: true

# Zone ladder: four rungs on the obstacle gap (notice / active / priority /
# hold) that schedule the HOCBF gains, the slack priority and whether the
# trajectory runs at all. Replaces six uncoordinated engagement distances with
# one explicit ladder; see the long note in fr3_control.yaml. Boundaries are
# multiples of d_safe (zone_r_*), so the ladder follows d_safe. Below
# zone_r_hold*d_safe the TASK is suspended and the nominal becomes a braking command
# — the barrier rows keep full authority throughout, so this is not a freeze.
zone_ladder: true

# Discard a residual v_obs frame when the contact normal rotated further than
# obstacle_velocity_normal_rot_max between the two frames it differences, i.e.
# the nearest obstacle point hopped to another surface patch. Aimed at the
# fabricated closing speed measured on a STATIC obstacle. Watch `nrot=` in
# CBFDIAG: if it never climbs, the hypothesis is wrong and this should go back
# off rather than be tuned.
obstacle_velocity_normal_guard: true

# Discard a control point's closing-speed state when its NEAREST OBSTACLE
# changes identity — a different track_id, or a jump in closest_point_human
# larger than the fastest obstacle the filter admits could have travelled.
# Without it the residual estimator differences the distance across two
# different bodies whenever the argmin switches between them, which is the
# classic "one static obstacle plus one moving one" scene: measured on
# hardware it fabricated closing speed up to the 2.0 m/s clamp on a row that
# was not even the closest, and through k1 that is ~19 rad/s^2 of demanded
# retreat. The TRACKER estimate is memoryless and survives the reset, so a
# genuinely approaching obstacle keeps being reported. Watch `nid=` in
# CBFDIAG. Threshold: obstacle_velocity_identity_jump in fr3_control.yaml.
obstacle_identity_guard: true

# Latency compensation (Phase 4): predict each tracked obstacle forward by the
# measured blind time (scripts/latency_budget.py) and tighten by the propagated
# position uncertainty. OFF by default, as specified — turn on after a
# supervised run has confirmed the extra tightening on hardware.
latency_compensation: false

# Up to k obstacle rows per control point, one per connected cluster
# (real_time_distance, perception.multi_obstacle_k): two distinct obstacles
# near the same control point each get their own HOCBF row. 1 = the single
# nearest point, as before.
multi_obstacle_k: 2

# Tracked obstacle velocity inside hdot (cbf_safety_filter enable_vobs_in_hdot):
# on rows with a confirmed track, hdot = a^T qdot - n_hat^T v_track, SIGNED.
# Needs obstacle_tracking. Watch vhd= in CBFDIAG.
vobs_in_hdot: true

# ── ISO 10218-1/-2:2025 layer (torque_control_stack) ──────────────────
# ALL FALSE. The ISO layer adds no behaviour and changes no number until
# iso_enabled is asked for on the command line; with these off the filter's
# output is bit-identical to what it was before the layer existed.
#
# Before turning iso_enabled on, read franka_experiments/SAFETY.md: with the
# conformant intrusion distance C = 0.85 m the ISO-required d_safe floor is
# 0.92 m, which exceeds this arm's reach — conformant SSM is NOT achievable in
# this cell, and the filter will refuse to start rather than pretend otherwise.
# Nothing here is a certified safety function.
iso_enabled: false
iso_mode: automatic            # automatic | reduced (adds the 250 mm/s TCP row)
iso_ssm_speed_rows: false      # SSM bound drives the task-space speed rows
iso_monitor_enabled: false     # start iso_safety_monitor (independent channel)
torque_iso_monitor_delay_s: 3.0  # [s] iso_safety_monitor start (after real_time_distance)

# Evidence recorder for an ISO assessment: TCP and control-point speed, the
# separation margin d - S_p per sample, stop timing, torque saturation, plus a
# manifest carrying the thresholds the run was judged against. Passive — it
# publishes nothing. Independent of iso_enabled: with the layer off it records
# what the CURRENT system would and would not have satisfied.
# Read the run back with scripts/iso_evidence_report.py <run_dir>.
start_iso_evidence_logger: false
torque_iso_evidence_delay_s: 3.0  # [s] iso_evidence_logger start
iso_evidence_dir: "~/franka_iso_evidence"
iso_evidence_run_name: "run"

# Empty = use the value in fr3_control.yaml. Set BOTH when running with
# iso_enabled:=true, so link_speed_max <= iso_v_pfl and retreat_cap_max_speed
# stays strictly below it (the filter raises otherwise, it does not clamp):
#   link_speed_max: 0.68
#   retreat_cap_max_speed: 0.60
link_speed_max: ""
retreat_cap_max_speed: ""

# Speed-proportional standoff (cbf_safety_filter enable_velocity_standoff):
# d_safe_eff = d_safe + 0.20 s * closing speed (max +0.20 m). A fast obstacle
# is avoided from further away, a static one keeps plain d_safe.
# Watch hstd= in CBFDIAG. Not yet validated on hardware.
velocity_standoff: true

# DANGER, and it stays off. Renders a synthetic sphere into the depth stream so
# the whole chain can be exercised end to end -- the arm WILL move away from
# something that is not there. Command line only, never a default.
sim_obstacle: false

# Replay a bag as the DEPTH SOURCE instead of a live camera (only the depth
# image and camera_info; TF and joint states still come from the running robot).
# Empty = off.
depth_bag: ""

# ── Rosbag recording ──────────────────────────────────────────────────
start_rosbag: false
rosbag_output_dir: ""          # empty = ~/ros2_bags/rosbag_YYYYMMDD_HHMMSS
rosbag_delay_s: 3.0            # extra seconds after real_time_distance starts