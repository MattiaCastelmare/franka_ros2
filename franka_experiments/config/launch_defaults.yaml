# ═══════════════════════════════════════════════════════════════════════════
# Launch defaults for wrapper_forward_velocity.launch.py
# ═══════════════════════════════════════════════════════════════════════════
# Edit this file to change launch argument defaults WITHOUT touching Python.
# Every key maps 1-to-1 to a ros2 launch argument:
#   ros2 launch franka_experiments wrapper_forward_velocity.launch.py <key>:=<value>
# ═══════════════════════════════════════════════════════════════════════════

# ── Robot / hardware ──────────────────────────────────────────────────────
robot_ip: "192.168.1.10"
arm_id: "fr3"
namespace: ""
use_fake_hardware: false
fake_sensor_commands: false
load_gripper: true
controllers_yaml: "__auto__"

# ── Camera & calibration ─────────────────────────────────────────────────
enable_camera: true

# ── Controller mode ───────────────────────────────────────────────────────
use_torque_controller: "cbf"

# ── RT velocity executor controller ───────────────────────────────────────
qdot_max: 1.5
command_topic: "qdot_cmd"
max_accel: 2.0
timeout_threshold_s: 0.5
timeout_ramp_s: 1.0
gazebo: false
enable_interpolation: true

# ── Scheduling / jitter reduction ─────────────────────────────────────
control_spawner_delay_s: 10.0
start_rviz: true
rviz_delay_s: 5.0
camera_delay_s: 0.0
start_human_pose: true
human_pose_delay_s: 0.0
start_real_time_distance: true
real_time_distance_delay_s: 8.0