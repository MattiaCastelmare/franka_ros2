robot:
  base_frame: fr3_link0

  segment_links:
    - fr3_link0
    - fr3_link1
    - fr3_link2
    - fr3_link3
    - fr3_link4
    - fr3_link5
    - fr3_link6
    - fr3_link7
    - fr3_link8

  segments:
    - seg_idx: 0
      start_link: fr3_link0
      end_link: fr3_link1
      control_points: 0
      radius: 0.05

    - seg_idx: 1
      start_link: fr3_link1
      end_link: fr3_link2
      control_points: 0
      radius: 0.05

    - seg_idx: 2
      start_link: fr3_link2
      end_link: fr3_link3
      control_points: 0
      radius: 0.05

    - seg_idx: 3
      start_link: fr3_link3
      end_link: fr3_link4
      control_points: 2
      radius: 0.05

    - seg_idx: 4
      start_link: fr3_link4
      end_link: fr3_link5
      control_points: 2
      radius: 0.05

    - seg_idx: 5
      start_link: fr3_link5
      end_link: fr3_link6
      control_points: 2
      radius: 0.05

    - seg_idx: 6
      start_link: fr3_link6
      end_link: fr3_link7
      control_points: 2
      radius: 0.05

    - seg_idx: 7
      start_link: fr3_link7
      end_link: fr3_link8
      control_points: 3
      radius: 0.05

# Mesh files are relative to the franka_description package share directory.
# The node resolves the full path via ament_index_python at runtime.
meshes:
  package: franka_description
  sample_points_per_link: 300
  files:
    fr3_link0: meshes/robot_arms/fr3/collision/link0.stl
    fr3_link1: meshes/robot_arms/fr3/collision/link1.stl
    fr3_link2: meshes/robot_arms/fr3/collision/link2.stl
    fr3_link3: meshes/robot_arms/fr3/collision/link3.stl
    fr3_link4: meshes/robot_arms/fr3/collision/link4.stl
    fr3_link5: meshes/robot_arms/fr3/collision/link5.stl
    fr3_link6: meshes/robot_arms/fr3/collision/link6.stl
    fr3_link7: meshes/robot_arms/fr3/collision/link7.stl
    fr3_link8: meshes/robot_ee/franka_hand_white/collision/hand.stl

topics:
  depth_image: /camera/camera/depth/image_rect_raw
  depth_camera_info: /camera/camera/depth/camera_info
  closest_distance: /human_robot/closest_distance
  per_link_distances: /cbf/per_link_distances
  overlay_image: /real_time_distance/overlay_image
  depth_optical_frame: camera_depth_optical_frame

# Distance semantics (what /cbf/per_link_distances carries)
# ---------------------------------------------------------
# LinkDistance.distance is the gap from a control point to the nearest OBSERVED
# obstacle surface point, with the capsule radius and the mask-dilation margin
# already subtracted, clamped at 0. It is a surface/edge gap by construction: a
# depth camera returns only the front surface of an obstacle, so there is no
# interior term and no distance transform anywhere in this pipeline. A gap of
# exactly 0.0 means "at the capsule surface" and is published valid.
#
# One LinkDistance is emitted per CONTROL POINT, not per link, so robot_link_name
# repeats across the CPs of a segment and the CBF assembles one HOCBF row for
# each. With the segments below that is 11 rows (2+2+2+2+3), not 5.
distance: # in meters
  min_depth_m: 0.15
  max_depth_m: 4.0
  pixel_step: 10
  image_margin_px: 10
  roi_pad_px: 90

  # ── Publish gate for the whole frame (NOT a per-CP filter) ───────────────
  # real_time_distance builds `valid` = CPs whose distance falls in this band.
  # If `valid` is EMPTY the frame publishes only the empty heartbeat and no
  # MultiLinkDistance at all; if ANY CP falls inside, EVERY control point is
  # published (build_cp_messages applies this band only to the legacy
  # MultiDistance topic, never to the per-CP MultiLinkDistance the CBF reads).
  #
  # UNCHANGED from the pre-multi-CP values, deliberately. Two things to know:
  #
  # min_thresh is a lower bound on the reported GAP, not on depth — depth noise
  # is already gated by min_depth_m below. Its real job is rejecting robot
  # pixels that leak through the dilated exclusion mask, which read as a gap of
  # ~0. That guard now costs something: since LinkDistance.valid accepts a gap
  # of exactly 0.0 (a CP at the capsule surface is a measurement, not a
  # dropout), a frame in which every CP is either < 0.08 m or > 0.7 m still
  # publishes nothing and leaves the QP with no rows. Adjacent CPs on a link sit
  # ~0.1-0.15 m apart, so in practice one of them lands in the band and rescues
  # the frame — but the hole is real and lives exactly in the contact regime.
  # Closing it means separating "is this CP self-detection?" from "should this
  # frame publish?", which is a change inside real_time_distance. Watch for it
  # on hardware before touching this number: lowering min_thresh toward 0
  # re-exposes mask leakage as emergency braking.
  #
  # max_thresh gates publishing only. CPs beyond it are still published (as long
  # as some other CP is in band) and are then trimmed by cbf_obstacle_horizon
  # (1.2 m, fr3_control.yaml). The CBF therefore never sees a frame in which no
  # CP is within 0.7 m, so that horizon only ever trims — it cannot reach
  # farther than this band allows.
  thresholds:
    min_thresh: 0.08
    max_thresh: 0.7

  # distance published when no obstacle is detected within max_thresh
  fallback_distance: 2.0

  # Liveness heartbeat: publish an EMPTY /cbf/per_link_distances when no CP is in
  # range, so consumers tell "no obstacle near" from "perception dead"; false =
  # legacy gated behaviour. Authoritative source is the ROS param of the same name.
  publish_empty_per_link: true

  # offset for control point on ee
  ee_tip_offset: 0.10
  ee_tip_axis: 2 # 0=x, 1=y, 2=z

  # Low-pass filter: EMA alpha for distance/direction smoothing across frames.
  # Closer obstacles are always taken immediately (conservative).
  # Only the recovery (obstacle moving away) is smoothed.
  # 0.0 = no filter (raw), 0.9 = heavy smoothing (slow recovery)
  lpf_alpha: 0.5

  # Throttle interval [s] for repeated distance/obstacle log messages.
  log_throttle_s: 2.0

  # Maximum age [s] of a cached TF transform before it is discarded.
  # Prevents the compute node from using arbitrarily stale robot poses.
  tf_cache_max_age_s: 0.5

  # Visualization timer rate [Hz] for the overlay rendering loop.
  vis_rate_hz: 10.0

mask: # in pixels
  robot_mask_dilate_px: 2
  ee_mask_dilate_px: 18
  search_exclusion_extra_px: 8
  # Downsample factor for dilation (runs on H/ds × W/ds image, then upsampled).
  # 4 reduces mask rebuild from ~70 ms to < 2 ms with negligible quality loss.
  mask_downsample: 4

zones: # in meters
  warning: 0.3
  danger: 0.2
  critical: 0.1

booleans:
  visualize: true             # set true to open OpenCV window (disable in headless deployments)
  exclusion_mask: true        # mask robot pixels before searching for obstacles
  raw_video: false            # show raw depth image only (no overlays)
  use_segment_distance: false # true = capsule-segment mode, false = control-point mode
  visual_ROI: true            # draw ROI bounding box on visualization
  publish_overlay_image: false