robot:
  base_frame: fr3_link0

  segment_links:
    - fr3_link0
    - fr3_link1
    - fr3_link2
    - fr3_link3
    - fr3_link4
    - fr3_link5
    - fr3_link6
    - fr3_link7
    - fr3_link8

  segments:
    - seg_idx: 0
      start_link: fr3_link0
      end_link: fr3_link1
      control_points: 0
      radius: 0.05

    - seg_idx: 1
      start_link: fr3_link1
      end_link: fr3_link2
      control_points: 0
      radius: 0.05

    - seg_idx: 2
      start_link: fr3_link2
      end_link: fr3_link3
      control_points: 0
      radius: 0.05

    - seg_idx: 3
      start_link: fr3_link3
      end_link: fr3_link4
      control_points: 2
      radius: 0.05

    - seg_idx: 4
      start_link: fr3_link4
      end_link: fr3_link5
      control_points: 2
      radius: 0.05

    - seg_idx: 5
      start_link: fr3_link5
      end_link: fr3_link6
      control_points: 2
      radius: 0.05

    - seg_idx: 6
      start_link: fr3_link6
      end_link: fr3_link7
      control_points: 2
      radius: 0.05

    - seg_idx: 7
      start_link: fr3_link7
      end_link: fr3_link8
      control_points: 3
      radius: 0.05

# Mesh files are relative to the franka_description package share directory.
# The node resolves the full path via ament_index_python at runtime.
meshes:
  package: franka_description
  sample_points_per_link: 300
  files:
    fr3_link0: meshes/robot_arms/fr3/collision/link0.stl
    fr3_link1: meshes/robot_arms/fr3/collision/link1.stl
    fr3_link2: meshes/robot_arms/fr3/collision/link2.stl
    fr3_link3: meshes/robot_arms/fr3/collision/link3.stl
    fr3_link4: meshes/robot_arms/fr3/collision/link4.stl
    fr3_link5: meshes/robot_arms/fr3/collision/link5.stl
    fr3_link6: meshes/robot_arms/fr3/collision/link6.stl
    fr3_link7: meshes/robot_arms/fr3/collision/link7.stl
    fr3_link8: meshes/robot_ee/franka_hand_white/collision/hand.stl

topics:
  depth_image: /camera/camera/depth/image_rect_raw
  depth_camera_info: /camera/camera/depth/camera_info
  closest_distance: /human_robot/closest_distance
  per_link_distances: /cbf/per_link_distances
  overlay_image: /real_time_distance/overlay_image
  depth_optical_frame: camera_depth_optical_frame

distance: # in meters
  min_depth_m: 0.15
  max_depth_m: 4.0
  pixel_step: 10
  image_margin_px: 10
  roi_pad_px: 90

  # consider distance within this range
  thresholds:
    min_thresh: 0.08
    max_thresh: 0.7

  # distance published when no obstacle is detected within max_thresh
  fallback_distance: 2.0

  # offset for control point on ee
  ee_tip_offset: 0.10
  ee_tip_axis: 2 # 0=x, 1=y, 2=z

  # Low-pass filter: EMA alpha for distance/direction smoothing across frames.
  # Closer obstacles are always taken immediately (conservative).
  # Only the recovery (obstacle moving away) is smoothed.
  # 0.0 = no filter (raw), 0.9 = heavy smoothing (slow recovery)
  lpf_alpha: 0.5

  # Spatial-continuity gate (option c): a suspicious approach jump (implied speed
  # > lpf_v_max_approach) that ALSO teleports the winning surface point by more
  # than this in 3D [m] requires 2 confirmation frames instead of 1 — it is likely
  # the memoryless argmin switching surface REGION (a static-obstacle artefact),
  # not a real fast approach. Never alters the reported distance, only acceptance
  # latency. Default 1.0 m = deliberately permissive (≈ disabled): no real d3d
  # distribution yet, so this MUST NOT change today's behaviour. Tighten to the
  # eventual ~0.1-0.2 m only AFTER collecting the logged RTDDIAG d3d values.
  lpf_d3d_gate_m: 1.0

  # ── DistanceEngine rate-limiter / outlier rejection ─────────────────────
  # These were hardcoded defaults inside DistanceEngine.__init__ — now exposed
  # for tuning. Values below REPRODUCE the previous hardcoded defaults exactly,
  # so adding them here does NOT change runtime behaviour until tuned.
  # (lpf_alpha and lpf_d3d_gate_m above are part of the same group.)
  lpf_v_max_approach: 2.0         # [m/s] implied approach speed gate
  lpf_outlier_recover_frac: 0.10  # fraction of d_pre to call "recovered"
  lpf_outlier_recover_abs: 0.03   # [m] absolute floor for recovery tolerance
  # Sync-jump gate (cross-CP): when this FRACTION of valid CPs all trip the
  # approach rate-limit in the same frame (with at least min_cps valid samples),
  # demand an extra confirmation frame on those CPs — likely a systemic artefact
  # (TF jitter, mask instability), not independent per-pixel noise. Conservative
  # defaults; the reported distance is never altered, only acceptance latency.
  lpf_sync_jump_frac: 0.5         # fraction of valid CPs rate-limited together
  lpf_sync_jump_min_cps: 3        # min valid-CP sample size for the gate

  # Throttle interval [s] for repeated distance/obstacle log messages.
  log_throttle_s: 2.0

  # Maximum age [s] of a cached TF transform before it is discarded.
  # Prevents the compute node from using arbitrarily stale robot poses.
  tf_cache_max_age_s: 0.5

  # Visualization timer rate [Hz] for the overlay rendering loop.
  vis_rate_hz: 10.0

mask: # in pixels
  robot_mask_dilate_px: 2
  ee_mask_dilate_px: 18
  search_exclusion_extra_px: 8
  # Downsample factor for dilation (runs on H/ds × W/ds image, then upsampled).
  # 4 reduces mask rebuild from ~70 ms to < 2 ms with negligible quality loss.
  mask_downsample: 4

zones: # in meters
  warning: 0.3
  danger: 0.2
  critical: 0.1

booleans:
  visualize: true             # set true to open OpenCV window (disable in headless deployments)
  exclusion_mask: true        # mask robot pixels before searching for obstacles
  raw_video: false            # show raw depth image only (no overlays)
  use_segment_distance: false # true = capsule-segment mode, false = control-point mode
  visual_ROI: true            # draw ROI bounding box on visualization
  publish_overlay_image: false