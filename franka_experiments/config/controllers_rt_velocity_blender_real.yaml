# Controller configuration for REAL Franka FR3 hardware with RT velocity blender.
# Namespace-agnostic (/**:) — works with any namespace or no namespace.
#
# Uses rt_velocity_blender_controller from the franka_rt_controllers package.
# Blending, rate-limiting, clamping all happen inside the 1 kHz RT update() loop.
#
# NOTE: This is a STATIC fallback YAML.  In normal operation the launch file
# generates a runtime YAML with resolved parameters (qdot_max, alpha, topics).
# Use this file only with:
#   ros2 launch … controllers_yaml:=/path/to/this/file.yaml
#
# update_rate MUST be 1000 Hz to match the real-time loop expected by libfranka;
# lower values cause "communication_constraints_violation" reflex aborts.

/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000  # Hz — must match libfranka real-time cycle
      thread_priority: 98

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

      rt_velocity_blender_controller:
        type: franka_rt_controllers/RtVelocityBlenderController

# ---------- Broadcaster parameters ----------

/**:
  franka_robot_state_broadcaster:
    ros__parameters:
      lock_try_count: 200
      lock_sleep_interval: 50        # microseconds between lock attempts
      lock_log_error: false
      lock_update_success: true

/**:
  joint_state_broadcaster:
    ros__parameters:
      arm_id: "fr3"

# ---------- RT velocity blender controller parameters ----------
# qdot_max is a SCALAR (same limit for all 7 joints).
# Value 0.0 = clamping DISABLED.  Override via launch arg or set here.
# max_accel, timeout_threshold_s, timeout_ramp_s: 0.0 = feature DISABLED.

/**:
  rt_velocity_blender_controller:
    ros__parameters:
      arm_id: fr3
      joints:
        - fr3_joint1
        - fr3_joint2
        - fr3_joint3
        - fr3_joint4
        - fr3_joint5
        - fr3_joint6
        - fr3_joint7
      tracking_topic: tracking_qdot
      avoidance_topic: avoidance_qdot
      alpha_topic: blend_alpha
      alpha: 1.0
      qdot_max: 0.0
      max_accel: 0.0
      timeout_threshold_s: 0.0
      timeout_ramp_s: 0.0
      gazebo: false
      enable_interpolation: false
