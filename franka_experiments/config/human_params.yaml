# Single source of truth for human_tracker and human_visualizer

human_tracker:
  # Topics and frames
  base_frame: fr3_link0
  pose_side: both
  color_topic: /camera/camera/color/image_raw
  depth_topic: /camera/camera/aligned_depth_to_color/image_raw
  camera_info_topic: /camera/camera/aligned_depth_to_color/camera_info
  state_topic: /human/arm_state
  raw_state_topic: /human/raw_state
  prediction_topic: /human/arm_prediction
  landmarks_2d_topic: /human/arm_landmarks_2d

  # MediaPipe and RGB-D
  model_complexity: 1
  min_detection_confidence: 0.40
  min_tracking_confidence: 0.30
  inference_hz: 30.0           # Aligned to real source frequency (30 Hz)
  visibility_threshold: 0.40
  depth_patch_radius: 2
  min_depth_m: 0.10
  max_depth_m: 3.00
  sync_queue_size: 5           # To avoid latency in the buffer
  sync_slop_s: 0.025           # For strict synchronization
  engage_stability_s: 0.3
  loss_stability_s: 0.5

  # Kalman filter
  kf_nominal_dt: 0.03333333333333333 # Nominal dt for 30 Hz (1/30 s)
  kf_process_accel_std: 1.0
  kf_measurement_std: 0.05
  max_state_age_s: 0.30
  reset_after_s: 0.50
  max_speed_m_s: 2.0

  # Constant-velocity prediction
  publish_prediction: true
  prediction_dt: 0.10
  prediction_steps: 10

human_visualizer:
  # Topics
  color_topic: /camera/camera/color/image_raw
  landmarks_topic: /human/arm_landmarks_2d
  overlay_topic: /human/arm_overlay

  # Overlay behavior
  visibility_threshold: 0.40
  max_hz: 30.0                 # RViz markers rate (the overlay follows the camera frames)
  scale: 1.0
  landmark_hold_s: 0.30
  smoothing_tau_s: 0.05        # Ignored when sync_to_landmarks is true
  sync_to_landmarks: true      # Draw on the frame MediaPipe processed (aligned, slightly delayed video)
  draw_labels: true