# Single source of truth for human_tracker and human_visualizer

human_tracker:
  # Topics and frames
  base_frame: fr3_link0
  pose_side: both
  color_topic: /camera/camera/color/image_raw
  depth_topic: /camera/camera/aligned_depth_to_color/image_raw
  camera_info_topic: /camera/camera/aligned_depth_to_color/camera_info
  state_topic: /human/arm_state
  raw_state_topic: /human/raw_state
  prediction_topic: /human/arm_prediction
  landmarks_2d_topic: /human/arm_landmarks_2d

  # MediaPipe and RGB-D
  model_complexity: 1
  min_detection_confidence: 0.40
  min_tracking_confidence: 0.30
  inference_hz: 30.0           # Aligned to real source frequency (30 Hz)
  visibility_threshold: 0.40
  depth_patch_radius: 2
  min_depth_m: 0.10
  max_depth_m: 4.00            # Covers the workspace box (up to ~3.9 m from the camera): at 3.0 a
                               # person walking behind the robot (~3.2 m) was lost and re-engaged
  sync_queue_size: 5           # To avoid latency in the buffer
  sync_slop_s: 0.025           # For strict synchronization
  engage_stability_s: 0.3
  # Disengage after this long with no valid keypoint. Long enough for a person walking
  # behind a robot (~1.3 s in the bags); no cost while it runs, since invalid keypoints
  # already reach human_distance as "nothing near"
  loss_stability_s: 1.5

  # Kalman filter
  # sigma_a / sigma_m sets the bandwidth (velocity lag ~0.13 s here, ~0.30 s at 1.0 / 0.05)
  kf_nominal_dt: 0.03333333333333333 # Nominal dt for 30 Hz (1/30 s)
  kf_process_accel_std: 3.0    # [m/s^2]
  kf_measurement_std: 0.03     # [m]
  kf_initial_position_std: 0.05  # [m]
  kf_initial_velocity_std: 1.0   # [m/s]
  kf_mahalanobis_threshold: 11.34  # chi^2_3 at 99%; <= 0 disables the gate
  fallback_depth_std_m: 0.12   # [m] std along the ray of a borrowed depth (+-0.20 m band); <= 0 disables it
  max_state_age_s: 0.30
  reset_after_s: 0.50
  max_speed_m_s: 2.5

  # Plausibility of the 3D keypoints before the Kalman filter (utils/human_validation.py)
  validation:
    enabled: true
    # Off: on the gravcomp bag the keypoint depth (the shoulder above all, 0.2-0.4 m)
    # gives implausible lengths in 40-70 % of the frames of a real person
    check_segments: false               # anthropometric bands + learned lengths
    check_torso: false                  # shoulders/hips, engagement only
    check_workspace: true
    # Identity of the arm, on its shoulder (else elbow). MediaPipe puts a confident body on
    # the FR3 and on the switched-off robot behind it; these two reject such detections
    check_background: true              # shoulder in front of the learned static scene
    check_robot: true                   # shoulder outside the FR3 (links from TF)
    robot_clearance_m: 0.15             # [m] from the link-origin polyline: FR3 radius + calibration error
    robot_tip_offset_m: 0.12            # [m] polyline end beyond fr3_link8 along its z (hand)
    # An elbow/wrist/index on the static scene or on the robot farther than this from its own
    # shoulder is the object seen where the hand is hidden. Bags: real people <= 0.97 m
    # (p99 0.71), hands MediaPipe put on a robot the person walked behind 1.08-1.86 m
    max_reach_m:
      elbow: 0.80                       # shoulder-elbow in the bags: p50 0.30, p99 0.57
      wrist: 1.00
      index: 1.15
    shoulder_memory_s: 0.5              # [s] reach measured from the last shoulder this old at most
    # A keypoint nearer than its arm neighbour by more than the segment can span (band max +
    # margin), on the robot or the static scene, reads an occluder: its depth is borrowed
    check_occlusion: true
    occlusion_margin_m: 0.15
    occlusion_robot_clearance_m: 0.25   # [m] wider than robot_clearance_m: link surface, not origins
    # MediaPipe keeps following a skeleton it latched onto a robot: after this long it is
    # made to detect again (a reset costs ~45 ms, hence the cooldown)
    redetect_after_s: 0.2
    redetect_cooldown_s: 1.0
    background:
      cell_px: 8                        # [px] cell of the background depth map
      max_depth_m: 8.0                  # [m] sensor range: the far walls must be learned too
      foreground_margin_m: 0.10         # [m] a person stands at least this much in front of the scene
      reveal_tolerance_m: 0.05          # [m] farther than the background by this = scene revealed
      reveal_rate: 0.3                  # per frame, toward a revealed (farther) surface
      absorb_tau_s: 30.0                # [s] an object left in place joins the scene; <= 0 never
      warmup_frames: 15                 # no identity decision before this many frames
      protect_px: 60                    # [px] around the tracked keypoints nothing is absorbed
    engage_visibility_threshold: 0.60   # to START tracking; visibility_threshold keeps it
    workspace_min: [-1.7, -1.7, -0.5]   # [m] fr3_link0: FR3 reach + d_safe + arm speed x horizon
    workspace_max: [1.7, 1.7, 2.2]
    segment_bands:                      # [m] wide anthropometric bands
      upper_arm: [0.20, 0.40]
      forearm: [0.18, 0.33]
      hand: [0.04, 0.20]
    learn_frames: 15                    # frames to learn the person's lengths after engagement
    learned_tolerance: 0.25             # relative deviation from the learned lengths
    shoulder_width_band: [0.25, 0.55]   # [m] torso check, engagement only
    torso_length_band: [0.30, 0.75]     # [m] used only when both hips are visible

  # Constant-velocity prediction
  publish_prediction: true
  prediction_dt: 0.10
  prediction_steps: 10

human_visualizer:
  # Topics
  color_topic: /camera/camera/color/image_raw
  landmarks_topic: /human/arm_landmarks_2d
  overlay_topic: /human/arm_overlay

  # Overlay behavior
  visibility_threshold: 0.40
  max_hz: 30.0                 # RViz markers rate (the overlay follows the camera frames)
  scale: 1.0
  landmark_hold_s: 0.30
  smoothing_tau_s: 0.05        # Ignored when sync_to_landmarks is true
  sync_to_landmarks: true      # Draw on the frame MediaPipe processed (aligned, slightly delayed video)
  draw_labels: true