# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  Controller-manager configuration for RT Velocity Executor             ║
# ║                                                                        ║
# ║  This file replaces the fr3_forward_velocity_controller with a single  ║
# ║  C++ plugin that does rate-limiting + clamping in the RT loop,         ║
# ║  eliminating sample-and-hold jitter from non-RT publishers.            ║
# ║                                                                        ║
# ║  update_rate MUST be 1000 Hz for real libfranka hardware.              ║
# ╚══════════════════════════════════════════════════════════════════════════╝

/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000          # Hz – must match libfranka real-time cycle
      thread_priority: 98

      # ── Standard broadcasters (required by Franka hardware) ──────────
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

      # ── RT velocity executor (replaces forward_command_controller) ────
      rt_velocity_executor_controller:
        type: franka_rt_controllers/RtVelocityExecutorController

# ── Broadcaster parameters ─────────────────────────────────────────────

/**:
  franka_robot_state_broadcaster:
    ros__parameters:
      lock_try_count: 200
      lock_sleep_interval: 50
      lock_log_error: false
      lock_update_success: true

/**:
  joint_state_broadcaster:
    ros__parameters:
      arm_id: "fr3"

# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  RT Velocity Executor Controller parameters                            ║
# ║                                                                        ║
# ║  IMPORTANT: every protection parameter below (qdot_max, max_accel,     ║
# ║  timeout_*) defaults to DISABLED (0.0).  You MUST set values that are  ║
# ║  appropriate for YOUR application before running on real hardware.      ║
# ║  No "sensible defaults" are invented here.                             ║
# ╚══════════════════════════════════════════════════════════════════════════╝

/**:
  rt_velocity_executor_controller:
    ros__parameters:
      arm_id: fr3
      joints:
        - fr3_joint1
        - fr3_joint2
        - fr3_joint3
        - fr3_joint4
        - fr3_joint5
        - fr3_joint6
        - fr3_joint7

      # ── Input topic ──────────────────────────────────────────────────
      # Name is relative to the controller's namespace.
      # Your Python node should publish Float64MultiArray (size=7) here.
      command_topic: qdot_cmd

      # ── Velocity clamp [rad/s] ──────────────────────────────────────
      # Single final clamp applied AFTER rate-limiting.
      # Set to 0.0 to DISABLE (NOT recommended on real hardware).
      #
      # >>> SET THIS TO YOUR APPLICATION'S SAFE LIMIT <<<
      qdot_max: 0.4         # [rad/s] - CONSERVATIVO

      # ── Rate limiter [rad/s²] ──────────────────────────────────────
      # Maximum allowed acceleration per joint per RT cycle.
      # Prevents velocity jumps when input commands arrive with jitter.
      # Set to 0.0 to DISABLE.
      #
      # >>> SET THIS BASED ON YOUR ROBOT'S JERK TOLERANCE <<<
      max_accel: 4.0        # [rad/s²] - MOLTO CONSERVATIVO (40% del limite libfranka)
                            # Valori tipici: 3.0 (molto smooth) - 8.0 (reattivo)

      # ── Smooth timeout ramp (reserved – not used in RT path) ──────
      # Reserved for future use. Values are read but not applied.
      timeout_threshold_s: 0.3
      timeout_ramp_s: 0.8
