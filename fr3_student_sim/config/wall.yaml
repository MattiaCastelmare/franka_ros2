# Infinite virtual compliant plane in the robot base frame.
# The force acts only at fr3_fingertip; the Gazebo box is visual-only.
# The nominal 4 cm circle starts near x = 0.56 m and reaches x = 0.64 m:
# its reference extends approximately 0.02 m (20 mm) beyond this x = 0.62 m wall.
# Reference overlap is not the robot's actual penetration under contact force.
# Turn it off with:  ros2 launch fr3_student_sim student.launch.py wall:=false
point: [0.62, 0.0, 0.50]  # [m] point on the wall plane
normal: [-1.0, 0.0, 0.0]    # outward normal towards free space; normalized on loading
stiffness: 20000.0          # k_e [N/m], active only at positive penetration
damping: 15.0               # b_e [N s/m], active only while penetrating and compressing
