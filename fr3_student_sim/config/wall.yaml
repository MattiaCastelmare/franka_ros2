# Virtual compliant wall (a plane). Units: m, N/m, N s/m. World frame = robot base.
# Turn it off with:  ros2 launch fr3_student_sim student.launch.py wall:=false
point: [0.6385, 0.0, 0.50]  # 0.1 mm closer to the robot than the previous x = 0.6398
normal: [-1.0, 0.0, 0.0]    # vertical wall, outward normal towards the robot
# The nominal circle reaches x = 0.64 m: 0.3 mm overlap with the wall.
stiffness: 20000.0          # k_e: compliant contact stiffness
                            # The planar 3R study used 1500 (a soft, foam-like wall).
damping: 15.0               # b_e, active only while compressing (3R value)
