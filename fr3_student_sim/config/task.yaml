# Default task parameters passed to the selected controller as self.params.
# The runner also supplies the active wall's static point and normal.

# Start pose [rad], fr3_joint1..7. The robot is spawned here. The tool points
# horizontally at the wall (+x), fingertip at (0.56, 0, 0.50) m.
initial_q: [0.0, -0.1517, 0.0, -2.6105, 0.0, 4.0295, 0.785]

# Circle in the vertical x-z plane. It starts at the start-pose tool position
# (its -x extreme). With period = 8 s and ramp = 1 s, its first +x extreme
# occurs at t = 4.5 s of RUN, rather than period/2 during a smooth startup.
# The reference then reaches x approximately 0.64 m (2 cm beyond the base wall).
circle:
  radius: 0.04      # [m]
  period: 8.0       # [s] period at cruise angular speed
  ramp: 1.0         # [s] smooth start of the angular speed

# Legacy top-level gains for a custom normalized error law e'' + Kd e' + Kp e = 0.
# None of the included controllers reads these two keys: circle/line tracking
# uses tracking.kp_position/kd_position; examples/cartesian_pd.py uses its own
# K, D and D_JOINT constants. Without tracking entries, circle/line use defaults.
Kp: 400.0           # [1/s^2]
Kd: 40.0            # [1/s]    (critical damping: Kd = 2 sqrt(Kp))
