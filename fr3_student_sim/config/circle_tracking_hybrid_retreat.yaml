# Controller: students/circle_tracking/controller_hybrid_retreat.py
# Requires observer:=true. First detection immediately selects the retreat.
# TRACK uses circular tracking, nullspace damping and mass minimization.
# Only fingertip position is tracked; orientation remains free in both phases.
initial_q: [0.0, -0.1517, 0.0, -2.6105, 0.0, 4.0295, 0.785]  # [rad], fr3_joint1..7

circle:
  radius: 0.04  # [m] vertical x-z circle, starting at its -x extreme
  period: 4.0   # [s] period at cruise angular speed
  ramp: 1.0     # [s] smooth startup

tracking:
  kp_position: 100.0  # [1/s^2] Cartesian gain in TRACK and RETREAT
  kd_position: 20.0   # [1/s] Cartesian velocity gain in TRACK and RETREAT
  kd_nullspace: 4.0   # [1/s] nullspace velocity damping in TRACK and RETREAT

mass_minimization:
  gain: 0.1            # [N m rad/kg] applied only before detection
  gradient_step: 0.0001  # [rad] central differences, evaluated only in TRACK

retreat:
  distance: 0.03  # [m] from actual trigger position, horizontally out of the wall
  duration: 2.0   # [s] quintic reference, zero speed/acceleration at both endpoints
  # Direction is the wall normal projected onto the base x-y plane (-x now).
  # No waiting phase and no -D_R*dq reaction: reuse the existing position tracker
  # and nullspace damping, with mass minimization disabled after detection.
  # Hold the final reference until launch duration or an existing stop condition.
  # Use stop_at_detachment:=false so leaving the wall does not end the retreat.
