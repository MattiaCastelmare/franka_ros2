# Controller: fr3_sim/controllers/optimized_hqp_full_online_perp.py
# Same Cartesian feedback and mass gradient in one QP with joint braking bounds.
# Mass descent uses only the online analytical gradient: no offline q_posture_ref.
initial_q: [0.0, -0.1517, 0.0, -2.6105, 0.0, 4.0295, 0.785]

approach:
  speed: 0.20                 # [m/s] same reference entry speed as baseline_perp
  acceleration_duration: 0.10 # [s] same smooth startup as baseline_perp
  penetration: 0.010          # [m] final REFERENCE overlap (10 mm), not actual penetration
  braking_distance: 0.004     # [m] cruise 6 mm beyond the plane, then brake over 4 mm
  hold_duration: 0.15         # [s] brief endpoint hold, then controller.done

tracking:
  kp_position: 100.0                # [1/s^2] same Cartesian position-error gain as baseline_perp
  kd_position: 20.0                 # [1/s] same Cartesian velocity-error gain as baseline_perp
  nullspace_damping: 12.0           # [1/s] mass-priority tuning before contact at ~0.35 s; see README
  qp_weight: 1000.0                # relative tracking weight in the single QP
  startup_ramp_duration: 0.1        # [s] online mass-gradient ramp; complete before nominal contact (~0.35 s)

mass_minimization:
  gain: 4.0                         # [N m rad/kg] online mass-priority tuning; see README and runs report
  direction: [-1.0, 0.0, 0.0]       # fixed world direction; parallel to current wall normal

safety:
  position_margin: 0.06            # [rad] hard margin used by the joint braking bounds
  velocity_max: [2.62, 2.62, 2.62, 2.62, 5.26, 4.18, 5.26]  # [rad/s]
  torque_max: [87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0]    # [N m], command AND nominal motor incl. g
  position_barrier_rate: 6.0        # [1/s] scale outward speed to remaining joint travel
  velocity_barrier_rate: 60.0       # [1/s] enforce the resulting speed bounds

qp:
  eps_abs: 1.0e-6
  eps_rel: 1.0e-6
  max_iter: 1000
  check_termination: 10
  feasibility_tolerance: 0.0002
  polish: false
  adaptive_rho: true

# A failed QP ends the trial with bounded damping.
failure_damping: [30.0, 30.0, 30.0, 20.0, 10.0, 10.0, 5.0]
