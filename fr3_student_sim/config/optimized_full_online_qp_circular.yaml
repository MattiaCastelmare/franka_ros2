# Controller: fr3_sim/controllers/optimized_full_online_qp_circular.py
# Online mass descent during each circle, then a physical return to initial_q.
# Both phases use a single QP with joint braking and torque limits.
initial_q: [0.0, -0.1517, 0.0, -2.6105, 0.0, 4.0295, 0.785]

circle:
  radius: 0.04                      # [m] same circle as the circular baseline
  period: 2.0                       # [s]
  ramp: 1.0                         # [s] reference startup, distinct from the mass ramp
  lap_return:
    transition_duration: 0.2        # [s] smooth braking and mass/posture/damping handover
    posture_gain: 25.0              # [1/s^2] only during return; damping = 2*sqrt(gain)
    position_tolerance: 0.001        # [rad] maximum joint error before restarting
    velocity_tolerance: 0.005        # [rad/s] maximum joint speed before restarting
    timeout: 5.0                    # [s] stop if the return does not settle
    duration: 2.0                   # [s] fixed restart schedule shared with the baseline

tracking:
  kp_position: 100.0                # [1/s^2] same Cartesian gain as the baseline
  kd_position: 20.0                 # [1/s] same Cartesian gain as the baseline
  nullspace_damping: 24.0           # [1/s], secondary acceleration target
  qp_weight: 1000.0                # relative tracking weight in the single QP
  posture_gain: 0.0                 # disabled during tracking, including custom YAML
  startup_ramp_duration: 0.1        # [s] mass/damping ramp on each tracking restart

mass_minimization:
  gain: 2.0                         # [N m rad/kg], analytical gradient evaluated online
  direction: [-1.0, 0.0, 0.0]       # fixed world direction, parallel to wall normal

safety:
  position_margin: 0.06            # [rad] hard position margin
  braking_buffer: 0.09             # [rad] extra clearance in the nominal braking bounds
  velocity_max: [2.62, 2.62, 2.62, 2.62, 5.26, 4.18, 5.26]  # [rad/s]
  torque_max: [87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0]    # [N m], command AND nominal motor incl. g
  position_barrier_rate: 6.0        # [1/s] scale outward speed to remaining joint travel
  velocity_barrier_rate: 60.0       # [1/s] enforce the resulting speed bounds

qp:
  eps_abs: 1.0e-6
  eps_rel: 1.0e-6
  max_iter: 1000
  check_termination: 10
  feasibility_tolerance: 0.0002
  polish: false
  adaptive_rho: true

# A failed QP ends the trial with bounded damping.
failure_damping: [30.0, 30.0, 30.0, 20.0, 10.0, 10.0, 5.0]
