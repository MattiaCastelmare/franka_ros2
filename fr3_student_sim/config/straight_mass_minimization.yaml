# Controller: students/straight_mass_minimization/controller.py
# Wall point and normal come from the runner's actual wall_config, even with wall:=false.
# Only fingertip position is tracked; orientation is free.
# Start angles [rad], ordered fr3_joint1..7.
initial_q: [0.0, -0.1517, 0.0, -2.6105, 0.0, 4.0295, 0.785]

# The reference moves along -normal. Braking starts at the scheduled plane
# crossing, without using the measured contact force or detector output.
# Startup needs at least approach_speed * ramp_time / 2 free distance.
line:
  approach_speed: 0.02  # [m/s] reference speed at the wall plane
  ramp_time: 0.5        # [s] smooth startup from rest
  penetration: 0.001   # [m] reference endpoint beyond the plane; actual penetration may differ
  hold_time: 0.2        # [s] scheduled hold after braking, then Controller.done

# Braking lasts 2 * penetration / approach_speed (0.1 s with these values).
# The launch duration remains an upper bound and may end the run earlier.
tracking:
  kp_position: 100.0   # [1/s^2] Cartesian position-error gain
  kd_position: 20.0    # [1/s] Cartesian velocity-error gain
  kd_nullspace: 4.0     # [1/s] nullspace velocity damping, separate from mass torque

mass_minimization:
  gain: 0.01           # [N m rad/kg] 0 cancels only tau_mass; mass/gradient are still computed
  gradient_step: 0.0001  # [rad] symmetric finite-difference step
