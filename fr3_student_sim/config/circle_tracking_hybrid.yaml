# Controller: students/circle_tracking/controller_hybrid.py
# Requires observer:=true. The first detection permanently selects RELEASE.
# Same initial pose, circle and TRACK gains as circle_tracking_mass_minimization.yaml.
# Only fingertip position is tracked; orientation remains free.
initial_q: [0.0, -0.1517, 0.0, -2.6105, 0.0, 4.0295, 0.785]  # [rad], fr3_joint1..7

circle:
  radius: 0.04  # [m] vertical x-z circle, starting at its -x extreme
  period: 8.0   # [s] period at cruise angular speed
  ramp: 1.0     # [s] smooth startup

tracking:
  kp_position: 100.0  # [1/s^2] TRACK Cartesian position-error gain
  kd_position: 20.0   # [1/s] TRACK Cartesian velocity-error gain
  kd_nullspace: 4.0   # [1/s] TRACK nullspace velocity damping

mass_minimization:
  gain: 0.01            # [N m rad/kg] TRACK mass torque; set to 0 for a matching baseline
  gradient_step: 0.0001  # [rad] symmetric finite-difference step, evaluated only in TRACK

reaction:
  # D_R [N m s/rad], fr3_joint1..7. A positive scalar also applies to all joints.
  # RELEASE commands only -D_R*dq, without tracking, mass torque or Coriolis compensation.
  damping: [30.0, 30.0, 30.0, 20.0, 10.0, 10.0, 5.0]
  # RELEASE continues until the launch duration or an existing stop condition.
  # Use stop_at_detachment:=false to keep recording after leaving the wall.
