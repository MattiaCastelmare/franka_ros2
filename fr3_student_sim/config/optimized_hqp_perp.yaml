# Controller: fr3_sim/controllers/optimized_hqp_perp.py
# Same Cartesian acceleration feedback, initial pose and reference as baseline_perp.
# Orientation is free. The observer affects constraint predictions, not tracking compensation.
initial_q: [0.0, -0.1517, 0.0, -2.6105, 0.0, 4.0295, 0.785]

approach:
  speed: 0.20                 # [m/s] same reference entry speed as baseline_perp
  acceleration_duration: 0.50 # [s] same smooth startup as baseline_perp
  penetration: 0.010          # [m] final REFERENCE overlap (10 mm), not actual penetration
  braking_distance: 0.004     # [m] cruise 6 mm beyond the plane, then brake over 4 mm
  hold_duration: 0.15         # [s] brief endpoint hold, then controller.done

# Offline closest-target posture from baseline_perp at the perpendicular contact point.
# Target: 30% less mass, with a 0.15 rad physical joint margin.
# Provenance: docs/optimized_hqp_perp_posture.json. Static feasibility does not
# establish the mass achieved during motion. Delete this key to omit attraction.
q_posture_ref: [0.0016912193606702206, 0.15746110356315518, 0.003155880790772255, -2.3590551359002445, 0.012246671391168376, 4.292372674902727, 0.7921759182639984]

tracking:
  kp_position: 100.0                # [1/s^2] same Cartesian position-error gain as baseline_perp
  kd_position: 20.0                 # [1/s] same Cartesian velocity-error gain as baseline_perp
  nullspace_damping: 10.0           # [1/s], secondary acceleration target
  posture_gain: 25.0                # [1/s^2], ignored without q_posture_ref
  startup_ramp_duration: 0.5        # [s] secondary attraction ramp; complete before nominal contact (~0.55 s)

mass_minimization:
  gain: 0.1                         # [N m rad/kg], analytical mass gradient
  direction: [-1.0, 0.0, 0.0]       # fixed world direction; parallel to current wall normal

safety:
  position_margin: 0.15             # [rad] preferred preventive margin, relaxable below
  velocity_max: [2.62, 2.62, 2.62, 2.62, 5.26, 4.18, 5.26]  # [rad/s]
  acceleration_max: 30.0             # [rad/s^2] preferred acceleration limit, relaxable
  torque_max: [87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0]    # [N m], command AND nominal motor incl. g
  position_barrier_rate: 8.0         # [1/s]
  velocity_barrier_rate: 10.0        # [1/s]
  command_delay_s: 0.003             # [s] transport/scheduling prediction allowance
  soft_constraints:
    enabled: true                   # three-level HQP for this perpendicular experiment
    hard_position_margin: 0.06       # [rad] mandatory; 0.01 rad before the runner's stop band
    acceleration_scale: 30.0         # [rad/s^2] normalize acceleration preference slack
    position_scale: 30.0             # [rad/s^2] normalize preventive position-barrier slack
    velocity_scale: 30.0             # [rad/s^2] normalize preventive velocity-barrier slack

disturbance_estimate:
  warmup_s: 0.2                     # [s] continuous observer history before consuming residual
  max_gap_s: 0.01                   # [s] maximum measurement/controller gap
  max_age_s: 0.01                   # [s] maximum snapshot age
  acceleration_error: 0.5           # [rad/s^2] valid-estimate uncertainty floor
  invalid_acceleration_error: 1.0   # [rad/s^2] initialization reserve with zero estimate
  lag_reserve_factor: 1.0           # empirical allowance for residual lag; not a certified bound

qp:
  primary_regularization: 1.0e-8
  eps_abs: 1.0e-6
  eps_rel: 1.0e-6
  max_iter: 1000
  check_termination: 10
  feasibility_tolerance: 0.0002
  equality_tolerance: 0.00002
  polish: false
  adaptive_rho: true

# Infeasible hard safety QP ends the trial; only the configured preferences have slack.
failure_damping: [30.0, 30.0, 30.0, 20.0, 10.0, 10.0, 5.0]
