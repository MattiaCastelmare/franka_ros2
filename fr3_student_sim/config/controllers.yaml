# Extra parameters for the effort controller inside Gazebo's controller_manager.
# Controller types and update_rate = 1000 Hz come from franka_gazebo_bringup's
# franka_gazebo_controllers.yaml, already loaded by the FR3 URDF.
# Joint order below matches the seven entries of each commanded torque vector.
fr3_effort_controller:
  ros__parameters:
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
