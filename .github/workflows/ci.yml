name: CI
on:
  push:
    branches: [ humble, develop, tesi_federico_urbini ]
  pull_request:
    branches: [ humble, develop ]
  workflow_dispatch:
jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare
        run: |
          mkdir -p ${{github.workspace}}/src

      - uses: actions/checkout@v2
        with:
          path: src/franka_ros2

      - name: VCS Import Dependencies
        working-directory: src/franka_ros2
        run: |
          sudo pip install vcstool
          vcs import < franka.repos --recursive

      - name: Build Docker Image
        uses: docker/build-push-action@v2
        with:
          tags: franka_ros2:humble
          file: Dockerfile
          push: false

      - name: Build
        uses: addnab/docker-run-action@v3
        with:
          image: franka_ros2:humble
          options: -v ${{github.workspace}}/:/ros/
          run: |
            cd /ros
            . /opt/ros/humble/setup.sh
            colcon build --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCHECK_TIDY=ON

      - name: Test
        uses: addnab/docker-run-action@v3
        with:
          image: franka_ros2:humble
          options: -v ${{github.workspace}}/:/ros/
          run: |
            cd /ros
            . /opt/ros/humble/setup.sh
            . install/setup.sh
            # Everything is built above; only the handover packages are tested
            # (franka_rt_controllers: clang-tidy, enabled by -DCHECK_TIDY=ON).
            colcon test --packages-select franka_experiments franka_rt_controllers
            colcon test-result --verbose

      - name: Upload Tests to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          # ament_python packages write pytest.xml, ament_cmake ones test_results/
          path: |
            build/*/pytest.xml
            build/*/test_results/*/*.xml

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            build/*/pytest.xml
            build/*/test_results/*/*.xml
