  # N2. A confirmed track that was CLOSE and then vanished keeps its row at a
  # conservatively propagated position. OGM-CBF does the mobile-robot analogue
  # with an occupancy map; the manipulator case is different in kind, because
  # the body that hides the obstacle is the robot's own and the self-mask then
  # deletes it from the depth image on purpose.
  minimal_l1_mem:
    description: >
      minimal_l1 + occlusion-aware obstacle memory (enable_obstacle_memory):
      a vanished confirmed track within 25 cm is held for 0.5 s at its
      propagated position, its surface eroded at 0.20 m/s of age, and released
      early when the robot's own body does not explain its disappearance.
