# SIM. Experiment conditions of the Gazebo runs (spec Phase 5, ground rule 3).
#
# The defaults disagree with each other (plan H12):
#   fr3_complete.yaml  tracking.enabled false, imm_enabled true ("TEMPORARY"),
#                      prediction.enabled false
#   fr3_control.yaml   obstacle_velocity_source residual, most enable_* false
#   launch_defaults    turns tracking + tracker + most enable_* ON
# So no run reads any of them implicitly. Every toggle below is passed to
# torque_control_stack.launch.py as a launch argument (cbf:) or merged into the
# run's perception config (perception:), and recorded in run_manifest.json.
#
# `cbf:` mirrors launch_defaults.yaml (test_conditions.py pins it), so the
# Gazebo stack runs with the flags a bare hardware launch would use. A run
# that wants a different value says so (run_gz_scenarios.py --set key=value).

cbf:
  lateral_evasion: true
  outrun_evasion: false
  livelock_escape: true
  latency_compensation: true
  zone_ladder: true
  uncertainty_margin: true
  vobs_in_hdot: true
  velocity_standoff: true
  obstacle_velocity_normal_guard: true
  obstacle_identity_guard: true
  multi_obstacle_k: 2
  iso_enabled: false
  iso_mode: automatic
  iso_ssm_speed_rows: false
  iso_monitor_enabled: false

# Not launch arguments, therefore NOT settable per run without editing
# fr3_control.yaml (out of scope). Recorded in the manifest as read.
cbf_yaml_only:
  - enable_sensor_range_uncertainty

conditions:
  residual:
    description: tracking off; v_obs from the scalar residual a^T qdot - ddot
    obstacle_tracking: false
    obstacle_velocity_source: residual
    perception: {tracking: {enabled: false, imm_enabled: false, prediction: {enabled: false}}}
  kf:
    description: cluster + Kalman track (constant-velocity KalmanTrack), source tracker
    obstacle_tracking: true
    obstacle_velocity_source: tracker
    perception: {tracking: {enabled: true, imm_enabled: false, prediction: {enabled: false}}}
  kf100:
    # kf, with the ONLY difference being the requested QP rate. Exists to
    # separate "asks for a rate the machine can hold" from "has fewer CBF
    # features", which `minimal` changes at once: minimal asks for 100 Hz,
    # held 99.97, tracked 31 mm and stayed clear, while kf asks for the
    # fr3_control.yaml default of 300 Hz and was measured holding 42-120 Hz
    # across seeds of one configuration. See OPEN_ISSUES.md S6.
    description: kf, with qp_rate_hz pinned to 100 (rate isolation for S6)
    obstacle_tracking: true
    obstacle_velocity_source: tracker
    perception: {tracking: {enabled: true, imm_enabled: false, prediction: {enabled: false}}}
    cbf_params:
      qp_rate_hz: 100.0
  imm:
    description: as kf, with the IMM (generic + ballistic) track
    obstacle_tracking: true
    obstacle_velocity_source: tracker
    perception: {tracking: {enabled: true, imm_enabled: true, prediction: {enabled: false}}}
  imm+pred:
    description: as imm, with ballistic prediction rows
    obstacle_tracking: true
    obstacle_velocity_source: tracker
    perception: {tracking: {enabled: true, imm_enabled: true, prediction: {enabled: true}}}

  # ═════════════════════════════════════════════════════════════════════════
  # ABLATION ARMS (Nov 2026): the complete framework against a minimal HOCBF
  # ═════════════════════════════════════════════════════════════════════════
  # Both arms sit on the SAME perception stack (kf: cluster + constant-velocity
  # KalmanTrack, obstacle_velocity_source tracker) and the SAME substrate, so
  # the only thing that varies is the obstacle barrier and the machinery that
  # has grown around it.
  #
  # SHARED, ON IN BOTH, deliberately NOT part of the ablation:
  #   the hard per-joint position/velocity/acceleration box, the q̈ slew box,
  #   joint-limit rows, self-collision rows, singularity rows,
  #   multi_obstacle_k, d_safe, k0_cbf/k1_cbf, every rho_slack, qp_rate_hz,
  #   the solver and its fallback ladder.
  # Those are actuator and self-protection constraints. Removing them would let
  # the minimal arm fail for reasons that have nothing to do with obstacle
  # avoidance — cbf_state_rows.py's header records the dq_ort = 10.9 rad/s²
  # blowup that the joint-limit rows exist to fix — and an experiment that
  # varies them is a different experiment.
  #
  # go_around is OFF IN BOTH ARMS. It is the newest mechanism and the one with
  # no A/B evidence, so isolating the barrier means it is in neither.

  full:
    description: >
      BASELINE. The complete framework exactly as a bare hardware launch runs
      it (the global cbf: block = launch_defaults.yaml), minus go_around.
      Five velocity-derived terms live (tracker source, vobs in hdot,
      uncertainty margin, latency compensation, velocity standoff) plus the
      zone ladder, the state governor, lateral evasion, livelock escape, the
      tangential bias, the retreat caps, the link-speed caps, the approach gate
      on both covariance margins, and the asymmetric h EMA.
    obstacle_tracking: true
    obstacle_velocity_source: tracker
    perception: {tracking: {enabled: true, imm_enabled: false, prediction: {enabled: false}}}
    cbf_params:
      enable_go_around: false
      # EXPERIMENTAL CONTROL, identical in both arms. At the shipped target of
      # 300 Hz neither arm reaches it in this container and they do not miss it
      # by the same amount: full achieved 110 Hz and minimal 196 Hz on the same
      # cell, because minimal builds 11 rows where full builds 22 and the OSQP
      # setup cost follows n_c. That is not a difference in control quality, but
      # it CONTAMINATES every rate-derived number — the slew box bounds ‖Δq̈‖ at
      # max_qddot_delta = 0.5 rad/s² per TICK, so the reported jerk ceiling is
      # 0.5/dt: 55 rad/s³ at 110 Hz against 98 at 196 Hz, from one shared
      # constant. 100 Hz is a rate both arms hold with margin, and it is the
      # rate every per-tick constant in fr3_control.yaml is defined at.
      qp_rate_hz: 100.0

  minimal:
    description: >
      Minimal HOCBF. h = d_measured - d_safe, hdot = n^T(Jp qdot - v_o) with
      v_o the tracked obstacle velocity projected on the contact normal
      (signed, enable_vobs_in_hdot), and one row per control point and cluster
      enforcing hddot + k1 hdot + k0 h >= 0 with the SAME k0/k1 and d_safe as
      full. No distance margin beyond d_safe, no uncertainty or latency
      tightening and so no approach gate to apply to them, no speed-proportional
      standoff, no braking margin, no gain scheduling, no task fade, no steering
      or escape bias, no rate-cap row families, and no filtering on h or on the
      qdot that feeds k1.
    obstacle_tracking: true
    obstacle_velocity_source: tracker
    perception: {tracking: {enabled: true, imm_enabled: false, prediction: {enabled: false}}}
    # Launch-argument flags, over the global cbf: block.
    cbf:
      uncertainty_margin: false        # k_sigma*sqrt(n'Pvv n)*T_react tightening
      latency_compensation: false      # h_pred + propagated covariance
      velocity_standoff: false         # d_safe_eff = d_safe + 0.25*v_o
      zone_ladder: false               # per-row k0/k1, slack price, task fade
      lateral_evasion: false           # sideways bias on the QP target
      livelock_escape: false           # nullspace nudge when blocked and still
      obstacle_velocity_normal_guard: false   # conditioning of v_o
      obstacle_identity_guard: false          # conditioning of v_o
      vobs_in_hdot: true               # KEPT: this IS the v_o of the formulation
    # fr3_control.yaml keys with no launch argument, passed to the node as ROS
    # parameters (cbf_param_overrides) so the installed YAML is never edited.
    cbf_params:
      enable_go_around: false              # off in both arms
      margin_gate_on_approach: false       # nothing left to gate
      enable_velocity_feedforward: false   # quadratic braking margin v^2/2a
      enable_sensor_range_uncertainty: false
      state_governor_enabled: false        # task fade on the robot's own state
      retreat_cap_enabled: false           # retreat rate-cap row family
      link_speed_rows_enabled: false       # task-space speed cap row family
      cbf_tangential_gain: 0.0             # the tangential steering bias
      cbf_h_recovery_alpha: 0.0            # h is the measurement, unsmoothed
      cbf_hdot_filter_alpha: 0.0           # k1 sees the measured qdot
      obstacle_velocity_residual_floor: false   # v_o = the plain projection
      obstacle_velocity_median: 1
      obstacle_velocity_median_s: 0.0
      obstacle_velocity_fast_trust: false
      qp_rate_hz: 100.0                    # same experimental control as full
      # Declared at their shipped defaults so the static-baseline sweep can
      # drive them with --set. Listing them here changes nothing on its own.
      rho_slack: 1000.0                    # price of the OBSTACLE family's slack
      obstacle_slack_max: 1000000.0        # 0.0 makes the obstacle rows hard
      qp_failure_policy: brake             # Task 1, shipped default
      slew_yields_to_state_box: true       # Task 1, shipped default
      brake_slew_limited: true

  # Option B step 1 (CBF_QP_SIMPLIFICATION_ANALYSIS.md, 2026-11-04): minimal,
  # with the obstacle slack changed from ONE shared quadratic slack to one
  # LINEAR (l1, exact-penalty) slack per obstacle row. Everything else is
  # byte-for-byte the minimal arm, so minimal vs minimal_l1 isolates the slack.
  minimal_l1:
    description: >
      minimal + per-row l1 obstacle slack (obstacle_slack_mode row_l1,
      rho_slack_l1 = 1e3). Otherwise identical to minimal:
      Minimal HOCBF. h = d_measured - d_safe, hdot = n^T(Jp qdot - v_o) with
      v_o the tracked obstacle velocity projected on the contact normal
      (signed, enable_vobs_in_hdot), and one row per control point and cluster
      enforcing hddot + k1 hdot + k0 h >= 0 with the SAME k0/k1 and d_safe as
      full. No distance margin beyond d_safe, no uncertainty or latency
      tightening and so no approach gate to apply to them, no speed-proportional
      standoff, no braking margin, no gain scheduling, no task fade, no steering
      or escape bias, no rate-cap row families, and no filtering on h or on the
      qdot that feeds k1.
    obstacle_tracking: true
    obstacle_velocity_source: tracker
    perception: {tracking: {enabled: true, imm_enabled: false, prediction: {enabled: false}}}
    # Launch-argument flags, over the global cbf: block.
    cbf:
      uncertainty_margin: false        # k_sigma*sqrt(n'Pvv n)*T_react tightening
      latency_compensation: false      # h_pred + propagated covariance
      velocity_standoff: false         # d_safe_eff = d_safe + 0.25*v_o
      zone_ladder: false               # per-row k0/k1, slack price, task fade
      lateral_evasion: false           # sideways bias on the QP target
      livelock_escape: false           # nullspace nudge when blocked and still
      obstacle_velocity_normal_guard: false   # conditioning of v_o
      obstacle_identity_guard: false          # conditioning of v_o
      vobs_in_hdot: true               # KEPT: this IS the v_o of the formulation
    # fr3_control.yaml keys with no launch argument, passed to the node as ROS
    # parameters (cbf_param_overrides) so the installed YAML is never edited.
    cbf_params:
      # Declared here ONLY so --set can drive them in a sweep; the values are
      # the ones config/fr3_control.yaml ships (k0_cbf 25.0, k1_cbf 10.5,
      # cbf_update_rate_hz 50.0), so a plain run of this condition is
      # byte-identical to before they were listed.
      k0_cbf: 25.0                         # HOCBF position gain (omega^2, omega=5)
      k1_cbf: 10.5                         # HOCBF velocity gain (~2*omega)
      cbf_update_rate_hz: 50.0             # geometry rebuild rate of A, h_bar, c
      vobs_hdot_max: 2.0                   # clamp on the v_o that enters hdot [m/s]
      obstacle_velocity_min_frames: 8       # frames a track must be UPDATED on before
                                           # its velocity is trusted (8 = ~265 ms at
                                           # 30 Hz). Listed only so --set can drive it;
                                           # 8 is the shipped value.
      enable_go_around: false              # off in both arms
      margin_gate_on_approach: false       # nothing left to gate
      enable_velocity_feedforward: false   # quadratic braking margin v^2/2a
      enable_sensor_range_uncertainty: false
      state_governor_enabled: false        # task fade on the robot's own state
      retreat_cap_enabled: false           # retreat rate-cap row family
      link_speed_rows_enabled: false       # task-space speed cap row family
      cbf_tangential_gain: 0.0             # the tangential steering bias
      cbf_h_recovery_alpha: 0.0            # h is the measurement, unsmoothed
      cbf_hdot_filter_alpha: 0.0           # k1 sees the measured qdot
      obstacle_velocity_residual_floor: false   # v_o = the plain projection
      obstacle_velocity_median: 1
      obstacle_velocity_median_s: 0.0
      obstacle_velocity_fast_trust: false
      qp_rate_hz: 100.0                    # same experimental control as full
      # Declared at their shipped defaults so the static-baseline sweep can
      # drive them with --set. Listing them here changes nothing on its own.
      rho_slack: 1000.0                    # price of the OBSTACLE family's slack
      obstacle_slack_max: 1000000.0        # 0.0 makes the obstacle rows hard
      obstacle_slack_mode: row_l1          # THE ONLY DIFFERENCE from minimal
      rho_slack_l1: 1000.0
      obstacle_row_slack_eps: 1000.0
      obstacle_row_slack_slots: 32
      obstacle_row_osqp_eps_rel: 1.0e-5
      # Task 1 (safe fallback) at its shipped default, listed so --set can
      # drive it. See condition minimal_l1_legacy_fallback.
      qp_failure_policy: brake
      slew_yields_to_state_box: true
      brake_slew_limited: true
      # Also at their shipped defaults, listed so the Task-1 STRESS grids can
      # drive them with --set. The fallback and the slew yield are dormant in a
      # healthy run, so the only way to measure them is to make the QP fail
      # (obstacle_slack_max 0 = hard obstacle rows, osqp_max_iter small = no
      # budget) or the slew box bite (max_qddot_delta small). Listing them here
      # changes nothing on its own.
      max_qddot_delta: 0.5
      osqp_max_iter: 20000
      k_brake: 3.0



  # Task 1 of OSCBF_ALIGNMENT_PLAN.md, as an A/B arm. The safe fallback and the
  # slew yield are the new DEFAULTS (they are a safety fix, not a feature), so
  # the arm that needs spelling out is the OLD one. minimal_l1 vs this isolates
  # the two knobs and nothing else: every other key below is minimal_l1's,
  # copied verbatim.
  minimal_l1_legacy_fallback:
    description: >
      minimal_l1 with the PRE-Task-1 failure behaviour restored, for the
      before/after comparison only. qp_failure_policy box_only: a failed QP
      re-solves the same objective over the hard box alone, i.e. it drops every
      barrier row and emits the clipped nominal at the tick the safety QP
      failed. slew_yields_to_state_box false: where the slew box and the hard
      state box are disjoint the result is pinned to the slew edge instead of
      handing back the state box, so the emitted command can sit outside the
      box that keeps the firmware reflex from firing.
    obstacle_tracking: true
    obstacle_velocity_source: tracker
    perception: {tracking: {enabled: true, imm_enabled: false, prediction: {enabled: false}}}
    cbf:
      uncertainty_margin: false
      latency_compensation: false
      velocity_standoff: false
      zone_ladder: false
      lateral_evasion: false
      livelock_escape: false
      obstacle_velocity_normal_guard: false
      obstacle_identity_guard: false
      vobs_in_hdot: true
    cbf_params:
      enable_go_around: false
      margin_gate_on_approach: false
      enable_velocity_feedforward: false
      enable_sensor_range_uncertainty: false
      state_governor_enabled: false
      retreat_cap_enabled: false
      link_speed_rows_enabled: false
      cbf_tangential_gain: 0.0
      cbf_h_recovery_alpha: 0.0
      cbf_hdot_filter_alpha: 0.0
      obstacle_velocity_residual_floor: false
      obstacle_velocity_median: 1
      obstacle_velocity_median_s: 0.0
      obstacle_velocity_fast_trust: false
      qp_rate_hz: 100.0
      rho_slack: 1000.0
      obstacle_slack_max: 1000000.0
      obstacle_slack_mode: row_l1
      rho_slack_l1: 1000.0
      obstacle_row_slack_eps: 1000.0
      obstacle_row_slack_slots: 32
      obstacle_row_osqp_eps_rel: 1.0e-5
      max_qddot_delta: 0.5
      osqp_max_iter: 20000
      k_brake: 3.0
      # ── THE ONLY TWO DIFFERENCES from minimal_l1 ──
      qp_failure_policy: box_only
      slew_yields_to_state_box: false
      brake_slew_limited: true

  # Task 2 of OSCBF_ALIGNMENT_PLAN.md: minimal_l1 + the CURVATURE term of ḧ.
  # The row's ḧ was aᵀq̈ + n̂ᵀJ̇ₚq̇; it is now aᵀq̈ + n̂ᵀJ̇ₚq̇ + κ with
  #     κ = n̂̇ᵀv_rel = ||(I − n̂n̂ᵀ)v_rel||² / ρ_c,   ρ_c = d_centre + r_obs,
  # so the bound becomes aᵀq̈ ≥ −k1·ḣ − k0·h̄ − ċ − κ. κ ≥ 0, so it RELAXES the
  # row by exactly the part of ḧ that sliding AROUND the obstacle produces for
  # free — which is the motion the old row charged the arm for.
  #
  # Only rows of a confirmed, moving track get a κ (same gate as
  # vobs_in_hdot), it is clamped, and ρ_c uses an UPPER bound on the obstacle's
  # curvature radius, so every approximation errs toward a tighter row.
  #
  # minimal_l1 vs this isolates the term and nothing else: every other key
  # below is minimal_l1's, copied verbatim.
  minimal_l1_curv:
    description: >
      minimal_l1 + the curvature term of hddot (enable_curvature_term, kappa =
      ||(I - n n^T) v_rel||^2 / rho_c, rho_c = d_centre + 0.06 m, clamped at
      2.0 m/s^2). Otherwise identical to minimal_l1: minimal HOCBF with
      h = d_measured - d_safe, hdot = n^T(Jp qdot - v_o), per-row l1 obstacle
      slack, no margins, no gain scheduling, no biases, no rate-cap rows.
    obstacle_tracking: true
    obstacle_velocity_source: tracker
    perception: {tracking: {enabled: true, imm_enabled: false, prediction: {enabled: false}}}
    cbf:
      uncertainty_margin: false
      latency_compensation: false
      velocity_standoff: false
      zone_ladder: false
      lateral_evasion: false
      livelock_escape: false
      obstacle_velocity_normal_guard: false
      obstacle_identity_guard: false
      vobs_in_hdot: true       # KEPT: kappa needs the track's 3D velocity
    cbf_params:
      enable_go_around: false
      margin_gate_on_approach: false
      enable_velocity_feedforward: false
      enable_sensor_range_uncertainty: false
      state_governor_enabled: false
      retreat_cap_enabled: false
      link_speed_rows_enabled: false
      cbf_tangential_gain: 0.0
      cbf_h_recovery_alpha: 0.0
      cbf_hdot_filter_alpha: 0.0
      obstacle_velocity_residual_floor: false
      obstacle_velocity_median: 1
      obstacle_velocity_median_s: 0.0
      obstacle_velocity_fast_trust: false
      qp_rate_hz: 100.0
      rho_slack: 1000.0
      obstacle_slack_max: 1000000.0
      obstacle_slack_mode: row_l1
      rho_slack_l1: 1000.0
      obstacle_row_slack_eps: 1000.0
      obstacle_row_slack_slots: 32
      obstacle_row_osqp_eps_rel: 1.0e-5
      qp_failure_policy: brake
      slew_yields_to_state_box: true
      brake_slew_limited: true
      max_qddot_delta: 0.5
      osqp_max_iter: 20000
      k_brake: 3.0
      # ── THE ONLY THREE DIFFERENCES from minimal_l1 ──
      enable_curvature_term: true
      # [m] UPPER bound on the obstacle's curvature radius. Every pentagon
      # scenario's ball is r = 0.05-0.06 m and that is known here, so the sim
      # uses 0.06 (an upper bound on all of them) instead of the shipped 0.30 m
      # torso-scale bound. A LARGER value is the conservative one (bigger
      # rho_c -> smaller kappa), so 0.06 is the TIGHTEST honest choice for
      # these scenes and the strongest test of the term: any over-relaxation it
      # can cause will show up here.
      curvature_obstacle_radius: 0.06
      curvature_kappa_max: 2.0

  # ═════════════════════════════════════════════════════════════════════════
  # EVIDENCE-CONDITIONED BARRIER TRUST (2026-11-06)
  # ═════════════════════════════════════════════════════════════════════════
  # Three mechanisms, each its own arm over `minimal_l1`, so each is isolated
  # exactly as minimal_l1 vs minimal_l1_curv isolates the curvature term.
  # Shared thesis: the barrier should trust and relax a row by what the
  # perception chain has EARNED on it, measured, not by a hand-set constant or
  # by a velocity covariance that does not predict the error that hurts.
  #
  # The error that hurts, measured on pentagon_wander_close against Gazebo
  # ground truth: the filter believed everything was at or beyond d_safe on
  # 4.4% of ticks while the arm was truly inside it, and at the worst instant
  # read 0.100 m against a true 0.0022 m.

  # N1. One scalar tightening per row, keyed on the row's evidence class.
  # Prior art: Measurement-Robust CBF assumes a fixed global error bound;
  # ATOM-CBF adapts it from an out-of-distribution score. Here the class comes
  # from the perception chain's own bookkeeping -- and `coasting` (a track
  # still reported but no longer UPDATED) is the class no single frame can see.
  minimal_l1_evid:
    description: >
      minimal_l1 + the evidence-keyed distance margin (enable_evidence_margin).
      fresh 1 cm, young 4 cm, coasting 8 cm, untracked 2 cm. Otherwise
      byte-identical to minimal_l1.
    obstacle_tracking: true
    obstacle_velocity_source: tracker
    perception: {tracking: {enabled: true, imm_enabled: false, prediction: {enabled: false}}}
    cbf:
      uncertainty_margin: false
      latency_compensation: false
      velocity_standoff: false
      zone_ladder: false
      lateral_evasion: false
      livelock_escape: false
      obstacle_velocity_normal_guard: false
      obstacle_identity_guard: false
      vobs_in_hdot: true
    cbf_params:
      # Declared at the values minimal_l1 declares (= the ones
      # config/fr3_control.yaml ships), so the resolved record of this arm
      # differs from minimal_l1's in ONLY this arm's own mechanism (ground
      # rule 3: nothing implicit).
      k0_cbf: 25.0
      k1_cbf: 10.5
      cbf_update_rate_hz: 50.0
      vobs_hdot_max: 2.0
      obstacle_velocity_min_frames: 8
      enable_go_around: false
      margin_gate_on_approach: false
      enable_velocity_feedforward: false
      enable_sensor_range_uncertainty: false
      state_governor_enabled: false
      retreat_cap_enabled: false
      link_speed_rows_enabled: false
      cbf_tangential_gain: 0.0
      cbf_h_recovery_alpha: 0.0
      cbf_hdot_filter_alpha: 0.0
      obstacle_velocity_residual_floor: false
      obstacle_velocity_median: 1
      obstacle_velocity_median_s: 0.0
      obstacle_velocity_fast_trust: false
      qp_rate_hz: 100.0
      rho_slack: 1000.0
      obstacle_slack_max: 1000000.0
      obstacle_slack_mode: row_l1
      rho_slack_l1: 1000.0
      obstacle_row_slack_eps: 1000.0
      obstacle_row_slack_slots: 32
      obstacle_row_osqp_eps_rel: 1.0e-5
      qp_failure_policy: brake
      slew_yields_to_state_box: true
      brake_slew_limited: true
      max_qddot_delta: 0.5
      osqp_max_iter: 20000
      k_brake: 3.0
      enable_evidence_margin: true
      evidence_margin_fresh_m: 0.01
      evidence_margin_young_m: 0.04
      evidence_margin_coasting_m: 0.08
      evidence_margin_untracked_m: 0.02
      evidence_coast_grace_s: 0.07

  # The prediction-enabled reference for N1. `imm+pred` is the ONLY shipped
  # perception arm where a track is reported from a prediction instead of a
  # measurement, so it is the only stack on which the `coasting` evidence
  # class can occur at all. On minimal_l1 (prediction off) frames_seen
  # advances on every reported track and N1 collapses to fresh/young.
  imm_pred_l1:
    description: >
      minimal_l1 on the imm+pred perception stack, evidence margin OFF.
      The reference for imm_pred_l1_evid.
    obstacle_tracking: true
    obstacle_velocity_source: tracker
    perception: {tracking: {enabled: true, imm_enabled: true, prediction: {enabled: true}}}
    cbf:
      uncertainty_margin: false
      latency_compensation: false
      velocity_standoff: false
      zone_ladder: false
      lateral_evasion: false
      livelock_escape: false
      obstacle_velocity_normal_guard: false
      obstacle_identity_guard: false
      vobs_in_hdot: true
    cbf_params:
      # Declared at the values minimal_l1 declares (= the ones
