fr3_arm_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController

    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7

    command_interfaces: [position]
    state_interfaces:   [position, velocity]

    allow_partial_joints_goal: false
    open_loop_control: true
    allow_integration_in_goal_trajectories: true

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      fr3_joint1: {trajectory: 0.05, goal: 0.02}
      fr3_joint2: {trajectory: 0.05, goal: 0.02}
      fr3_joint3: {trajectory: 0.05, goal: 0.02}
      fr3_joint4: {trajectory: 0.05, goal: 0.02}
      fr3_joint5: {trajectory: 0.05, goal: 0.02}
      fr3_joint6: {trajectory: 0.05, goal: 0.02}
      fr3_joint7: {trajectory: 0.05, goal: 0.02}
