# Parametri per Online Avoidance Controller v3
# =============================================
# PRIORITÀ: EVITARE COLLISIONI

online_avoidance_controller:
  ros__parameters:
    # Frequenza di controllo (alta per reattività)
    control_rate: 100.0  # Hz
    
    # Distanze critiche per l'avoidance
    influence_distance: 0.35   # m - distanza in cui l'avoidance inizia ad agire
    aggressive_distance: 0.20  # m - sotto questa distanza l'avoidance diventa "spinta via" (molto visibile)
    safety_margin: 0.08        # m - distanza minima assoluta
    
    # Guadagni di controllo
    # Obiettivo: evitare in modo chiaro (soprattutto < 20 cm) senza rendere il moto ingestibile.
    nullspace_gain: 0.25
    tangential_gain: 0.10
    aggressive_gain_scale: 4.0
    max_joint_velocity: 0.20

    # Capsule geometry (m)
    # NOTE: ripristinati i raggi originali (i più grandi). Quelli piccoli anticipano falsi contatti
    # e possono rendere l'avoidance troppo "timida" o incoerente sul WP1.
    capsule_radii: [0.15, 0.12, 0.13]
    capsule_fractions: [0.00, 0.35, 0.25, 0.75, 0.60, 0.95]

    # Capsule↔OBB distance computation
    box_projection_iters: 8
    repulsion_spread_enable: true
    repulsion_spread_samples: 5
    repulsion_spread_half_length: 0.10

    # ============================================
    # EXTRA SAFETY: PAVIMENTO + AUTOCOLLISIONE
    # (approssimazioni veloci: capsule-capsule e piano z=ground_z)
    # ============================================
    enable_ground_avoidance: true
    ground_z: 0.0
    ground_influence_distance: 0.15
    ground_safety_margin: 0.05
    ground_gain: 0.15

    # Requested: disable self-collision check (keep large capsule radii for external obstacles).
    enable_self_collision_avoidance: false
    self_influence_distance: 0.12
    self_safety_margin: 0.03
    self_gain: 0.25
    # NOTE: self-collision via coarse capsules can create false positives near HOME.
    # Skipping more nearby links reduces constant self-repulsion and mid-way stalls.
    self_skip_adjacent_links: 3
    
    # Ostacoli da escludere dalla collisione detection
    excluded_obstacles:
      - "ground_plane"
      - "ground"
      - "floor"
      - "plane"
    
    # NOTE:
    # In questo repo ci sono stati in passato parametri "legacy" (repulsive_gain, use_null_space, ecc.)
    # che NON vengono letti dall'attuale online_avoidance_controller.
    # Li rimuoviamo per evitare chiavi duplicate (es. tangential_gain) che in YAML possono sovrascriversi.
