# ========================================================================
# MINIMAL AVOIDANCE CONTROLLER PARAMETERS (DISTANCE-ONLY MODE)
# ========================================================================
# This controller ONLY computes distances to obstacles and publishes:
# - Minimum distance (raw and smoothed)
# - Closest constraint Jacobian
# - Closest hazard label
# - Visualization markers
#
# NO velocity avoidance computation (placeholder qdot=0)
# ========================================================================

online_avoidance_controller:
  ros__parameters:
    # =====================
    # CONTROL RATE
    # =====================
    control_rate: 100.0  # Hz

    # =====================
    # EXTERNAL OBSTACLES
    # =====================
    influence_distance: 0.30  # [m] detection/tracking radius
    
    excluded_obstacles:
      - "ground_plane"
      - "ground"
      - "floor"
      - "plane"

    # =====================
    # CAPSULE GEOMETRY
    # =====================
    # Radii for 3 capsule groups (8 total capsules: base, 6 joints, flange)
    capsule_radii: [0.15, 0.12, 0.13]
    
    # Fractions along joint segments: [p0_0, p1_0, p0_1, p1_1, p0_2, p1_2]
    capsule_fractions: [0.00, 0.35, 0.25, 0.75, 0.60, 0.95]
    
    # Debug: show only capsule N (-1 = all)
    #   -1 = all capsules (NORMAL)
    #    0 = base → joint1
    #    1 = joint1 → joint2
    #    2 = joint2 → joint3
    #    3 = joint3 → joint4
    #    4 = joint4 → joint5
    #    5 = joint5 → joint6
    #    6 = joint6 → joint7
    #    7 = joint7 → flange
    debug_capsule_index: -1

    # =====================
    # DISTANCE COMPUTATION
    # =====================
    box_projection_iters: 8
    
    # Multi-point repulsion spread (sample multiple points along capsule segment)
    repulsion_spread_enable: true
    repulsion_spread_samples: 5        # odd number recommended
    repulsion_spread_half_length: 0.10  # [m]

    # =====================
    # VISUALIZATION
    # =====================
    distance_inflation: 0.0  # [m] conservative offset for display
