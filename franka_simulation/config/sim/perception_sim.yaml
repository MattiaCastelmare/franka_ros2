# SIM. Overrides merged into franka_experiments/config/fr3_complete.yaml for
# Gazebo runs (ground rule 2: only what is physically different in sim, one
# comment per key). Experiment toggles (tracking / IMM / prediction) are NOT
# here: they come from the condition (franka_simulation_experiments
# config/conditions.yaml), set explicitly per run (plan H12).
#
# Deliberately NOT overridden:
#  * the depth encoding: depth_sim_adapter publishes the same 16UC1 millimetres
#    the engine reads from the D455;
#  * distance.depth_rate_hz: torque_control_stack writes it from
#    camera_depth_profile, the same path the rig uses.
booleans:
  # Headless sim has no display for the OpenCV window. The container's OpenCV
  # bundles Qt with the xcb platform only (no offscreen plugin, no Xvfb), so
  # without a display cv2.imshow ABORTS the node (measured: exit -6 on the first
  # frame). The overlay is still drawn and published (publish_overlay_image), so
  # only imshow + waitKey are skipped. gz_cbf_stack gui:=true turns it back on.
  visualize: false

meshes:
  # RAISED 3000 -> 12000 for sim only (2026-11-06, measured).
  #
  # `robot_depth` in MaskBuilder is a z-buffer filled from projected mesh
  # samples; pixels without a sample inherit the nearest robot surface via a
  # min-filter. Too few samples and that fill is wrong at the silhouette edge:
  # the model surface lands FARTHER than the arm really is, so the arm's own
  # pixels read as being in front of the model and the depth gate UN-EXCLUDES
  # them. They then become obstacle rows at a gap of ~0 — the arm is its own
  # obstacle.
  #
  # Measured on sim_runs/control_sweep_20261105 at 3000 samples/link:
  #   calibration residual measured - model = -2.8 cm (spread 3.5 cm),
  #   and 17.5% of the arm's own pixels in front of the 16 cm depth gate,
  #   reported by the node as "phantoms on the arm";
  #   distance_engine's own leak counter: 24-25 px EVERY frame, in every cell
  #   and every scenario of the campaign.
  # utils/calibration_check documents the density swing this rides on: the
  # residual goes -0.9 cm at 300 samples/link to +6.0 cm at 20000, on ONE
  # unchanged extrinsic. Denser sampling moves the model surface NEARER, which
  # is the direction that stops the un-exclusion.
  #
  # Sim only, and deliberately: on the rig the same number trades against a
  # real hand-eye error (rig residual was -6.1 cm, 2026-09-21), so it must be
  # re-measured there rather than copied from here. The cost is paid once, at
  # startup, not per frame.
  sample_points_per_link: 12000
