controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    fr3_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    fr3_gripper:
      type: position_controllers/GripperActionController

# --- Controller braccio (FollowJointTrajectory) per MoveIt
fr3_arm_controller:
  ros__parameters:
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7

    # In simulazione tipicamente basta 'position'
    command_interfaces: [position]
    state_interfaces:   [position, velocity]

    allow_partial_joints_goal: false
    open_loop_control: true
    allow_integration_in_goal_trajectories: true

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      fr3_joint1: {trajectory: 0.05, goal: 0.02}
      fr3_joint2: {trajectory: 0.05, goal: 0.02}
      fr3_joint3: {trajectory: 0.05, goal: 0.02}
      fr3_joint4: {trajectory: 0.05, goal: 0.02}
      fr3_joint5: {trajectory: 0.05, goal: 0.02}
      fr3_joint6: {trajectory: 0.05, goal: 0.02}
      fr3_joint7: {trajectory: 0.05, goal: 0.02}

# Configurazione joint_state_broadcaster  
joint_state_broadcaster:
  ros__parameters:
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
      - fr3_finger_joint1
    interfaces:
      - position
      - velocity
      - effort

# --- Gripper (opzionale)
fr3_gripper:
  ros__parameters:
    joint: fr3_finger_joint1
    action_monitor_rate: 20.0
    allow_stalling: false
    max_effort: 100.0
    goal_tolerance: 0.01
    max_velocity: 0.2
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0
