# MoveIt Servo Configuration for FR3
# Local reactive planning for Hybrid Planning

/**:
  moveit_servo:
    ros__parameters:
      ## Properties of incoming commands
      command_in_type: "speed_units"  # "unitless" or "speed_units"
      scale:
        # Scale parameters are only used if command_in_type is "unitless"
        linear: 0.4   # Max linear velocity (m/s)
        rotational: 0.8  # Max angular velocity (rad/s)
        joint: 0.5  # Max joint velocity (rad/s)

      ## Properties of outgoing commands
      publish_period: 0.01  # Period (seconds) between outgoing commands (100 Hz)
      low_latency_mode: false  # Use low-latency mode (may degrade performance)
      
      # Command output topic
      command_out_topic: /fr3_arm_controller/joint_trajectory
      command_out_type: trajectory_msgs/JointTrajectory
      publish_joint_positions: true
      publish_joint_velocities: true
      publish_joint_accelerations: false

      ## Plugins for smoothing outgoing commands
      use_smoothing: true
      smoothing_filter_coefficient: 0.3  # 0.0-1.0, lower = more smoothing

      ## MoveIt properties
      move_group_name: fr3_arm
      planning_frame: fr3_link0
      ee_frame_name: fr3_hand_tcp
      robot_link_command_frame: fr3_link0

      ## Checking for self-collisions and scene collisions
      check_collisions: true
      collision_check_rate: 10.0  # Hz
      collision_check_type: "threshold_distance"
      self_collision_proximity_threshold: 0.015  # meters
      scene_collision_proximity_threshold: 0.03  # meters

      ## Collision avoidance behavior
      self_collision_avoidance_scale: 0.7 # 0.0-1.0
      scene_collision_avoidance_scale: 0.5  # 0.0-1.0
      collision_velocity_scale: 0.2  # Scale velocity near collision (0=stop)

      ## Singularity avoidance
      lower_singularity_threshold: 17.0  # degrees
      hard_stop_singularity_threshold: 30.0  # degrees
      leaving_singularity_threshold_multiplier: 2.0

      ## Topic names for subscriptions
      cartesian_command_in_topic: ~/delta_twist_cmds  # geometry_msgs/TwistStamped
      joint_command_in_topic: ~/delta_joint_cmds  # control_msgs/JointJog
      robot_link_command_frame: fr3_link0

      ## Timeout and halt behavior
      incoming_command_timeout: 0.5  # seconds - stop if no command
      num_outgoing_halt_msgs_to_publish: 4  # Safety halt messages
      halt_all_joints_in_joint_mode: true
      halt_all_joints_in_cartesian_mode: true

      ## Joint limits enforcement
      override_velocity_scaling_factor: 0.3  # 0.0-1.0
      
      ## Status monitoring
      status_topic: ~/status  # moveit_msgs/ServoStatus

      ## Joint configuration (FR3 specific)
      joint_topic: /joint_states
      joints:
        - fr3_joint1
        - fr3_joint2
        - fr3_joint3
        - fr3_joint4
        - fr3_joint5
        - fr3_joint6
        - fr3_joint7