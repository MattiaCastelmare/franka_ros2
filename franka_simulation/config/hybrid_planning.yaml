# Hybrid Planning Configuration
# Parametri per coordinamento global planner (OMPL) + local planner (Servo)

use_sim_time: true
/**:
  hybrid_planning_manager:
    ros__parameters:
      # Planning groups
      planning_group: "fr3_arm"
      base_frame: "fr3_link0"
      end_effector_frame: "fr3_hand_tcp"
      
      # Global planner (OMPL) configuration
      global_planner:
        id: "RRTConnect"
        plugin: "ompl_interface/OMPLPlanner"
        planning_time: 5.0
        max_planning_attempts: 3
        replan_frequency: 2.0  # Hz - frequency for replanning
        velocity_scaling: 0.5
        acceleration_scaling: 0.3
        
      # Local planner (Servo) configuration  
      local_planner:
        plugin: "moveit_servo/ServoNode"
        control_frequency: 100.0  # Hz - servo update rate
        smoothing_filter_coefficient: 0.3
        velocity_scaling: 0.3
        
      # Hybrid coordination
      coordination:
        switching_threshold_distance: 0.05  # meters - when to switch to local
        replan_trigger_distance: 0.10  # meters - obstacle proximity for replan
        timeout_global_planning: 10.0  # seconds
        timeout_local_execution: 5.0  # seconds
        
      # Scene monitoring for replanning
      scene_monitoring:
        monitor_scene_diff: true
        scene_update_period: 0.1  # seconds - 10 Hz
        collision_check_distance: 0.02  # meters - min clearance
        
      # Safety limits
      safety:
        max_cartesian_speed: 0.5  # m/s
        max_joint_speed: 1.0  # rad/s
        emergency_stop_distance: 0.01  # meters

  # Servo-specific parameters (additional)
  servo_node:
    ros__parameters:
      # MoveIt Servo configuration
      use_gazebo: true
      smoothing_filter_coefficient: 0.3
      
      # Command interface
      command_in_type: "speed_units"  # or "unitless"
      command_out_type: "trajectory_msgs/JointTrajectory"
      
      # Collision checking
      check_collisions: true
      collision_check_rate: 10.0  # Hz
      self_collision_proximity_threshold: 0.01  # meters
      scene_collision_proximity_threshold: 0.02  # meters
      
      # Control parameters  
      incoming_command_timeout: 0.5  # seconds
      num_outgoing_halt_msgs_to_publish: 4
      
      # Joint limits
      lower_singularity_threshold: 17.0  # degrees
      hard_stop_singularity_threshold: 30.0  # degrees
      
      # Publishing
      publish_period: 0.01  # 100 Hz
      publish_joint_positions: true
      publish_joint_velocities: true
      publish_joint_accelerations: false

# Planning scene parameters (reuse from move_group but add hybrid-specific)
planning_scene_monitor:
  ros__parameters:
    publish_planning_scene: true
    publish_geometry_updates: true
    publish_state_updates: true
    publish_transforms_updates: true
    
    # Hybrid-specific: more aggressive monitoring
    monitor_dynamics: true
    default_robot_padding: 0.03  # Slightly tighter than default
    default_object_padding: 0.08
    default_attached_padding: 0.02